<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- No hardcoded robots meta: indexing is controlled by the workshop row's
     `published` flag, which the /workshop/:slug route turns into an
     X-Robots-Tag: noindex header while the workshop is unpublished. -->
<title>Workshop · Bharat Bhatia</title>
<meta name="description" content="A full-day photo-to-print workshop in Zürich: shoot fine art photography and leave with a large-format archival print made in the artist's own atelier.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400;1,500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/shared/chrome.css?v=3">
<script src="/shared/chrome.js?v=3"></script>
<style>
/* This page carries its own palette (the same tokens the main site defines) and
   turns with the shared chrome's day/night toggle: the two dark blocks below —
   the OS preference guarded so an explicit light choice outranks it, then the
   explicit dark choice — test the data-theme attribute chrome.js writes. The
   content recolours through these tokens alone, so unlike the fountain map there
   is nothing to repaint by hand on a theme flip. */
:root {
  --fi: 'Playfair Display', Georgia, serif;
  --fm: 'DM Mono', ui-monospace, monospace;
  --bg:      #FAFAF8;
  --bg2:     #F0EFEC;
  --fg:      #111110;
  --fg-m:    rgba(17,17,16,.6);
  --fg-l:    rgba(17,17,16,.35);
  --border:  rgba(17,17,16,.1);
  --pink:    #C8907A;
  --pink-d:  #A87060;
  --field:   #fff;
  /* The admin bar is inverted against the page, so its own borders and hints
     use their own tokens that flip with the theme. */
  --ab-line: #3A3733;
  --ab-mute: #9C968C;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:     #0E0E0C;
    --bg2:    #1A1A18;
    --fg:     #F0EFEC;
    --fg-m:   rgba(240,239,236,.72);
    --fg-l:   rgba(240,239,236,.42);
    --border: rgba(240,239,236,.1);
    --pink:   #E38F63;
    --pink-d: #F2AE88;
    --field:  #1A1A18;
    --ab-line:#D6D2CA;
    --ab-mute:#7C776E;
  }
}
:root[data-theme="dark"] {
  --bg:     #0E0E0C;
  --bg2:    #1A1A18;
  --fg:     #F0EFEC;
  --fg-m:   rgba(240,239,236,.72);
  --fg-l:   rgba(240,239,236,.42);
  --border: rgba(240,239,236,.1);
  --pink:   #E38F63;
  --pink-d: #F2AE88;
  --field:  #1A1A18;
  --ab-line:#D6D2CA;
  --ab-mute:#7C776E;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--fm); font-weight: 300;
  -webkit-font-smoothing: antialiased; transition: background .4s, color .4s; }
a { color: inherit; }

/* The content column, the same 680px measure and top offset the workshop had
   inside the main SPA. Bottom padding leaves room for the admin bar so it never
   covers the last date. */
.ws-wrap { min-height: 100vh; padding: 8rem 2rem 4rem; }
.ws-wrap.has-admin { padding-bottom: 7rem; }
.ws-inner { max-width: 680px; margin: 0 auto; }

.ws-heading { font-family: var(--fi); font-size: clamp(2.5rem,5vw,4.5rem); font-style: italic;
  font-weight: 400; line-height: .95; letter-spacing: -.03em; color: var(--fg); margin-bottom: 2.5rem; }
.ws-body p { font-size: 12px; letter-spacing: .02em; color: var(--fg-m); line-height: 1.9; margin-bottom: 1rem; }
.ws-body p:last-child { margin-bottom: 0; }
.ws-spec { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-l); line-height: 1.8; }
.ws-divider { width: 40px; height: 1px; background: var(--border); margin: 2rem 0; }
.ws-section-title { font-family: var(--fm); font-size: 8px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--fg-l); margin: 0 0 1rem; }
.ws-banner { font-family: var(--fm); font-size: 10px; letter-spacing: .02em; color: var(--pink-d);
  background: rgba(200,144,122,.1); border: 1px solid rgba(200,144,122,.3); border-radius: 3px;
  padding: .75rem 1rem; margin-bottom: 1.75rem; line-height: 1.6; }
.ws-sched-row { display: flex; gap: 1rem; padding: .45rem 0; border-bottom: 1px solid var(--border);
  font-size: 11px; line-height: 1.7; }
.ws-sched-row:last-child { border-bottom: none; }
.ws-sched-time { font-family: var(--fm); color: var(--fg-l); flex-shrink: 0; width: 46px; letter-spacing: .04em; }
.ws-sched-text { color: var(--fg-m); }
.ws-list { list-style: none; padding: 0; margin: 0; }
.ws-list li { font-size: 11px; color: var(--fg-m); line-height: 1.8; padding-left: 1.1rem; position: relative; }
.ws-list li::before { content: '·'; position: absolute; left: .3rem; color: var(--fg-l); }
.ws-gallery { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
.ws-shot { position: relative; }
.ws-shot img { width: 100%; height: auto; display: block; }
.ws-date-card { display: flex; justify-content: space-between; align-items: center; gap: 1rem;
  border: 1px solid var(--border); border-radius: 2px; padding: .9rem 1.1rem; margin-bottom: .6rem; }
.ws-date-label { font-size: 12px; color: var(--fg); }
.ws-date-spots { font-family: var(--fm); font-size: 9px; letter-spacing: .06em; color: var(--fg-l); margin-top: .25rem; }
.ws-date-right { display: flex; align-items: center; gap: .9rem; flex-shrink: 0; }
.ws-date-price { font-family: var(--fm); font-size: 11px; color: var(--fg); letter-spacing: .04em; }
.ws-book-btn { font-family: var(--fm); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  padding: .55rem .9rem; background: var(--fg); color: var(--bg); border: none; border-radius: 2px; }
.ws-book-btn[disabled] { opacity: .45; }
.ws-no-dates { font-size: 11px; color: var(--fg-l); }
@media(max-width:640px){
  .ws-wrap { padding: 6.5rem 1.5rem 4rem; }
  .ws-date-card { flex-direction: column; align-items: flex-start; }
  .ws-gallery { grid-template-columns: 1fr; }
}

/* ── ADMIN (inline, the same shape as the fountain map and the client boards) ──
   A bar across the foot, shown only once /api/workshops/<slug> says this viewer
   is the admin. --ab-* flip with the theme; the bar is inverted against the page. */
#adminbar { display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 600;
  background: var(--fg); color: var(--bg); padding: 10px 0;
  padding-bottom: calc(10px + env(safe-area-inset-bottom,0px)); }
#adminbar.on { display: block; }
#adminbar .ab-in { max-width: 720px; margin: 0 auto; padding: 0 1.5rem;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
#adminbar .ab-label { font-family: var(--fm); font-size: 8px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ab-mute); }
#adminbar button { background: transparent; color: var(--bg); border: 1px solid var(--ab-line);
  border-radius: 2px; padding: 6px 11px; font-family: var(--fm); font-size: 11px; cursor: pointer; }
#adminbar button:hover { border-color: var(--bg); }
/* Admin affordances that sit on the content: a small edit tab per section, and
   the delete button over a gallery photo. Hidden for everyone but the admin. */
.adm { display: none; }
body.is-admin .adm { display: inline-flex; }
.edit-tab { align-items: center; gap: .3rem; font-family: var(--fm); font-size: 8px; letter-spacing: .08em;
  text-transform: uppercase; color: var(--pink-d); background: none; border: 1px dashed var(--border);
  border-radius: 2px; padding: 2px 7px; margin-left: .6rem; cursor: pointer; vertical-align: middle; }
.edit-tab:hover { border-color: var(--pink-d); }
.ws-shot .del { position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%;
  background: rgba(14,14,12,.72); color: #fff; border: none; font-size: 13px; line-height: 1; cursor: pointer; }

button, input, textarea, select { font-family: var(--fm); }

/* Buttons in the modal / date editor. */
.btn { font-family: var(--fm); font-size: 11px; color: var(--fg); background: var(--field);
  border: 1px solid var(--border); border-radius: 2px; padding: 8px 14px; cursor: pointer;
  transition: border-color .18s; }
.btn:hover { border-color: var(--fg); }
.btn-primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* ── MODAL (the ask() dialog, copied from the fountain map) ── */
#modal { position: fixed; inset: 0; background: rgba(14,14,12,.55); z-index: 1200;
  display: none; align-items: center; justify-content: center; padding: 1.5rem; }
#modal.on { display: flex; }
.modal-card { background: var(--bg); border: 1px solid var(--border); border-radius: 4px;
  padding: 1.5rem; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; }
.modal-card.wide { max-width: 560px; }
.modal-card h4 { font-family: var(--fi); font-style: italic; font-weight: 400; font-size: 18px; margin-bottom: .35rem; }
.modal-card > p { font-size: 11px; color: var(--fg-m); line-height: 1.6; margin-bottom: 1rem; }
.m-label { display: block; font-size: 11px; color: var(--fg-m); margin: .85rem 0 .3rem; }
.m-hint { font-size: 10px; color: var(--fg-l); margin-top: .25rem; line-height: 1.5; }
#modal input[type=text], #modal textarea, #modal input[type=date], #modal input[type=number], #modal select {
  width: 100%; font-size: 12px; font-weight: 300; color: var(--fg); background: var(--field);
  border: 1px solid var(--border); border-radius: 2px; padding: 9px 11px; }
#modal input:focus, #modal textarea:focus, #modal select:focus { outline: none; border-color: var(--fg); }
#modal textarea { resize: vertical; min-height: 76px; line-height: 1.6; }
.modal-row { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.25rem; }
.date-row { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; padding: .6rem 0;
  border-bottom: 1px solid var(--border); font-size: 11px; }
.date-row:last-child { border-bottom: none; }
.date-row .grow { flex: 1; min-width: 120px; color: var(--fg-m); }
.date-pill { font-family: var(--fm); font-size: 8px; letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 6px; border-radius: 2px; border: 1px solid var(--border); color: var(--fg-l); }

#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%) translateY(8px);
  background: var(--fg); color: var(--bg); padding: 10px 18px; border-radius: 2px; font-size: 12px;
  z-index: 1300; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ── LIGHTBOX ── */
#lb { position: fixed; inset: 0; background: rgba(14,14,12,.92); z-index: 1400; display: none;
  align-items: center; justify-content: center; padding: 2rem; }
#lb.on { display: flex; }
#lb img { max-width: 100%; max-height: 100%; display: block; }

/* The shared cursor swells on links/buttons via chrome.css; name the page's own
   clickable non-anchors so the OS pointer stays hidden under the dot on them. */
@media (hover:hover) and (pointer:fine) {
  .ws-shot img, .edit-tab, .btn, #adminbar button, .ws-shot .del { cursor: none; }
}
</style>
</head>
<body>

<main class="ws-wrap"><div class="ws-inner" id="ws-content"></div></main>

<!-- Admin bar: inline management, shown only to the admin. -->
<div id="adminbar">
  <div class="ab-in">
    <span class="ab-label">Admin view</span>
    <button onclick="editCopy()">Edit copy</button>
    <button onclick="openDates()">Dates</button>
    <button onclick="addPhoto()">+ Photo</button>
  </div>
</div>

<div id="modal"><div class="modal-card" id="modal-card"></div></div>
<input type="file" id="picker" accept="image/*" style="display:none">
<div id="lb" onclick="this.classList.remove('on')"><img id="lb-img" alt=""></div>
<div id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
// The slug is read from the path — /workshops/<slug>. One template serves every
// workshop; the data (copy, dates, photos) comes from /api/workshops/<slug>.
var SLUG = decodeURIComponent((location.pathname.match(/\/workshops\/([^\/?#]+)/) || [])[1] || '');
var wsId = null;
var isAdmin = false;
var copy = {};
var dates = [];
var photos = [];

// ── HELPERS ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
// Same Cloudinary width builder as the rest of the site (keep in sync). Caps at
// 2×DPR and never double-transforms an already-sized URL.
function cld(url, w) {
  if (!url || url.indexOf('/image/upload/') === -1 || url.indexOf('/upload/w_') !== -1) return url;
  var dpr = Math.min(2, Math.max(1, Math.round(window.devicePixelRatio || 1)));
  var tw = w <= 100 ? w : Math.min(2600, w * dpr);
  return url.replace('/image/upload/', '/image/upload/w_' + tw + ',f_auto,q_auto:good/');
}
function fmtCHF(cents) { return 'CHF ' + (cents / 100).toFixed(2); }

function api(path, opts) {
  opts = opts || {};
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(opts.body);
  }
  opts.credentials = 'same-origin';
  return fetch(path, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    });
  });
}

var toastTimer;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2400);
}

// A newline-separated block → <li> list. Blank lines are dropped.
function listHtml(value) {
  var items = String(value || '').split('\n').filter(function (l) { return l.trim(); });
  if (!items.length) return '<ul class="ws-list"></ul>';
  return '<ul class="ws-list">' + items.map(function (l) {
    return '<li>' + esc(l.trim()) + '</li>';
  }).join('') + '</ul>';
}
// "09:00 — text" → a time column + text; a line with no leading time is full width.
function schedHtml(value) {
  var rows = String(value || '').split('\n').filter(function (l) { return l.trim(); });
  return rows.map(function (line) {
    var m = line.match(/^\s*([0-2]?\d[:.]\d\d)\s*[—–-]+\s*(.*)$/);
    var time = m ? m[1] : '';
    var text = m ? m[2] : line.trim();
    return '<div class="ws-sched-row"><span class="ws-sched-time">' + esc(time) +
      '</span><span class="ws-sched-text">' + esc(text) + '</span></div>';
  }).join('');
}

// An admin-only "edit" tab appended to a section title. `key` names the copy
// field it edits; `label`/`multiline` shape the dialog.
function tab(key, label, multiline) {
  return '<button class="adm edit-tab" onclick="editField(\'' + key + '\',\'' + esc(label) +
    '\',' + (multiline ? 'true' : 'false') + ')">edit</button>';
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function render() {
  var c = copy;
  var h = '';
  // Banner: shown when it has text and hasn't been switched off. The edit tab
  // rides on it even when hidden so the admin can bring it back.
  if (isAdmin || (c.banner_enabled !== 'false' && c.banner_text)) {
    var shown = c.banner_enabled !== 'false' && c.banner_text;
    h += '<div class="ws-banner"' + (shown ? '' : ' style="opacity:.5"') + '>' +
      esc(c.banner_text || (isAdmin ? '(no banner text)' : '')) +
      tab('banner_text', 'Banner', true) + '</div>';
  }
  h += '<h1 class="ws-heading">' + esc(c.heading || 'Workshop') + tab('heading', 'Heading', false) + '</h1>';
  h += '<div class="ws-body">';
  h += '<p class="ws-spec" style="margin-bottom:2rem">' + esc(c.sub) + tab('sub', 'Subtitle', true) + '</p>';
  h += '<p>' + esc(c.intro) + tab('intro', 'Intro', true) + '</p>';

  h += '<div class="ws-divider"></div><h2 class="ws-section-title">The day' + tab('schedule', 'Schedule', true) + '</h2>';
  h += '<div class="ws-sched">' + schedHtml(c.schedule) + '</div>';

  // Gallery — only a section when there are photos, or when the admin is here to
  // add the first one.
  if (photos.length || isAdmin) {
    h += '<div class="ws-divider"></div><h2 class="ws-section-title">In action</h2>';
    h += '<div class="ws-gallery">' + photos.map(function (p, i) {
      return '<div class="ws-shot"><img src="' + esc(cld(p.image_url, 1200)) +
        '" alt="Photograph made at a Bharat Bhatia workshop in Zürich" loading="lazy" ' +
        'onclick="openLb(' + i + ')">' +
        '<button class="adm del" onclick="delPhoto(' + p.id + ')" title="Delete photo">&times;</button></div>';
    }).join('') + '</div>';
    if (!photos.length) h += '<p class="ws-no-dates">No photos yet — use “+ Photo”.</p>';
  }

  h += '<div class="ws-divider"></div><h2 class="ws-section-title">What’s included' + tab('included', 'Included', true) + '</h2>' + listHtml(c.included);
  h += '<h2 class="ws-section-title" style="margin-top:1.75rem">What to bring' + tab('bring', 'To bring', true) + '</h2>' + listHtml(c.bring);

  h += '<div class="ws-divider"></div><h2 class="ws-section-title">Good to know' + tab('weather', 'Weather', true) + tab('min', 'Minimum', true) + '</h2>';
  h += '<p>' + esc(c.weather) + '</p><p>' + esc(c.min) + '</p>';

  h += '<div class="ws-divider"></div><h2 class="ws-section-title">Dates &amp; booking' + tab('price_note', 'Price note', false) + '</h2>';
  h += '<p style="margin-bottom:1.25rem">' + esc(c.price_note) + '</p>';
  h += '<div class="ws-dates">' + datesHtml() + '</div>';
  h += '</div>';

  document.getElementById('ws-content').innerHTML = h;
  document.title = (c.heading ? c.heading.replace(/\.$/, '') : 'Workshop') + ' · Bharat Bhatia';
}

function datesHtml() {
  if (!dates.length) return '<p class="ws-no-dates">No dates announced yet. Check back soon.</p>';
  return dates.map(function (d) {
    var dt = new Date(d.date);
    var label = dt.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    var full = d.spots_left <= 0;
    return '<div class="ws-date-card"><div>' +
      '<div class="ws-date-label">' + esc(label) + '</div>' +
      '<div class="ws-date-spots">' + (full ? 'Fully booked' : d.spots_left + ' of ' + d.capacity + ' spots left') + '</div>' +
      '</div><div class="ws-date-right">' +
      '<span class="ws-date-price">' + fmtCHF(d.price_chf_cents) + '</span>' +
      '<button class="ws-book-btn" disabled title="Booking opens soon">' + esc(copy.cta || 'Booking opens soon') + '</button>' +
      '</div></div>';
  }).join('');
}

// ── LIGHTBOX ─────────────────────────────────────────────────────────────────
function openLb(i) {
  var p = photos[i];
  if (!p) return;
  document.getElementById('lb-img').src = cld(p.image_url, 2000);
  document.getElementById('lb').classList.add('on');
}

// ── MODAL / ask() (same contract as the fountain map) ────────────────────────
function closeModal() { document.getElementById('modal').classList.remove('on'); }
function ask(title, desc, fields, cb, wide) {
  var card = document.getElementById('modal-card');
  card.className = 'modal-card' + (wide ? ' wide' : '');
  var body = '<h4>' + esc(title) + '</h4>' + (desc ? '<p>' + esc(desc) + '</p>' : '');
  body += fields.map(function (f, i) {
    var input;
    if (f.type === 'select') {
      input = '<select id="mf-' + i + '">' + f.options.map(function (o) {
        return '<option value="' + esc(o.value) + '">' + esc(o.label) + '</option>';
      }).join('') + '</select>';
    } else if (f.multiline) {
      input = '<textarea id="mf-' + i + '"' + (f.rows ? ' rows="' + (f.rows | 0) + '"' : '') + '></textarea>';
    } else {
      input = '<input type="' + (f.inputType || 'text') + '" id="mf-' + i + '">';
    }
    return '<label class="m-label" for="mf-' + i + '">' + esc(f.label) + '</label>' + input +
      (f.hint ? '<div class="m-hint">' + esc(f.hint) + '</div>' : '');
  }).join('');
  body += '<div class="modal-row"><button class="btn" onclick="closeModal()">Cancel</button>' +
    '<button class="btn btn-primary" id="m-ok">Save</button></div>';
  card.innerHTML = body;
  // Values assigned as properties, never interpolated into markup, so a quote in
  // a value can't break out of the field.
  fields.forEach(function (f, i) {
    if (f.type === 'file') return;
    document.getElementById('mf-' + i).value = f.value == null ? '' : f.value;
  });
  document.getElementById('modal').classList.add('on');
  var first = document.getElementById('mf-0');
  if (first && first.focus) { first.focus(); if (first.select) first.select(); }
  document.getElementById('m-ok').onclick = function () {
    var out = {};
    fields.forEach(function (f, i) {
      var el = document.getElementById('mf-' + i);
      out[f.key] = f.multiline ? el.value : el.value.trim();
    });
    cb(out);
  };
}
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (document.getElementById('lb').classList.contains('on')) { document.getElementById('lb').classList.remove('on'); return; }
  if (document.getElementById('modal').classList.contains('on')) closeModal();
});

// ── ADMIN: COPY ──────────────────────────────────────────────────────────────
// One field at a time, edited from the tab beside its section. Saving a value
// equal to the site-wide default clears the override server-side (the field
// falls back to the shared copy again).
function editField(key, label, multiline) {
  ask('Edit ' + label.toLowerCase(), 'Leave empty to hide this line. Saving the site-wide default text clears the override.', [
    { key: 'value', label: label, value: copy[key] == null ? '' : copy[key], multiline: multiline, rows: multiline ? 6 : 0 }
  ], function (v) {
    saveCopy(key, v.value);
  });
}
// The big "Edit copy" button walks every field in one dialog session by chaining
// single-field edits would be tedious; instead it opens the most-edited block.
function editCopy() {
  ask('Edit copy', 'Pick a field to edit. Each section on the page also has its own “edit” tab.', [
    { key: 'which', label: 'Field', type: 'select', options: [
      { value: 'heading', label: 'Heading' }, { value: 'sub', label: 'Subtitle' },
      { value: 'intro', label: 'Intro' }, { value: 'schedule', label: 'Schedule (the day)' },
      { value: 'included', label: "What's included" }, { value: 'bring', label: 'What to bring' },
      { value: 'weather', label: 'Weather note' }, { value: 'min', label: 'Minimum note' },
      { value: 'price_note', label: 'Price note' }, { value: 'cta', label: 'Booking button label' },
      { value: 'banner_text', label: 'Banner text' }
    ] }
  ], function (v) {
    var labels = { heading: 'Heading', sub: 'Subtitle', intro: 'Intro', schedule: 'Schedule',
      included: 'Included', bring: 'To bring', weather: 'Weather', min: 'Minimum',
      price_note: 'Price note', cta: 'Button label', banner_text: 'Banner' };
    var multi = { schedule: 1, included: 1, bring: 1, intro: 1, sub: 1, weather: 1, min: 1, banner_text: 1 };
    editField(v.which, labels[v.which] || v.which, !!multi[v.which]);
  });
}
function saveCopy(key, value) {
  api('/api/admin/workshops/' + wsId + '/copy', { method: 'PUT', body: { key: key, value: value } })
    .then(function (d) { copy = d.copy || copy; render(); toast('Saved'); })
    .catch(function (e) { toast(e.message); });
}

// ── ADMIN: DATES ─────────────────────────────────────────────────────────────
// A modal listing every date for this workshop (all statuses, admin-only) with
// edit/delete, plus an add action. Booking stays disabled site-wide; this only
// manages the schedule of offered dates.
function openDates() {
  api('/api/admin/workshop-dates?workshop_id=' + wsId).then(function (rows) {
    var card = document.getElementById('modal-card');
    card.className = 'modal-card wide';
    var list = rows.length ? rows.map(function (d) {
      var dt = new Date(d.date);
      var label = dt.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
      var booked = (parseInt(d.paid_count) || 0);
      return '<div class="date-row"><span class="grow">' + esc(label) +
        ' · ' + fmtCHF(d.price_chf_cents) + ' · cap ' + d.capacity +
        (booked ? ' · ' + booked + ' booked' : '') +
        '</span><span class="date-pill">' + esc(d.status) + '</span>' +
        '<button class="btn" onclick="editDate(' + d.id + ')">Edit</button>' +
        '<button class="btn" onclick="delDate(' + d.id + ',' + booked + ')">Delete</button></div>';
    }).join('') : '<p class="ws-no-dates" style="padding:.6rem 0">No dates yet.</p>';
    card.innerHTML = '<h4>Dates</h4><p>Add and manage the dates offered for this workshop. ' +
      'Only a date with status “open” shows on the public page. Booking is disabled site-wide for now.</p>' +
      list +
      '<div class="modal-row"><button class="btn" onclick="closeModal()">Close</button>' +
      '<button class="btn btn-primary" onclick="editDate(0)">+ Add date</button></div>';
    document.getElementById('modal').classList.add('on');
  }).catch(function (e) { toast(e.message); });
}

function editDate(id) {
  var d = null;
  // For an edit we already have the row on screen; re-fetch to be safe/simple.
  api('/api/admin/workshop-dates?workshop_id=' + wsId).then(function (rows) {
    if (id) { d = rows.filter(function (r) { return r.id === id; })[0]; }
    ask(id ? 'Edit date' : 'Add date', '', [
      { key: 'date', label: 'Date', inputType: 'date', value: d ? String(d.date).slice(0, 10) : '' },
      { key: 'capacity', label: 'Capacity', inputType: 'number', value: d ? d.capacity : 6 },
      { key: 'price', label: 'Price (CHF)', inputType: 'number', value: d ? (d.price_chf_cents / 100) : 300,
        hint: 'In francs — stored as cents.' },
      { key: 'status', label: 'Status', type: 'select', options: [
        { value: 'draft', label: 'draft (hidden)' }, { value: 'open', label: 'open (shown)' },
        { value: 'closed', label: 'closed' }, { value: 'past', label: 'past' }
      ] }
    ], function (v) {
      if (!v.date) return toast('A date is required');
      var body = {
        date: v.date,
        capacity: parseInt(v.capacity, 10) || 6,
        price_chf_cents: Math.round((parseFloat(v.price) || 0) * 100),
        status: v.status || 'draft'
      };
      var req = id
        ? api('/api/admin/workshop-dates/' + id, { method: 'PUT', body: body })
        : api('/api/admin/workshop-dates', { method: 'POST', body: Object.assign({ workshop_id: wsId }, body) });
      req.then(function () { toast('Saved'); reloadDates(); openDates(); })
        .catch(function (e) { toast(e.message); });
    });
    // Set the status <select> to the row's current value (ask() can't preselect).
    if (d) { var s = document.getElementById('mf-3'); if (s) s.value = d.status; }
  }).catch(function (e) { toast(e.message); });
}

function delDate(id, booked) {
  if (booked > 0) return toast('This date has bookings — set it to closed instead.');
  if (!confirm('Delete this date?')) return;
  api('/api/admin/workshop-dates/' + id, { method: 'DELETE' })
    .then(function () { toast('Deleted'); reloadDates(); openDates(); })
    .catch(function (e) { toast(e.message); });
}

// Refresh only the public (open, upcoming) dates the page shows.
function reloadDates() {
  api('/api/workshops/' + encodeURIComponent(SLUG)).then(function (d) {
    dates = d.dates || []; render();
  });
}

// ── ADMIN: PHOTOS ────────────────────────────────────────────────────────────
// Picker opened straight from the click (no modal in between), the same mobile
// lesson the fountain map and client boards document.
function addPhoto() {
  var picker = document.getElementById('picker');
  picker.value = '';
  picker.onchange = function () { if (picker.files[0]) uploadPhoto(picker.files[0]); };
  picker.click();
}
function uploadPhoto(file) {
  var fd = new FormData();
  fd.append('photo', file);
  fd.append('workshop_id', wsId);
  toast('Uploading…');
  api('/api/admin/workshop-photos', { method: 'POST', body: fd })
    .then(function () { toast('Photo added'); reloadAll(); })
    .catch(function (e) { toast('Upload failed: ' + e.message); });
}
function delPhoto(id) {
  if (!confirm('Delete this photo?')) return;
  api('/api/admin/workshop-photos/' + id, { method: 'DELETE' })
    .then(function () { toast('Deleted'); reloadAll(); })
    .catch(function (e) { toast(e.message); });
}
function reloadAll() {
  api('/api/workshops/' + encodeURIComponent(SLUG)).then(function (d) {
    photos = d.photos || []; dates = d.dates || []; copy = d.copy || copy; render();
  });
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
Chrome.mount({ cursor: '.ws-shot img, .edit-tab, #adminbar button, .ws-shot .del' });

if (!SLUG) {
  document.getElementById('ws-content').innerHTML =
    '<h1 class="ws-heading">Workshop</h1><p class="ws-body">No workshop specified.</p>';
} else {
  api('/api/workshops/' + encodeURIComponent(SLUG)).then(function (d) {
    wsId = d.workshopId;
    isAdmin = !!d.admin;
    copy = d.copy || {};
    dates = d.dates || [];
    photos = d.photos || [];
    if (isAdmin) {
      document.body.classList.add('is-admin');
      document.getElementById('adminbar').classList.add('on');
      document.querySelector('.ws-wrap').classList.add('has-admin');
    }
    render();
  }).catch(function (e) {
    document.getElementById('ws-content').innerHTML =
      '<h1 class="ws-heading">Workshop</h1><p class="ws-body">' + esc(e.message) + '</p>';
  });
}
</script>
</body>
</html>
