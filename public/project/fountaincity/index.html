<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Fountain City · Bharat Bhatia</title>
<meta name="description" content="An ongoing project mapping the public fountains of Zürich.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400;1,500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --fi:'Playfair Display',Georgia,serif;
  --fm:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ink:#111110;
  --bg:#FAFAF8;
  --bg2:#F0EFEC;
  --line:#E2E0DA;
  --mute:#8A857C;
  --pink:#C8907A;
  --pink-d:#A87060;
  --no:#A8564A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fm);font-weight:300;font-size:14px;
  line-height:1.65;-webkit-font-smoothing:antialiased;height:100dvh;overflow:hidden}
button{font-family:var(--fm);font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;
  color:var(--ink);padding:8px 14px;border-radius:2px;transition:border-color .18s,background .18s,color .18s}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
input{font-family:var(--fm);font-size:13px;font-weight:300;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:2px;padding:9px 11px;width:100%}
input,textarea{font-family:var(--fm);font-size:13px;font-weight:300;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:2px;padding:9px 11px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{resize:vertical;min-height:76px;line-height:1.6}

/* CURSOR — the main site's pointer, so the map reads as part of the site
   rather than as something bolted to the side of it. A 10px white disc blended
   in difference mode, swelling to 48px over anything you can act on. The
   original is in public/index.html; keep the two in step.

   Gated on a fine pointer rather than the main site's max-width:480px, and the
   element is only built when that query matches. A width breakpoint leaves a
   touch tablet carrying a mix-blend-mode element it can never use, and blend
   modes detach position:fixed on Android Chrome. */
@media (hover:hover) and (pointer:fine){
  body,button,input,textarea,select,a,label,[contenteditable]{cursor:none !important}
  .leaflet-container,.leaflet-container *{cursor:none !important}
  #cur{position:fixed;left:-60px;top:-60px;width:10px;height:10px;background:#fff;
    border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);
    transition:width .2s,height .2s;mix-blend-mode:difference}
  #cur.big{width:48px;height:48px}
}

input[type=file]{padding:7px 9px;font-size:12px;background:var(--bg2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

/* ── ADMIN BAR ────────────────────────────────────────────────────────
   Hidden entirely for the public; revealed by .on once /api/fountains
   says this visitor is the admin. Same idea as the client boards. */
#adminbar{display:none;background:var(--ink);color:var(--bg);font-size:12px;padding:10px 0;flex:none}
#adminbar.on{display:block}
#adminbar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#adminbar button{background:transparent;color:var(--bg);border-color:#3A3733;padding:5px 10px;font-size:11.5px}
#adminbar button:hover{border-color:var(--bg)}
#ab-hint{color:#9C968C;font-size:11.5px}

/* ── FLOATING TOP STACK ───────────────────────────────────────────────
   The admin bar and the title sit over the map. The stack itself takes no
   pointer events, so the map can be panned straight through the title —
   only the admin bar, which has real buttons, takes them back. */
#topstack{position:fixed;top:0;left:0;right:0;z-index:500;pointer-events:none;max-width:100vw}
#adminbar{pointer-events:auto}

/* ── HEADER ───────────────────────────────────────────────────────────── */
/* The scrim, not a solid bar: the map keeps running underneath and simply
   fades out from under the text, so nothing looks bolted on top of it. */
header{padding:30px 0 44px;pointer-events:none;
  background:linear-gradient(to bottom,
    rgba(250,250,248,.97) 0%, rgba(250,250,248,.92) 42%,
    rgba(250,250,248,.72) 68%, rgba(250,250,248,0) 100%)}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
h1{font-family:var(--fi);font-style:italic;font-weight:400;font-size:34px;line-height:1.15;margin:8px 0 0}
/* The scrim fades to nothing at its lower edge, so the text near that edge
   can't rely on it. A soft light halo carries the rest. text-shadow rather
   than mix-blend-mode, deliberately: blend modes detach position:fixed on
   Android Chrome, which is exactly what the whole layout rests on here. */
header .eyebrow,header h1,.intro,#count,#near{
  text-shadow:0 1px 3px rgba(250,250,248,.95), 0 0 14px rgba(250,250,248,.85)}

/* The sentence collapses once the map is touched — see leanOnUse().

   The collapse animates a grid track from 1fr to 0fr rather than a max-height,
   because a max-height has to be guessed: whatever number you pick, an intro
   longer than it is silently cut off mid-sentence, and the text is editable so
   there is no safe number. 1fr resolves to whatever the text actually needs.
   min-height:0 on the child is what lets the track reach zero. */
.intro-wrap{display:grid;grid-template-rows:1fr;margin-top:10px;
  transition:grid-template-rows .32s ease,opacity .32s ease,margin-top .32s ease}
.intro{color:var(--mute);font-size:12.5px;max-width:62ch;min-height:0;overflow:hidden}
#topstack.lean .intro-wrap{grid-template-rows:0fr;opacity:0;margin-top:0}
#topstack.lean header{padding-bottom:26px}
.head-right{display:flex;align-items:flex-start;gap:10px}
#count{font-size:11.5px;letter-spacing:.04em;color:var(--mute);white-space:nowrap}
/* The one thing in the floating header that takes pointer events besides the
   admin bar. Desktop has room for the sentence permanently, so it only appears
   where the sentence actually collapses. */
#lean-toggle{display:none;pointer-events:auto;width:30px;height:30px;padding:0;
  line-height:1;font-size:15px;border-radius:50%;border:1px solid var(--line);
  background:rgba(250,250,248,.92);color:var(--mute);flex:none}
#lean-toggle:hover{border-color:var(--ink);color:var(--ink)}
#count b{font-weight:500;color:var(--ink)}

/* ── MAP ──────────────────────────────────────────────────────────────
   The map IS the page: pinned to the viewport, edge to edge, with the title
   and the admin bar floating over it. Anything less than this reads as a
   screenshot of a map rather than the map itself.

   position:fixed here is the same load-bearing arrangement the public site
   documents — it detaches on Android Chrome the moment anything overflows
   horizontally, hence overflow:hidden on body and max-width:100vw on the
   floating stack. */
.map-wrap{position:fixed;inset:0;z-index:0;display:flex}
#map{flex:1;border:0;border-radius:0;background:var(--bg2)}
.leaflet-container{font-family:var(--fm);font-weight:300;background:var(--bg2)}
/* No filter on the tile pane: the basemap already arrives grey. A canvas
   basemap is built to sit under data — it draws land, water, roads and a few
   faint labels, and no railways or ferry routes, which is what made the plain
   OSM tiles read as a transit map. */
.leaflet-control-attribution{font-size:10px;background:rgba(250,250,248,.86)}

/* Bottom-left, not the conventional top-left: this is the one control meant to
   be pressed while walking, so it sits where a thumb already is. */
.loc-btn{background:var(--bg);border:1px solid var(--line);border-radius:2px;
  padding:9px 13px;font-size:12px;font-family:var(--fm);color:var(--ink);cursor:pointer;
  box-shadow:0 1px 6px rgba(17,17,16,.22);white-space:nowrap}
.loc-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.loc-btn.busy{opacity:.7}
/* Blue, and deliberately not the fountains' terracotta — you are not a fountain. */
.me-dot{width:14px;height:14px;border-radius:50%;background:#3F6EA8;border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(17,17,16,.28)}
/* A fountain's name is free text and lands in here — ellipsis rather than
   letting a long one push the title off its own line. */
#near{display:block;color:var(--mute);max-width:22ch;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
#near b{font-weight:500;color:var(--ink)}

/* A fountain is a small terracotta disc, not a pin — a few hundred pins read
   as a pincushion, and a disc keeps its exact point at its own centre. */
.fmark{width:13px;height:13px;border-radius:50%;background:var(--pink);
  border:2px solid var(--bg);box-shadow:0 1px 4px rgba(17,17,16,.4);
  transition:transform .15s,background .15s}
.fmark:hover{transform:scale(1.35);background:var(--pink-d)}
.leaflet-popup-content-wrapper{border-radius:3px;box-shadow:0 4px 20px rgba(17,17,16,.18)}
.leaflet-popup-content{margin:13px 15px;font-size:12.5px;line-height:1.55}
.pop-name{font-family:var(--fi);font-style:italic;font-size:16px;display:block;margin-bottom:2px}
.pop-name.none{font-family:var(--fm);font-style:normal;font-size:12.5px;color:var(--mute)}
.pop-co{color:var(--mute);font-size:11px;letter-spacing:.02em;display:block}
.pop-note{margin:6px 0 0;color:#4A453E;font-size:12px;white-space:pre-wrap;
  border-left:2px solid var(--pink);padding-left:9px}
/* The photograph bleeds to the popup's edges — the negative margins cancel
   .leaflet-popup-content's own padding rather than fighting it. */
.pop-img{display:block;margin:-13px -15px 10px;border-radius:3px 3px 0 0;overflow:hidden;background:var(--bg2)}
.pop-img img{width:100%;height:auto;display:block}
.pop-adm{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
.pop-adm button{padding:4px 8px;font-size:11px}
.pop-del{color:var(--no)}
.pop-del:hover{border-color:var(--no)}

/* ── MODAL / TOAST (admin only) ───────────────────────────────────────── */
#modal{position:fixed;inset:0;background:rgba(17,17,16,.5);z-index:1200;display:none;
  align-items:center;justify-content:center;padding:22px}
#modal.on{display:flex}
.modal-card{background:var(--bg);border-radius:3px;padding:24px;width:100%;max-width:400px;
  max-height:86vh;overflow-y:auto}
.modal-card h4{font-family:var(--fi);font-style:italic;font-weight:400;font-size:19px;margin-bottom:6px}
.modal-card p{font-size:12px;color:var(--mute);margin-bottom:14px}
.modal-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.m-label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:12px 0 5px}
.m-label:first-child{margin-top:0}
.m-hint{font-size:11px;color:var(--mute);margin-top:5px;line-height:1.5}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:2px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:1300}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  header{padding:20px 0 38px}
  h1{font-size:26px}
  /* Two lines of eyebrow + title is all that stays over the map once the
     sentence has collapsed. */
  #topstack.lean header{padding-bottom:20px}
  #lean-toggle{display:block}
  .intro{font-size:12px}
  .wrap{padding-left:16px;padding-right:16px}
  .head-row{align-items:flex-start}
  .loc-btn{padding:12px 15px;font-size:13px}
  .loc-btn{padding:12px 15px;font-size:13px}
}
</style>
</head>
<body>

<div id="topstack">
<div id="adminbar">
  <div class="wrap">
    <span class="eyebrow" style="color:#9C968C">Admin view</span>
    <button onclick="addFountain()">+ Fountain</button>
    <button id="ab-here" onclick="addHere()">+ Fountain here</button>
    <button onclick="editText()">Edit text</button>
    <span id="ab-hint">or click anywhere on the map to place one</span>
  </div>
</div>

<header>
  <div class="wrap">
    <div class="head-row">
      <div>
        <div class="eyebrow" id="p-eyebrow"></div>
        <h1 id="p-title"></h1>
      </div>
      <div class="head-right">
        <div><div id="count"></div><div id="near"></div></div>
        <button id="lean-toggle" type="button" onclick="toggleLean()">&#8964;</button>
      </div>
    </div>
    <div class="intro-wrap"><div class="intro" id="p-intro"></div></div>
  </div>
</header>
</div>

<div class="map-wrap"><div id="map"></div></div>

<div id="modal">
  <div class="modal-card">
    <h4 id="m-title"></h4>
    <p id="m-desc"></p>
    <div id="m-fields"></div>
    <div class="modal-row">
      <button onclick="closeModal()">Cancel</button>
      <button id="m-ok" style="background:#111110;color:#FAFAF8;border-color:#111110">Save</button>
    </div>
  </div>
</div>

<!-- Opened directly by the pin's Add/Replace photo button. It lives outside the
     modal so the click that opens it is the user's own gesture, unmediated. -->
<input type="file" id="picker" accept="image/*" style="display:none">

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- MapLibre draws the basemap from vector tiles; the bridge mounts it as a
     Leaflet layer so every marker, popup and handler below stays plain Leaflet.
     Both are optional at runtime — see addBasemap(). -->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
// ── STATE ────────────────────────────────────────────────────────────────────
var fountains = [];
var isAdmin = false;
var map, layer;
// Markers indexed by fountain id, so an edit can reopen the popup it came from
// — render() rebuilds every marker, which would otherwise close it silently.
var markerById = {};

// The Stadtkreis 1 outline, as published by Stadt Zürich (see kreis1.geojson
// for the source and retrieval date). Absolute path, not relative: the page is
// served at /project/fountaincity with no trailing slash, so a relative fetch
// would resolve against /project/ and 404.
var KREIS1_URL = '/project/fountaincity/kreis1.geojson';

// Live position. watchId non-null means the watch is running; pos is the last
// fix, kept so "add here" doesn't have to wait for a fresh one.
var geo = { watchId: null, pos: null, at: 0, marker: null, ring: null, follow: false };

// A fix looser than this is worth warning about before it becomes a fountain's
// permanent coordinate: 25m is most of a city block, and phone GPS routinely
// reports 5-10m outdoors under open sky and 40+ between tall buildings.
var ACCURACY_WARN = 25;

// Double tap zooms in, two-finger tap zooms out. A tap only counts as a tap if
// the finger barely moved — otherwise it was a pan or a pinch.
//
// DBL_MS is measured from one tap LIFTING to the next one LANDING, which is how
// a phone measures it. Measuring to the second tap's own lift instead charges
// the gesture for however long the finger rests on the glass, and an unhurried
// double tap then misses the window every time — that is what shipped first and
// why the gesture did nothing.
var DBL_MS = 400;       // ms between one tap lifting and the next landing
var TAP_MAX = 500;      // longer than this and the finger rested, not tapped
var TAP_SLOP = 30;      // px a finger may wander within one tap
var DBL_SLOP = 60;      // px between the two taps of one double tap
var TAPLOG = typeof location !== 'undefined' && /[?&]taplog=1/.test(location.search);

// The page's own copy, editable from the admin bar and stored in the site-wide
// `content` table under fountain_*. These defaults are the same strings the
// server seeds, and exist so the page still reads correctly if the fetch fails
// or a key has never been written.
var text = {};
var TEXT_DEFAULTS = {
  eyebrow: 'Zürich · Ongoing',
  title: 'Fountain City',
  intro: 'Zürich runs on drinking water. This is a map of the public fountains, ' +
    'added one at a time as I find and photograph them.'
};

// A stored empty string means deliberately empty — that line simply doesn't
// render. Only a key that was never written at all falls back to the default,
// so clearing the intro doesn't have it reappear on the next load.
function txt(key) {
  return (typeof text[key] === 'string') ? text[key] : TEXT_DEFAULTS[key];
}

function renderText() {
  var t = txt('title') || TEXT_DEFAULTS.title;      // the title never blanks
  document.getElementById('p-eyebrow').textContent = txt('eyebrow');
  document.getElementById('p-title').textContent = t;
  document.getElementById('p-intro').textContent = txt('intro');
  document.title = t + ' · Bharat Bhatia';
}

// Bürkliplatz-ish — the default view before there is anything to fit to.
var ZURICH = [47.3717, 8.5423];

// ── HELPERS ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function api(path, opts) {
  opts = opts || {};
  // FormData sets its own multipart Content-Type, boundary and all — setting
  // one by hand here would corrupt every upload.
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(opts.body);
  }
  opts.credentials = 'same-origin';
  return fetch(path, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    });
  });
}

var toastTimer;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2200);
}

// Accepts what a map app actually hands you when you copy a location:
// "47.3769, 8.5417", or the same pair separated by a space or a semicolon.
// Returns null rather than a half-parsed pair — a typo that silently became
// 0 would drop a fountain in the Gulf of Guinea.
function parseLatLng(str) {
  var m = String(str).trim().match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  var lat = parseFloat(m[1]), lng = parseFloat(m[2]);
  if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat: lat, lng: lng };
}

function fmt(n) { return Number(n).toFixed(5); }

// Cloudinary URL builder — the same shape as cldUrl() in server.js and cld() in
// the public and admin SPAs. q_auto:good, never bare q_auto, which bands dark
// gradients once f_auto starts serving AVIF. Keep the widths to the two the
// upload pre-builds (see FOUNTAIN_WIDTHS), or a visitor waits while Cloudinary
// generates a fresh derivative on first view.
function cld(url, w) {
  if (!url || url.indexOf('/image/upload/') === -1) return url;
  return url.replace('/image/upload/', '/image/upload/w_' + w + ',f_auto,q_auto:good/');
}

// ── MAP ──────────────────────────────────────────────────────────────────────
function initMap() {
  // Zoom moves to the bottom with the Locate button: the top-left corner now
  // sits under the title, where the buttons would be both ugly and unreadable.
  map = L.map('map', { zoomControl: false, scrollWheelZoom: true, maxZoom: 20 }).setView(ZURICH, 13);
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  // Leaflet's own 'Leaflet' prefix is a courtesy, not a licence condition, and
  // it is what tips the attribution onto a second line on a phone. The tile
  // credits themselves (OpenFreeMap / OpenMapTiles / OpenStreetMap) are
  // required by ODbL and stay exactly as they are.
  if (map.attributionControl) map.attributionControl.setPrefix('');
  addBasemap();
  addKreis();
  layer = L.layerGroup().addTo(map);
  initLocate();
  leanOnUse();
  initTapZoom();

  // Placing by click is admin-only, and the handler is attached only for the
  // admin, so a visitor's stray tap on the map does nothing at all.
  if (isAdmin) {
    map.on('click', function (e) { queueAdd(e.latlng); });
    map.on('dblclick', blockAdd);     // the mouse route to the same zoom
  }
}

// The basemap is vector, not tiles-as-pictures: MapLibre draws it from
// geometry, so it is sharp at every zoom and every pixel density and never
// upscales. OpenFreeMap serves the Positron style — the muted, transit-free
// look this page wants — with no API key and no signup.
//
// The raster fallback is not decoration. MapLibre is two more scripts off a CDN
// and it needs WebGL; if either is unavailable the page still gets a map (the
// Esri canvas this page used before) rather than a blank grey rectangle.
function addBasemap() {
  if (window.maplibregl && L.maplibreGL && hasWebGL()) {
    L.maplibreGL({
      style: 'https://tiles.openfreemap.org/styles/positron',
      attribution: '&copy; <a href="https://openfreemap.org">OpenFreeMap</a> ' +
        '&copy; <a href="https://www.openmaptiles.org/">OpenMapTiles</a> ' +
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    return;
  }
  // Esri's Light Gray Canvas: keyless, and a deliberate data backdrop — no
  // S-Bahn lines, no ferry routes, barely any labels. Note {y} precedes {x}
  // here, unlike OSM. It stops rendering at zoom 16, so maxNativeZoom upscales
  // the last steps, and detectRetina fetches the next zoom's tiles to draw at
  // half size, which is what keeps it sharp on a 2x screen.
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>',
    detectRetina: true,
    maxNativeZoom: 16,
    maxZoom: 19
  }).addTo(map);
}

function hasWebGL() {
  try {
    var c = document.createElement('canvas');
    return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
  } catch (e) {
    return false;                     // some privacy modes throw rather than return null
  }
}

// The district outline is context, not content: ink rather than the fountains'
// terracotta, dashed and half-transparent, so it reads as a reference line and
// never competes with a pin.
//
// interactive:false is load-bearing. A Leaflet path swallows the clicks that
// land on it, and the admin places fountains BY clicking the map — an
// interactive polygon would make the whole of Kreis 1 the one place a pin
// could not be dropped.
function addKreis() {
  fetch(KREIS1_URL, { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
    .then(function (geo) {
      L.geoJSON(geo, {
        interactive: false,
        style: {
          color: '#111110', weight: 1.5, opacity: .5, dashArray: '5 4',
          fillColor: '#111110', fillOpacity: .035
        }
      }).addTo(map);
    })
    .catch(function (e) {
      // The boundary is a nicety; a map without it still works, so this stays
      // quiet for visitors and only tells the admin something is wrong.
      console.warn('Kreis 1 outline failed to load:', e.message);
      if (isAdmin) toast('Kreis 1 outline failed to load');
    });
}

// TAP GESTURES
// Double tap to zoom in, two-finger tap to zoom out — the two gestures every
// map app on a phone has, and neither arrives for free. Leaflet dropped its own
// double-tap emulation in 1.8 on the assumption that the browser fires dblclick
// itself, but the map container carries touch-action:none (which is what makes
// dragging and pinching work at all), and under it a phone browser never
// synthesises one. So the page reads the gesture off the raw touch events.
//
// Only one handler may ever act on a double gesture: Leaflet's own dblclick
// zoom is right for a mouse and would double up with this one for a finger, so
// it steps aside for the duration of a touch and comes back on the next mouse
// press.
function initTapZoom() {
  var el = map.getContainer && map.getContainer();
  if (!el || !el.addEventListener) return;

  var tap = null;     // the single finger currently down
  var prev = null;    // the previous completed tap, waiting for its partner
  var pair = null;    // a two-finger gesture in progress

  el.addEventListener('mousedown', function () {
    if (map.doubleClickZoom) map.doubleClickZoom.enable();
  }, true);

  el.addEventListener('touchstart', function (e) {
    if (map.doubleClickZoom) map.doubleClickZoom.disable();
    tapLog('start x' + e.touches.length);
    if (e.touches.length === 1) {
      tap = tapPt(e.touches[0]);
      pair = null;
    } else if (e.touches.length === 2) {
      pair = tapMid(e.touches[0], e.touches[1]);
      tap = null;                     // a second finger is not a second tap
      prev = null;
    } else {
      tap = null; pair = null; prev = null;
    }
  }, { passive: true });

  // A finger that travels is a pan, and two that spread are a pinch. Cancelling
  // both here is what keeps a slow drag from reading as half of a double tap,
  // and a pinch — whose midpoint barely moves — from reading as a two-finger
  // tap, hence the spread check alongside the position one.
  el.addEventListener('touchmove', function (e) {
    if (tap && e.touches.length === 1 && tapFar(tap, tapPt(e.touches[0]), TAP_SLOP)) tap = null;
    if (pair && e.touches.length === 2) {
      var m = tapMid(e.touches[0], e.touches[1]);
      if (tapFar(pair, m, TAP_SLOP) || Math.abs(m.d - pair.d) > TAP_SLOP) pair = null;
    }
  }, { passive: true });

  el.addEventListener('touchend', function (e) {
    if (e.touches.length > 0) return;           // a finger is still down
    var now = Date.now();

    // Two fingers, briefly, without spreading: zoom out one step.
    if (pair) {
      var p = pair;
      pair = null; prev = null; tap = null;
      if (now - p.t < DBL_MS) zoomAt(p, -1, true);
      return;
    }
    if (!tap) { prev = null; return; }          // the finger dragged
    var t = tap;
    tap = null;
    if (now - t.t > TAP_MAX) { prev = null; return; }        // a long press
    tapLog('tap gap ' + (prev ? t.t - prev.t : '-'));
    // t.t is when this tap LANDED and prev.t when the last one LIFTED: the
    // window covers the gap between the two taps and nothing else.
    if (prev && t.t - prev.t < DBL_MS && !tapFar(prev, t, DBL_SLOP)) {
      prev = null;
      zoomAt(t, 1, true);
      return;
    }
    prev = { t: now, x: t.x, y: t.y };
  }, { passive: true });

  el.addEventListener('touchcancel', function () {
    tap = null; pair = null; prev = null;
  }, { passive: true });

  // A second, independent route to the same zoom. Whether a phone browser
  // synthesises dblclick from a double tap is exactly the thing that cannot be
  // checked from here, so the page takes it if it comes rather than betting on
  // the touch path alone. Leaflet owns this event whenever its own handler is
  // enabled — which is the case for a mouse and never during a touch — and the
  // guard drops it if the touch path has just zoomed, so the two can't stack.
  el.addEventListener('dblclick', function (e) {
    if (map.doubleClickZoom && map.doubleClickZoom.enabled()) return;
    if (Date.now() - touchZoomAt < 800) return;
    tapLog('dblclick');
    zoomAt({ x: e.clientX, y: e.clientY }, e.shiftKey ? -1 : 1);
  });
}

// The gesture can only be tested on a real phone, so ?taplog=1 puts what the
// browser actually fired on the screen. Silent and unbuilt otherwise.
var tapLogBox = null;
function tapLog(msg) {
  if (!TAPLOG) return;
  if (!tapLogBox) {
    tapLogBox = document.createElement('div');
    tapLogBox.style.cssText = 'position:fixed;left:8px;bottom:120px;z-index:9999;max-width:60vw;' +
      'font:11px/1.4 monospace;background:rgba(17,17,16,.82);color:#fff;padding:6px 8px;' +
      'border-radius:6px;pointer-events:none;white-space:pre-wrap';
    document.body.appendChild(tapLogBox);
  }
  var lines = tapLogBox.textContent ? tapLogBox.textContent.split(String.fromCharCode(10)) : [];
  lines.push(msg);
  tapLogBox.textContent = lines.slice(-8).join(String.fromCharCode(10));
}

function tapPt(t) { return { t: Date.now(), x: t.clientX, y: t.clientY }; }

function tapMid(a, b) {
  return {
    t: Date.now(),
    x: (a.clientX + b.clientX) / 2,
    y: (a.clientY + b.clientY) / 2,
    d: Math.sqrt(Math.pow(a.clientX - b.clientX, 2) + Math.pow(a.clientY - b.clientY, 2))
  };
}

function tapFar(a, b, slop) {
  return Math.abs(a.x - b.x) > slop || Math.abs(a.y - b.y) > slop;
}

// Zoom around the point that was tapped rather than the centre of the map, so
// whatever you aimed at is still under your thumb afterwards. The step is
// clamped here rather than left to setZoomAround, which offsets the centre by
// an unclamped scale and so slides the map sideways at either zoom limit.
var touchZoomAt = 0;

function zoomAt(p, delta, byTouch) {
  if (byTouch) touchZoomAt = Date.now();   // the dblclick path defers to this
  blockAdd();                          // a zoom gesture is not a request to place a pin
  var z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), map.getZoom() + delta));
  tapLog('zoom ' + map.getZoom() + ' -> ' + z);
  if (z === map.getZoom()) return;
  var r = map.getContainer().getBoundingClientRect();
  map.setZoomAround(L.point(p.x - r.left, p.y - r.top), z);
}

// Placing a fountain and zooming both start with the same tap, so for the admin
// the Add dialog has to wait long enough to see whether a second one is coming.
// A third of a second before a modal opens goes unnoticed; an Add dialog on top
// of every zoom would not. The block window covers the *second* tap's click,
// which the browser delivers after the gesture has already been recognised.
var addTimer = null;
var addBlockUntil = 0;

function queueAdd(latlng) {
  if (Date.now() < addBlockUntil) return;
  cancelQueuedAdd();
  addTimer = setTimeout(function () { addTimer = null; addFountain(latlng); }, DBL_MS + 80);
}

function cancelQueuedAdd() {
  if (addTimer) { clearTimeout(addTimer); addTimer = null; }
}

function blockAdd() {
  addBlockUntil = Date.now() + 600;
  cancelQueuedAdd();
}

// GEOLOCATION
// The point of the whole feature: you are standing at the fountain, so the
// phone already knows the coordinate better than you could read it off a map.
function initLocate() {
  if (!navigator.geolocation) return;     // no API, no button - nothing to offer
  var Ctl = L.Control.extend({
    options: { position: 'bottomleft' },
    onAdd: function () {
      var b = L.DomUtil.create('button', 'loc-btn');
      b.id = 'loc-btn';
      b.type = 'button';
      b.innerHTML = 'Locate me';
      // Without this the press also lands on the map underneath, which for the
      // admin opens the Add dialog every time the button is touched.
      L.DomEvent.disableClickPropagation(b);
      L.DomEvent.on(b, 'click', toggleLocate);
      return b;
    }
  });
  map.addControl(new Ctl());
  // Panning by hand means "stop chasing me": the dot keeps updating, the map
  // just stops recentring. Tapping the button again re-follows.
  map.on('dragstart', function () { geo.follow = false; });
}

// On a phone the header covers a real fraction of the map, so it gets out of
// the way the moment the map is actually used: the title and the tally stay,
// the sentence collapses. Bound to a real pointer on the map container rather
// than to Leaflet's movestart/zoomstart, because those also fire for the
// programmatic fitBounds on load — which would collapse the intro before
// anyone had the chance to read it.
function leanOnUse() {
  if (!window.matchMedia || !window.matchMedia('(max-width: 640px)').matches) return;
  var stack = document.getElementById('topstack');
  var el = map.getContainer && map.getContainer();
  if (!stack || !el || !el.addEventListener) return;
  var lean = function () { setLean(true); };
  el.addEventListener('pointerdown', lean, { once: true });
  el.addEventListener('touchstart', lean, { once: true, passive: true });
}

// Collapsing is a toggle, never a one-way door: the sentence going away the
// first time you touch the map is only reasonable if there is an obvious way to
// bring it back. The chevron is that way, and it is the only part of the
// floating header besides the admin bar that takes a tap — everywhere else the
// map still pans straight through the text.
function setLean(on) {
  var stack = document.getElementById('topstack');
  var btn = document.getElementById('lean-toggle');
  if (!stack) return;
  stack.classList[on ? 'add' : 'remove']('lean');
  if (btn) {
    btn.innerHTML = on ? '&#8964;' : '&#8963;';       // chevron down / up
    btn.title = on ? 'Show the description' : 'Hide the description';
  }
}

function toggleLean() {
  var stack = document.getElementById('topstack');
  setLean(!(stack && stack.classList.contains('lean')));
}

function toggleLocate() {
  if (geo.watchId !== null) { stopLocate(); return; }
  var b = document.getElementById('loc-btn');
  if (b) { b.classList.add('busy'); b.innerHTML = 'Locating...'; }
  geo.follow = true;
  // enableHighAccuracy asks for GPS rather than wifi/cell triangulation. It is
  // slower and costs battery, which is exactly the trade you want when the fix
  // is about to become a fountain's permanent coordinate.
  geo.watchId = navigator.geolocation.watchPosition(onPos, onPosError, {
    enableHighAccuracy: true, maximumAge: 5000, timeout: 20000
  });
}

function stopLocate() {
  if (geo.watchId !== null) navigator.geolocation.clearWatch(geo.watchId);
  geo.watchId = null;
  geo.follow = false;
  if (geo.marker) { map.removeLayer(geo.marker); geo.marker = null; }
  if (geo.ring) { map.removeLayer(geo.ring); geo.ring = null; }
  var b = document.getElementById('loc-btn');
  if (b) { b.classList.remove('on', 'busy'); b.innerHTML = 'Locate me'; }
  updateNear();
}

function onPos(p) {
  geo.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy || 0 };
  geo.at = Date.now();
  var ll = [geo.pos.lat, geo.pos.lng];
  var b = document.getElementById('loc-btn');
  if (b) { b.classList.remove('busy'); b.classList.add('on'); b.innerHTML = 'Following'; }

  if (!geo.marker) {
    geo.marker = L.marker(ll, {
      interactive: false,            // never swallow a click meant for the map
      zIndexOffset: 1000,            // above the fountains: it is where YOU are
      icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>',
        iconSize: [14, 14], iconAnchor: [7, 7] })
    }).addTo(map);
    // The accuracy ring is the honest part: a 40m fix should look like 40m.
    geo.ring = L.circle(ll, { interactive: false, radius: geo.pos.acc,
      color: '#3F6EA8', weight: 1, opacity: .45,
      fillColor: '#3F6EA8', fillOpacity: .07 }).addTo(map);
  } else {
    geo.marker.setLatLng(ll);
    geo.ring.setLatLng(ll).setRadius(geo.pos.acc);
  }
  if (geo.follow) map.setView(ll, Math.max(map.getZoom(), 17));
  updateNear();
}

function onPosError(e) {
  stopLocate();
  var msg = (e && e.code === 1) ? 'Location permission denied - allow it in your browser settings'
    : (e && e.code === 3) ? 'Timed out looking for a GPS fix - try again outdoors'
    : 'Could not get your position';
  toast(msg);
}

// Metres between two coordinates. Haversine on a sphere: across a city the
// error against a proper ellipsoid is centimetres, and this is a walking hint.
function distM(a, b) {
  var R = 6371000, rad = Math.PI / 180;
  var dLat = (b.lat - a.lat) * rad, dLng = (b.lng - a.lng) * rad;
  var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
    Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(h)));
}

function nearestFountain() {
  if (!geo.pos) return null;
  var best = null;
  fountains.forEach(function (f) {
    var d = distM(geo.pos, { lat: f.lat, lng: f.lng });
    if (!best || d < best.d) best = { f: f, d: d };
  });
  return best;
}

function updateNear() {
  var el = document.getElementById('near');
  if (!el) return;
  var n = nearestFountain();
  if (!n) { el.innerHTML = ''; return; }
  var d = n.d < 1000 ? Math.round(n.d) + ' m' : (n.d / 1000).toFixed(1) + ' km';
  el.innerHTML = 'nearest <b>' + d + '</b>' + (n.f.name ? ' - ' + esc(n.f.name) : '');
}

// Admin: drop a fountain where you are standing. Uses the live fix if the watch
// is already running and it is fresh, otherwise asks for one shot - no point
// making someone start tracking just to add a single pin.
function addHere() {
  if (!navigator.geolocation) return toast('This device has no location support');
  if (geo.pos && Date.now() - geo.at < 30000) return openHere(geo.pos);
  toast('Getting your position...');
  navigator.geolocation.getCurrentPosition(function (p) {
    geo.pos = { lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy || 0 };
    geo.at = Date.now();
    updateNear();
    openHere(geo.pos);
  }, onPosError, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
}

function openHere(pos) {
  var acc = Math.round(pos.acc);
  // The accuracy is stated rather than hidden: a loose fix is still worth
  // saving when you are standing at the fountain, but you should know to nudge
  // the pin afterwards from its Edit dialog.
  addFountain({ lat: pos.lat, lng: pos.lng },
    acc ? ('Your position, accurate to about ' + acc + ' m.' +
           (acc > ACCURACY_WARN ? ' That is loose - check the pin afterwards.' : '')) : null);
}

function popupHtml(f) {
  var id = f.id | 0;
  // width/height on the <img> reserve the right shape before the file lands, so
  // the popup doesn't resize under the cursor. Older rows have no dimensions
  // stored and simply go without.
  var dims = (f.image_width && f.image_height)
    ? ' width="' + (f.image_width | 0) + '" height="' + (f.image_height | 0) + '"' : '';
  var img = f.image_url
    ? '<a class="pop-img" href="' + esc(cld(f.image_url, 1600)) + '" target="_blank" rel="noopener">' +
        '<img src="' + esc(cld(f.image_url, 640)) + '"' + dims +
        ' alt="' + esc(f.name || 'Fountain') + '" loading="lazy"></a>'
    : '';
  var name = f.name
    ? '<span class="pop-name">' + esc(f.name) + '</span>'
    : '<span class="pop-name none">Unnamed fountain</span>';
  var note = f.note ? '<div class="pop-note">' + esc(f.note) + '</div>' : '';
  var admin = isAdmin
    ? '<div class="pop-adm">' +
        '<button onclick="editFountain(' + id + ')">Edit</button>' +
        '<button onclick="photoFountain(' + id + ')">' +
          (f.image_url ? 'Replace photo' : 'Add photo') + '</button>' +
        (f.image_url ? '<button onclick="removePhoto(' + id + ')">Remove photo</button>' : '') +
        '<button class="pop-del" onclick="delFountain(' + id + ')">Delete</button>' +
      '</div>'
    : '';
  return img + name + '<span class="pop-co">' + fmt(f.lat) + ', ' + fmt(f.lng) + '</span>' +
    note + admin;
}

// One fountain out of the array, and the in-place swap after an edit — the
// routes all answer with the whole updated row, so nothing is patched by hand.
function byId(id) {
  return fountains.filter(function (f) { return f.id === id; })[0];
}
function replaceInList(f) {
  fountains = fountains.map(function (x) { return x.id === f.id ? f : x; });
}

// Repaints every marker from `fountains`. Cheap at this scale, and it keeps one
// source of truth — no marker is ever mutated in place.
function render() {
  layer.clearLayers();
  markerById = {};
  fountains.forEach(function (f) {
    markerById[f.id] = L.marker([f.lat, f.lng], {
      title: f.name || '',
      icon: L.divIcon({
        className: '', html: '<div class="fmark"></div>',
        iconSize: [13, 13], iconAnchor: [6.5, 6.5], popupAnchor: [0, -8]
      })
    }).bindPopup(popupHtml(f), { maxWidth: 300 }).addTo(layer);
  });
  var n = fountains.length;
  document.getElementById('count').innerHTML = '<b>' + n + '</b> ' + (n === 1 ? 'fountain' : 'fountains');
  updateNear();
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
// ── CURSOR ───────────────────────────────────────────────────────────────────
// The main site's cursor (public/index.html): the same 10px dot and the same
// 48px hover swell, so this page reads as part of the site.
//
// Built only where there is a real pointer to replace. On a touch device
// nothing is created and no listener is bound — which is also what keeps a
// mix-blend-mode element off a layout Android Chrome would detach.
var CUR_TARGETS = 'a,button,.fmark';

function initCursor() {
  if (!window.matchMedia || !window.matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  var cur = document.createElement('div');
  cur.id = 'cur';
  document.body.appendChild(cur);
  document.addEventListener('mousemove', function (e) {
    cur.style.left = e.clientX + 'px';
    cur.style.top = e.clientY + 'px';
  });

  // Delegation on document, never a querySelectorAll snapshot: the marker layer is repainted from scratch on every change,
  // so a snapshot taken at load would cover none of what is on the page a
  // second later. mouseover/mouseout bubble where mouseenter/mouseleave do not,
  // and tracking the matched element stops the swell flickering as the pointer
  // crosses children inside the same target.
  var hover = null;
  document.addEventListener('mouseover', function (e) {
    var m = e.target.closest && e.target.closest(CUR_TARGETS);
    if (!m || m === hover) return;
    hover = m;
    cur.classList.add('big');
  });
  document.addEventListener('mouseout', function (e) {
    if (!hover) return;
    if (e.relatedTarget && hover.contains(e.relatedTarget)) return;
    hover = null;
    cur.classList.remove('big');
  });
}

initCursor();

renderText();                          // defaults first, so the page is never blank
api('/api/fountains').then(function (d) {
  fountains = d.fountains || [];
  isAdmin = !!d.admin;
  text = d.text || {};
  renderText();
  if (isAdmin) document.getElementById('adminbar').classList.add('on');
  initMap();
  render();
  // Fit to what exists, but only on load — refitting after every add would yank
  // the map out from under the admin mid-session.
  if (fountains.length > 1) {
    map.fitBounds(fountains.map(function (f) { return [f.lat, f.lng]; }), { padding: [40, 40] });
  } else if (fountains.length === 1) {
    map.setView([fountains[0].lat, fountains[0].lng], 16);
  }
}).catch(function (e) {
  // The map is still worth showing without its markers, so the failure is a
  // toast rather than an empty page.
  initMap();
  render();
  toast('Could not load fountains: ' + e.message);
});

// ── ADMIN ────────────────────────────────────────────────────────────────────
// `at` is a LatLng when this came from a map click, undefined from the button.
function addFountain(at, desc) {
  ask('Add fountain',
    desc || (at ? 'Coordinates taken from where you clicked.' : ''), [
    { key: 'co', label: 'Coordinates', value: at ? fmt(at.lat) + ', ' + fmt(at.lng) : '',
      hint: 'Decimal degrees, latitude first — e.g. 47.37690, 8.54170' },
    { key: 'name', label: 'Name (optional)' },
    { key: 'note', label: 'Note (optional)', multiline: true, hint: 'Your own words about this fountain. Shown to everyone, under the photograph.' },
    { key: 'photo', label: 'Photograph (optional)', file: true }
  ], function (v) {
    var ll = parseLatLng(v.co);
    if (!ll) return toast('Coordinates must read like 47.3769, 8.5417');
    api('/api/admin/fountains', {
      method: 'POST', body: { lat: ll.lat, lng: ll.lng, name: v.name, note: v.note }
    })
      .then(function (f) {
        fountains.push(f);
        render();
        // Only move the map if the new fountain landed off-screen; otherwise the
        // view the admin was working in is left exactly as it was.
        if (!map.getBounds().contains([f.lat, f.lng])) map.panTo([f.lat, f.lng]);
        // The fountain is created first and the photograph attached after, so a
        // failed upload costs the photo and not the coordinate — retry it from
        // the pin's own Add photo button.
        if (v.photo) return uploadPhoto(f.id, v.photo);
        toast(f.name ? 'Added ' + f.name : 'Fountain added');
      })
      .catch(function (e) { toast(e.message); });
  });
}

// Mirrors the client board's editHeader(): one dialog for every string the page
// shows. Each key is a separate PUT because /api/admin/content writes one
// key/value pair — the existing route, rather than a new one just for this page.
function editText() {
  ask('Edit page text', 'The eyebrow and the sentence may be left empty; the title may not.', [
    { key: 'eyebrow', label: 'Eyebrow', value: txt('eyebrow') },
    { key: 'title', label: 'Title', value: txt('title') },
    { key: 'intro', label: 'Intro', value: txt('intro'), multiline: true, rows: 4,
      hint: 'Shown under the title, over the map.' }
  ], function (v) {
    // Trimmed here rather than trusting the dialog to have done it: the guard
    // has to hold on its own, or a title of three spaces blanks the page.
    var next = { eyebrow: (v.eyebrow || '').trim(),
                 title: (v.title || '').trim(),
                 intro: (v.intro || '').trim() };
    if (!next.title) return toast('The title cannot be empty');
    Promise.all(Object.keys(next).map(function (k) {
      return api('/api/admin/content', {
        method: 'PUT', body: { key: 'fountain_' + k, value: next[k] }
      });
    })).then(function () {
      text = next;
      renderText();
      toast('Text saved');
    }).catch(function (e) {
      // A partial save is possible here — three writes, no transaction — so the
      // page is reloaded from the server rather than left showing what was typed.
      toast('Could not save: ' + e.message);
      api('/api/fountains').then(function (d) { text = d.text || {}; renderText(); });
    });
  });
}

function editFountain(id) {
  var f = byId(id);
  if (!f) return;
  ask('Edit fountain', '', [
    { key: 'co', label: 'Coordinates', value: fmt(f.lat) + ', ' + fmt(f.lng), hint: 'Decimal degrees, latitude first — e.g. 47.37690, 8.54170' },
    { key: 'name', label: 'Name', value: f.name || '' },
    { key: 'note', label: 'Note', value: f.note || '', multiline: true, hint: 'Your own words about this fountain. Shown to everyone, under the photograph.' }
  ], function (v) {
    var ll = parseLatLng(v.co);
    if (!ll) return toast('Coordinates must read like 47.3769, 8.5417');
    api('/api/admin/fountains/' + id, {
      method: 'PUT', body: { lat: ll.lat, lng: ll.lng, name: v.name, note: v.note }
    }).then(function (updated) {
      replaceInList(updated);
      render();
      reopen(id);
      toast('Saved');
    }).catch(function (e) { toast(e.message); });
  });
}

// The file picker is opened straight from the click, with no dialog in between:
// a modal's OK click between the button press and picker.click() gets the file
// dialog blocked on mobile. Same lesson as the client board's uploads.
function photoFountain(id) {
  var picker = document.getElementById('picker');
  picker.value = '';                   // re-picking the same file must still fire change
  picker.onchange = function () {
    if (picker.files[0]) uploadPhoto(id, picker.files[0]);
  };
  picker.click();
}

function uploadPhoto(id, file) {
  var fd = new FormData();
  fd.append('photo', file);
  toast('Uploading…');
  return api('/api/admin/fountains/' + id + '/photo', { method: 'POST', body: fd })
    .then(function (f) {
      replaceInList(f);
      render();
      reopen(id);
      toast('Photo saved');
    })
    .catch(function (e) { toast('Upload failed: ' + e.message); });
}

function removePhoto(id) {
  var f = byId(id);
  if (!f || !confirm('Remove the photograph from ' + (f.name ? '"' + f.name + '"' : 'this fountain') + '?')) return;
  api('/api/admin/fountains/' + id + '/photo', { method: 'DELETE' }).then(function (updated) {
    replaceInList(updated);
    render();
    reopen(id);
    toast('Photo removed');
  }).catch(function (e) { toast(e.message); });
}

function reopen(id) {
  var m = markerById[id];
  if (m) m.openPopup();
}

function delFountain(id) {
  var f = fountains.filter(function (x) { return x.id === id; })[0];
  if (!f) return;
  if (!confirm('Delete ' + (f.name ? '"' + f.name + '"' : 'this fountain') + '?')) return;
  api('/api/admin/fountains/' + id, { method: 'DELETE' }).then(function () {
    fountains = fountains.filter(function (x) { return x.id !== id; });
    map.closePopup();
    render();
    toast('Deleted');
  }).catch(function (e) { toast(e.message); });
}

// ── MODAL ────────────────────────────────────────────────────────────────────
// Text fields only — the same shape as the client board's ask(), minus the
// select and checkbox branches this page has no use for.
function ask(title, desc, fields, cb) {
  document.getElementById('m-title').textContent = title;
  document.getElementById('m-desc').textContent = desc || '';
  var box = document.getElementById('m-fields');
  box.innerHTML = fields.map(function (f, i) {
    var input = f.file ? '<input type="file" accept="image/*" id="mf-' + i + '">'
      : f.multiline ? '<textarea id="mf-' + i + '"' + (f.rows ? ' rows="' + (f.rows | 0) + '"' : '') + '></textarea>'
      : '<input type="text" id="mf-' + i + '">';
    return '<label class="m-label" for="mf-' + i + '">' + esc(f.label) + '</label>' + input +
      (f.hint ? '<div class="m-hint">' + esc(f.hint) + '</div>' : '');
  }).join('');
  // Values are assigned as properties, never interpolated into the markup, so a
  // quote in an existing name can't break out of the field. A file input has no
  // settable value — the browser forbids it — so it is skipped.
  fields.forEach(function (f, i) {
    if (f.file) return;
    document.getElementById('mf-' + i).value = f.value || '';
  });

  document.getElementById('modal').classList.add('on');
  var first = document.getElementById('mf-0');
  if (first) { first.focus(); if (first.select) first.select(); }

  var ok = document.getElementById('m-ok');
  var fresh = ok.cloneNode(true);        // drop any previous handler
  ok.parentNode.replaceChild(fresh, ok);
  fresh.onclick = function () {
    var out = {};
    fields.forEach(function (f, i) {
      var el = document.getElementById('mf-' + i);
      // A file field answers with the File itself, not a string — the caller
      // hands it straight to FormData.
      out[f.key] = f.file ? (el.files[0] || null) : el.value.trim();
    });
    closeModal();
    cb(out);
  };
  box.querySelectorAll('input[type="text"]').forEach(function (el) {
    el.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); fresh.click(); } };
  });
}

function closeModal() { document.getElementById('modal').classList.remove('on'); }
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && document.getElementById('modal').classList.contains('on')) closeModal();
});
</script>
