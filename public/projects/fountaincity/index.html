<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Fountain City · Bharat Bhatia</title>
<meta name="description" content="An ongoing project mapping the public fountains of Zürich.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400;1,500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<!-- ?v= breaks a browser out of a copy it is already holding: the server sends
     no-cache for /shared/* now, but a file already cached under the old 4-hour
     Cloudflare TTL is not revalidated until that TTL expires, and this page
     needs a chrome.js new enough to fire ch:theme. Bump v whenever a chrome
     change has to reach returning visitors inside the hour. -->
<link rel="stylesheet" href="/shared/chrome.css?v=3">
<script src="/shared/chrome.js?v=3"></script>
<style>
:root{
  --fi:'Playfair Display',Georgia,serif;
  --fm:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ink:#111110;
  --ink-2:#4A453E;
  --bg:#FAFAF8;
  --bg2:#F0EFEC;
  --line:#E2E0DA;
  --mute:#8A857C;
  --pink:#C8907A;
  --pink-d:#A87060;
  --no:#A8564A;
  --field:#fff;             /* the ground under an input or a button */
  --map-land:#F0EFEC;       /* the basemap's own ground — see DARK_TUNE */
  --geo:#3F6EA8;            /* your own position — deliberately not the fountains' terracotta */
  /* An rgb triple, not a colour: the floating stack's gradient and the text
     halos need their own alpha at each stop, so they compose it themselves. */
  --scrim:250,250,248;
  /* The admin bar is INVERTED against the page — ink ground, page-coloured
     text — so its own borders and hints cannot use --line or --mute, which are
     tuned for the page. They flip with the theme like everything else. */
  --ab-line:#3A3733;
  --ab-mute:#9C968C;
}

/* Dark mode, in the two blocks the main site uses and in the same order: the
   system preference first, guarded so an explicit light choice outranks it,
   then the explicit dark choice. Both test the data-theme attribute that
   shared/chrome.js writes, so the nav and the page turn together.

   The map turns too — see applyTheme(). A dark nav over a Positron basemap was
   the reason this page was pinned to light for a while; nothing pins it now
   unless someone puts lockTheme back in the Chrome.mount() call. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink:#F0EFEC;
    --ink-2:rgba(240,239,236,.78);
    --bg:#0E0E0C;
    --bg2:#1A1A18;
    --line:rgba(240,239,236,.14);
    --mute:rgba(240,239,236,.5);
    --no:#D07A6B;
  /* The fountains keep their terracotta in dark, but a brighter and MORE
     SATURATED one: #C8907A was mixed against a near-white page and over the
     tuned #22221F land it fell to 5.87:1, barely clear of a motorway at 5.22.
     #E38F63 measures 6.36:1 and lifts saturation 43% -> 56%, which is the half
     that actually does the work - the basemap either side of a fountain is a
     desaturated grey-brown, so chroma separates a 13px disc from it faster
     than luminance does, and it is what keeps the discs distinct from the
     near-neutral Kreis dashes. Hover goes BRIGHTER here, not darker: --pink-d
     darkens against the light page to gain contrast, and on dark land the same
     move would lose it. */
  --pink:#E38F63;
  --pink-d:#F2AE88;
    --field:#1A1A18;
    --map-land:#22221F;
    --geo:#6C9BD8;
    --scrim:14,14,12;
    --ab-line:#D6D2CA;
    --ab-mute:#7C776E;
  }
}
:root[data-theme="dark"] {
  --ink:#F0EFEC;
  --ink-2:rgba(240,239,236,.78);
  --bg:#0E0E0C;
  --bg2:#1A1A18;
  --line:rgba(240,239,236,.14);
  --mute:rgba(240,239,236,.5);
  --no:#D07A6B;
  /* The fountains keep their terracotta in dark, but a brighter and MORE
     SATURATED one: #C8907A was mixed against a near-white page and over the
     tuned #22221F land it fell to 5.87:1, barely clear of a motorway at 5.22.
     #E38F63 measures 6.36:1 and lifts saturation 43% -> 56%, which is the half
     that actually does the work - the basemap either side of a fountain is a
     desaturated grey-brown, so chroma separates a 13px disc from it faster
     than luminance does, and it is what keeps the discs distinct from the
     near-neutral Kreis dashes. Hover goes BRIGHTER here, not darker: --pink-d
     darkens against the light page to gain contrast, and on dark land the same
     move would lose it. */
  --pink:#E38F63;
  --pink-d:#F2AE88;
  --field:#1A1A18;
  --map-land:#22221F;
  --geo:#6C9BD8;
  --scrim:14,14,12;
  --ab-line:#D6D2CA;
  --ab-mute:#7C776E;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--fm);font-weight:300;font-size:14px;
  line-height:1.65;-webkit-font-smoothing:antialiased;height:100dvh;overflow:hidden}
button{font-family:var(--fm);font-size:13px;cursor:pointer;border:1px solid var(--line);background:var(--field);
  color:var(--ink);padding:8px 14px;border-radius:2px;transition:border-color .18s,background .18s,color .18s}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
input{font-family:var(--fm);font-size:13px;font-weight:300;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:2px;padding:9px 11px;width:100%}
input,textarea{font-family:var(--fm);font-size:13px;font-weight:300;color:var(--ink);background:var(--field);
  border:1px solid var(--line);border-radius:2px;padding:9px 11px;width:100%}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{resize:vertical;min-height:76px;line-height:1.6}

/* The cursor itself now comes from shared/chrome.css. Leaflet still needs
   naming here: its own grab/grabbing rules outrank a bare body selector, so
   without this the map shows an OS cursor AND the dot at once. */
@media (hover:hover) and (pointer:fine){
  .leaflet-container,.leaflet-container *{cursor:none !important}
}

/* This page carries the site's toggle and follows the site's theme, like every
   other page. It spent a while pinned to light (Chrome.mount's lockTheme, now
   gone) because a dark nav over a Positron basemap is a black bar on a white
   map — the page turns with the nav now, basemap included.

   Never pin the chrome by redeclaring the --ch-* tokens in a :root block here:
   chrome.css's dark block is `:root:not([data-theme="light"])`, specificity
   (0,2,0) against a plain :root's (0,1,0), so it wins regardless of order. That
   version put near-white nav text on this near-white scrim for anyone whose OS
   was dark. The data-theme attribute is what those selectors test. */

input[type=file]{padding:7px 9px;font-size:12px;background:var(--bg2)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px;width:100%}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

/* ── ADMIN BAR ────────────────────────────────────────────────────────
   Hidden entirely for the public; revealed by .on once /api/fountains
   says this visitor is the admin. Same idea as the client boards.

   It spans the FOOT of the screen rather than riding in #topstack. The top of
   this page is already spoken for — scrim, nav, eyebrow, title, tally — and a
   second dark bar in that stack pushed the map's first usable row a third of
   the way down the screen. Fixed, so panning the map never carries it off.

   Everything Leaflet parks in the bottom corners has to clear it; --abh is how
   (see syncAdminBar()). It resolves to 0 for the public, so nothing about the
   public page moves. */
#adminbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:600;max-width:100vw;
  background:var(--ink);color:var(--bg);font-size:12px;padding:10px 0;
  padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));pointer-events:auto}
#adminbar.on{display:block}
#adminbar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#adminbar button{background:transparent;color:var(--bg);border-color:var(--ab-line);padding:5px 10px;font-size:11.5px}
#adminbar button:hover{border-color:var(--bg)}
#ab-hint{color:var(--ab-mute);font-size:11.5px}

/* ── FLOATING TOP STACK ───────────────────────────────────────────────
   The admin bar and the title sit over the map. The stack itself takes no
   pointer events, so the map can be panned straight through the title —
   only the admin bar, which has real buttons, takes them back. */
/* The scrim belongs to the whole stack, not to the header alone: the nav is a
   row of this stack now, and a gradient that started below it would leave the
   nav sitting on an opaque edge. One gradient over nav + admin bar + title, and
   the map keeps running underneath and simply fades out from under all of it. */
#topstack{position:fixed;top:0;left:0;right:0;z-index:500;pointer-events:none;max-width:100vw;
  background:linear-gradient(to bottom,
    rgba(var(--scrim),.97) 0%, rgba(var(--scrim),.92) 42%,
    rgba(var(--scrim),.72) 68%, rgba(var(--scrim),0) 100%)}

/* ── HEADER ───────────────────────────────────────────────────────────── */
/* The scrim itself now lives on #topstack, above — the header is just the row
   that holds the title. */
header{padding:12px 0 44px;pointer-events:none}
.head-row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
h1{font-family:var(--fi);font-style:italic;font-weight:400;font-size:34px;line-height:1.15;margin:8px 0 0}
/* The scrim fades to nothing at its lower edge, so the text near that edge
   can't rely on it. A soft light halo carries the rest. text-shadow rather
   than mix-blend-mode, deliberately: blend modes detach position:fixed on
   Android Chrome, which is exactly what the whole layout rests on here. */
header .eyebrow,header h1,.intro,#count,#near,
#topstack .ch-name,#topstack .ch-links > li > a{
  text-shadow:0 1px 3px rgba(var(--scrim),.95), 0 0 14px rgba(var(--scrim),.85)}

/* The sentence collapses once the map is touched — see leanOnUse().

   The collapse animates a grid track from 1fr to 0fr rather than a max-height,
   because a max-height has to be guessed: whatever number you pick, an intro
   longer than it is silently cut off mid-sentence, and the text is editable so
   there is no safe number. 1fr resolves to whatever the text actually needs.
   min-height:0 on the child is what lets the track reach zero. */
.intro-wrap{display:grid;grid-template-rows:1fr;margin-top:10px;
  transition:grid-template-rows .32s ease,opacity .32s ease,margin-top .32s ease}
.intro{color:var(--mute);font-size:12.5px;max-width:62ch;min-height:0;overflow:hidden}
#topstack.lean .intro-wrap{grid-template-rows:0fr;opacity:0;margin-top:0}
#topstack.lean header{padding-bottom:26px}
/* On a phone the eyebrow rides out with the sentence and comes back with it
   (see the mobile block); on a desktop it never collapses at all. The same
   1fr→0fr grid track as .intro-wrap, and for the same reason — the string is
   editable from the admin bar, so there is no max-height that stays safe. */
.eyebrow-wrap{display:grid;grid-template-rows:1fr;
  transition:grid-template-rows .32s ease,opacity .32s ease}
.eyebrow-wrap .eyebrow{min-height:0;overflow:hidden}
.head-left{min-width:0}
.head-right{display:flex;align-items:flex-start;gap:10px}
.meta{min-width:0}
#count{font-size:11.5px;letter-spacing:.04em;color:var(--mute);white-space:nowrap}
/* The one thing in the floating header that takes pointer events besides the
   admin bar. Desktop has room for the sentence permanently, so it only appears
   where the sentence actually collapses. */
#lean-toggle{display:none;pointer-events:auto;width:30px;height:30px;padding:0;
  line-height:1;font-size:15px;border-radius:50%;border:1px solid var(--line);
  background:rgba(var(--scrim),.92);color:var(--mute);flex:none}
#lean-toggle:hover{border-color:var(--ink);color:var(--ink)}
#count b{font-weight:500;color:var(--ink)}

/* ── MAP ──────────────────────────────────────────────────────────────
   The map IS the page: pinned to the viewport, edge to edge, with the title
   and the admin bar floating over it. Anything less than this reads as a
   screenshot of a map rather than the map itself.

   position:fixed here is the same load-bearing arrangement the public site
   documents — it detaches on Android Chrome the moment anything overflows
   horizontally, hence overflow:hidden on body and max-width:100vw on the
   floating stack. */
.map-wrap{position:fixed;inset:0;z-index:0;display:flex}
/* --map-land is the basemap's own ground, so the frame before the tiles arrive
   is the colour they will settle on rather than a darker grey that flashes. In
   dark it is the same #22221F DARK_TUNE paints the land. */
#map{flex:1;border:0;border-radius:0;background:var(--map-land)}
.leaflet-container{font-family:var(--fm);font-weight:300;background:var(--map-land)}
/* No filter on the tile pane: the basemap already arrives grey. A canvas
   basemap is built to sit under data — it draws land, water, roads and a few
   faint labels, and no railways or ferry routes, which is what made the plain
   OSM tiles read as a transit map. */
.leaflet-control-attribution{font-size:10px;background:rgba(var(--scrim),.86);color:var(--mute)}
.leaflet-control-attribution a{color:var(--ink)}
/* Leaflet's own zoom buttons ship white with near-black glyphs, which is a pair
   of bright squares on a dark map. They take the page's tokens instead. */
.leaflet-bar a,.leaflet-bar a:hover{background:var(--bg);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--bg2)}
.leaflet-bar a.leaflet-disabled{background:var(--bg2);color:var(--mute)}
/* The zoom control, Locate, and the attribution the tiles' licence requires all
   live down here, so they ride above the admin bar when it is on. --abh is
   measured rather than assumed: the bar's controls wrap onto a second line on a
   narrow phone, and it is unset (0) for everyone who is not the admin. */
.leaflet-bottom{margin-bottom:var(--abh,0px);transition:margin-bottom .2s ease}

/* Bottom-left, not the conventional top-left: this is the one control meant to
   be pressed while walking, so it sits where a thumb already is.

   A crosshair, not the words "Locate me". The label had to say three different
   things — Locate me / Locating... / Following — so the button changed width
   under the thumb that was pressing it, and it was the widest object in the
   corner for something every map app draws as one glyph. The state lives in
   the button's own appearance now (outline → pulsing → filled) and in its
   title/aria-label, which is what a screen reader and a desktop hover read.
   setLocState() is the single place that sets all three. */
.loc-btn{background:var(--bg);border:1px solid var(--line);border-radius:50%;
  width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--fm);color:var(--ink);cursor:pointer;
  box-shadow:0 1px 6px rgba(17,17,16,.22)}
.loc-ico{width:19px;height:19px;display:block}
/* Following: the button inverts, and the glyph comes with it because every
   stroke in the SVG is currentColor. */
.loc-btn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* A fix can take several seconds outdoors, so the button has to show it is
   working. A spinner on a crosshair reads as the map itself turning; a pulse
   does not. */
@keyframes loc-pulse{0%,100%{opacity:1}50%{opacity:.28}}
.loc-btn.busy .loc-ico{animation:loc-pulse 1.1s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.loc-btn.busy .loc-ico{animation:none;opacity:.5}}
/* Blue, and deliberately not the fountains' terracotta — you are not a fountain. */
/* Ringed in --ink for the same reason .fmark is — it opposes the ground
   instead of matching it, so the dot keeps its edge in both themes. */
.me-dot{width:14px;height:14px;border-radius:50%;background:var(--geo);border:2px solid var(--ink);
  box-shadow:0 0 0 1px rgba(17,17,16,.28)}
/* A fountain's name is free text and lands in here, and Zurich's are compounds
   — 22ch cut most of them off mid-word („Flös…"), which reads as a broken page
   and defeats the point of the readout: naming the fountain you are walking to.
   It wraps onto a second line instead. The width cap is what keeps a long name
   off the title — that was the ellipsis's job, and the cap does it without
   hiding anything — and overflow-wrap breaks a compound carrying no space at
   all rather than letting it push past the cap. */
#near{display:block;color:var(--mute);max-width:min(32ch,58vw);overflow-wrap:anywhere}
#near b{font-weight:500;color:var(--ink)}
/* There is no readout until a position fix arrives, and on a phone the tally
   and the readout share one line with a separator drawn by ::before — which
   would otherwise leave a lone middot hanging after the count. */
#near:empty{display:none}

/* A fountain is a small terracotta disc, not a pin — a few hundred pins read
   as a pincushion, and a disc keeps its exact point at its own centre.

   The ring is --ink, NOT --bg: it separates the disc from the map by opposing
   the ground rather than matching it, so it is dark on the light basemap and
   bright on the dark one. Matching the page ground gave a white ring on light
   grey land — the two were close enough that the disc lost its edge — and in
   dark it put a near-black ring on land only a shade lighter. Ink flips with
   the theme on its own, so this stays one declaration. box-sizing is
   border-box globally, so the ring eats into the 13px rather than growing it
   and the icon still matches its 13px iconSize / 6.5px anchor. */
.fmark{width:13px;height:13px;border-radius:50%;background:var(--pink);
  border:2px solid var(--ink);box-shadow:0 1px 4px rgba(17,17,16,.4);
  transition:transform .15s,background .15s}
.fmark:hover{transform:scale(1.35);background:var(--pink-d)}
.leaflet-popup-content-wrapper{border-radius:3px;box-shadow:0 4px 20px rgba(17,17,16,.18)}
/* The tip is a rotated square, so it has to be told the same ground as the
   wrapper or the popup grows a white beak in dark mode. */
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--bg);color:var(--ink)}
.leaflet-popup-content{margin:13px 15px;font-size:12.5px;line-height:1.55}
.pop-name{font-family:var(--fi);font-style:italic;font-size:16px;display:block;margin-bottom:2px}
.pop-name.none{font-family:var(--fm);font-style:normal;font-size:12.5px;color:var(--mute)}
.pop-co{color:var(--mute);font-size:11px;letter-spacing:.02em;display:block}
.pop-note{margin:6px 0 0;color:var(--ink-2);font-size:12px;white-space:pre-wrap;
  border-left:2px solid var(--pink);padding-left:9px}
/* The photograph bleeds to the popup's edges — the negative margins cancel
   .leaflet-popup-content's own padding rather than fighting it. */
.pop-img{display:block;margin:-13px -15px 10px;border-radius:3px 3px 0 0;overflow:hidden;background:var(--bg2)}
.pop-img img{width:100%;height:auto;display:block}
.pop-adm{display:flex;flex-wrap:wrap;gap:5px;margin-top:11px;padding-top:9px;border-top:1px solid var(--line)}
.pop-adm button{padding:4px 8px;font-size:11px}
.pop-del{color:var(--no)}
.pop-del:hover{border-color:var(--no)}

/* ── MODAL / TOAST (admin only) ───────────────────────────────────────── */
#modal{position:fixed;inset:0;background:rgba(17,17,16,.5);z-index:1200;display:none;
  align-items:center;justify-content:center;padding:22px}
#modal.on{display:flex}
.modal-card{background:var(--bg);border-radius:3px;padding:24px;width:100%;max-width:400px;
  max-height:86vh;overflow-y:auto}
.modal-card h4{font-family:var(--fi);font-style:italic;font-weight:400;font-size:19px;margin-bottom:6px}
.modal-card p{font-size:12px;color:var(--mute);margin-bottom:14px}
.modal-row{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.m-label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:12px 0 5px}
.m-label:first-child{margin-top:0}
.m-hint{font-size:11px;color:var(--mute);margin-top:5px;line-height:1.5}
#toast{position:fixed;bottom:calc(22px + var(--abh,0px));left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:2px;font-size:12.5px;
  opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:1300}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── MOBILE ───────────────────────────────────────────────────────────
   A phone is where this map is actually used — outdoors, one-handed, walking
   — and the floating stack was taking roughly a third of that screen before
   anything of Zürich was visible. Every rule below buys map back. */
@media(max-width:640px){
  .wrap{padding-left:16px;padding-right:16px}

  /* The nav is this page's first row, not a document's header, so it does not
     need a document's breathing room. Tightened here rather than in
     shared/chrome.css, which every standalone page reads: this is the map
     page's own judgement, not the chrome's. The 16px matches .wrap, so the
     brand lines up with the title's gutter instead of sitting 4px outside it. */
  #topstack .ch-nav{padding:.85rem 16px .35rem;
    padding-top:calc(.85rem + env(safe-area-inset-top,0px))}

  header{padding:4px 0 30px}
  h1{font-size:25px;transition:font-size .32s ease,margin-top .32s ease}
  .intro{font-size:12px}

  /* The tally and the nearest-fountain readout drop BENEATH the title instead
     of sharing its row. They were a right-hand column capped at 58vw, and a
     Zürich compound name wraps to two lines inside that cap — so the busiest,
     tallest thing in the header was a piece of metadata, and it squeezed the
     title into the leftover third. One line under the title, at the tally's own
     size, reads as a single sentence and leaves the title the full width. */
  .head-row{flex-wrap:wrap;align-items:flex-start;gap:0}
  .head-right{width:100%;margin-top:5px;align-items:center;
    justify-content:space-between;gap:10px}
  .meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 7px}
  #count,#near{display:inline;font-size:12px;letter-spacing:.03em}
  #near{max-width:none}
  #near::before{content:'\00B7';margin-right:7px;color:var(--mute)}

  /* Once the map has been touched the header is down to two rows: the title,
     smaller, and the one line of metadata. The eyebrow leaves with the
     sentence — it says what the project is, which is the one thing you have
     already read by the time you reach for the map. #lean-toggle brings all of
     it back. */
  #topstack.lean .eyebrow-wrap{grid-template-rows:0fr;opacity:0}
  #topstack.lean h1{font-size:22px;margin-top:0}
  #topstack.lean header{padding-bottom:14px}
  #lean-toggle{display:block}

  /* Zoom buttons are desktop furniture. Here the page already carries pinch,
     double-tap and the double-tap-and-drag gesture (initTapZoom), so the
     control was a permanent 60px column in the corner duplicating something
     the screen does better — and it sat directly above the one button that has
     to be findable while walking. Desktop keeps it; the wheel there is
     continuous but the buttons are how you land on a whole zoom level. */
  .leaflet-control-zoom{display:none}
  .loc-btn{width:46px;height:46px}
  .loc-ico{width:21px;height:21px}

  /* The admin bar was three wrapped lines of chrome across the foot of a phone
     — a label, three buttons and a sentence — for a tool used while standing
     at a fountain. Label and hint are desktop affordances (the bar is inverted
     against the page, which already says "admin", and tap-to-place is learned
     once), so on a phone it is the three buttons and nothing else, on one
     line. syncAdminBar() measures what is left, so Locate and the attribution
     follow it up and down by themselves. */
  #adminbar{padding:6px 0;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  #adminbar .wrap{gap:6px;padding-left:12px;padding-right:12px}
  #adminbar .ab-label,#adminbar #ab-hint{display:none}
  #adminbar button{padding:6px 8px;font-size:10.5px}
}
</style>
</head>
<body>

<div id="topstack">
<header>
  <div class="wrap">
    <div class="head-row">
      <div class="head-left">
        <div class="eyebrow-wrap"><div class="eyebrow" id="p-eyebrow"></div></div>
        <h1 id="p-title"></h1>
      </div>
      <!-- Right of the title on a desktop, a full-width line under it on a
           phone: see the mobile block in the stylesheet. -->
      <div class="head-right">
        <div class="meta"><div id="count"></div><div id="near"></div></div>
        <button id="lean-toggle" type="button" onclick="toggleLean()">&#8964;</button>
      </div>
    </div>
    <div class="intro-wrap"><div class="intro" id="p-intro"></div></div>
  </div>
</header>
</div>

<div class="map-wrap"><div id="map"></div></div>

<!-- Across the foot of the screen, outside #topstack: see the ADMIN BAR block
     in the stylesheet for why it is not part of the floating header. -->
<div id="adminbar">
  <div class="wrap">
    <span class="eyebrow ab-label" style="color:var(--ab-mute)">Admin view</span>
    <button onclick="addFountain()">+ Fountain</button>
    <button id="ab-here" onclick="addHere()">+ Fountain here</button>
    <button onclick="editText()">Edit text</button>
    <span id="ab-hint">or click anywhere on the map to place one</span>
  </div>
</div>

<div id="modal">
  <div class="modal-card">
    <h4 id="m-title"></h4>
    <p id="m-desc"></p>
    <div id="m-fields"></div>
    <div class="modal-row">
      <button onclick="closeModal()">Cancel</button>
      <button id="m-ok" style="background:#111110;color:#FAFAF8;border-color:#111110">Save</button>
    </div>
  </div>
</div>

<!-- Opened directly by the pin's Add/Replace photo button. It lives outside the
     modal so the click that opens it is the user's own gesture, unmediated. -->
<input type="file" id="picker" accept="image/*" style="display:none">

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<!-- MapLibre draws the basemap from vector tiles; the bridge mounts it as a
     Leaflet layer so every marker, popup and handler below stays plain Leaflet.
     Both are optional at runtime — see addBasemap(). -->
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.22/leaflet-maplibre-gl.js"></script>
<script>
// ── STATE ────────────────────────────────────────────────────────────────────
var fountains = [];
var isAdmin = false;
var map, layer;
// The basemap and the district outline are held so a theme change can restyle
// them — everything else on this page follows the CSS tokens by itself.
var basemap = null, kreis = null;
// Markers indexed by fountain id, so an edit can reopen the popup it came from
// — render() rebuilds every marker, which would otherwise close it silently.
var markerById = {};

// The Stadtkreis 1 outline, as published by Stadt Zürich (see kreis1.geojson
// for the source and retrieval date). Absolute path, not relative: the page is
// served at /projects/fountaincity with no trailing slash, so a relative fetch
// would resolve against /projects/ and 404.
var KREIS1_URL = '/projects/fountaincity/kreis1.geojson';

// Live position. watchId non-null means the watch is running; pos is the last
// fix, kept so "add here" doesn't have to wait for a fresh one.
var geo = { watchId: null, pos: null, at: 0, marker: null, ring: null, follow: false };

// A fix looser than this is worth warning about before it becomes a fountain's
// permanent coordinate: 25m is most of a city block, and phone GPS routinely
// reports 5-10m outdoors under open sky and 40+ between tall buildings.
var ACCURACY_WARN = 25;

// Double tap zooms in, two-finger tap zooms out. A tap only counts as a tap if
// the finger barely moved — otherwise it was a pan or a pinch.
//
// DBL_MS is measured from one tap LIFTING to the next one LANDING, which is how
// a phone measures it. Measuring to the second tap's own lift instead charges
// the gesture for however long the finger rests on the glass, and an unhurried
// double tap then misses the window every time — that is what shipped first and
// why the gesture did nothing.
var DBL_MS = 400;       // ms between one tap lifting and the next landing
var TAP_MAX = 500;      // longer than this and the finger rested, not tapped
var TAP_SLOP = 30;      // px a finger may wander within one tap
var DBL_SLOP = 60;      // px between the two taps of one double tap
var PAIR_MIN = 60;      // px apart before two contacts are two fingers, not one
                        // thumb tapping twice faster than the browser reports it
var PX_PER_ZOOM = 110;  // finger travel, in px, for one whole zoom level
var DRAG_MIN = 12;      // px before a held second tap becomes a zoom drag

// The desktop wheel, in the same currency: px of scroll for one zoom level. A
// mouse notch is 100px in Chrome, so it buys most of a level; a trackpad's
// stream of 1-10px events adds up continuously. WHEEL_PINCH_PX is for a
// trackpad pinch, which the browser reports as a wheel with ctrlKey set and
// much smaller numbers. WHEEL_EASE is the fraction of the remaining distance
// covered each frame — the whole reason the mouse feels smooth rather than
// stepped, since a notch arrives as one event and has to be *travelled*.
var WHEEL_PX_PER_ZOOM = 120;
var WHEEL_PINCH_PX = 45;
var WHEEL_MAX_PX = 180;  // one absurd notch must not fly across four levels
var WHEEL_EASE = 0.28;
var WHEEL_DONE = 0.002;  // closer than this to the target and it has arrived
var TAPLOG = typeof location !== 'undefined' && /[?&]taplog=1/.test(location.search);

// The page's own copy, editable from the admin bar and stored in the site-wide
// `content` table under fountain_*. These defaults are the same strings the
// server seeds, and exist so the page still reads correctly if the fetch fails
// or a key has never been written.
var text = {};
var TEXT_DEFAULTS = {
  eyebrow: 'Zürich · Ongoing',
  title: 'Fountain City',
  intro: 'Zürich runs on drinking water. This is a map of the public fountains, ' +
    'added one at a time as I find and photograph them.'
};

// A stored empty string means deliberately empty — that line simply doesn't
// render. Only a key that was never written at all falls back to the default,
// so clearing the intro doesn't have it reappear on the next load.
function txt(key) {
  return (typeof text[key] === 'string') ? text[key] : TEXT_DEFAULTS[key];
}

function renderText() {
  var t = txt('title') || TEXT_DEFAULTS.title;      // the title never blanks
  document.getElementById('p-eyebrow').textContent = txt('eyebrow');
  document.getElementById('p-title').textContent = t;
  document.getElementById('p-intro').textContent = txt('intro');
  document.title = t + ' · Bharat Bhatia';
}

// Bürkliplatz-ish — the default view before there is anything to fit to.
var ZURICH = [47.3717, 8.5423];

// ── HELPERS ──────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function api(path, opts) {
  opts = opts || {};
  // FormData sets its own multipart Content-Type, boundary and all — setting
  // one by hand here would corrupt every upload.
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(opts.body);
  }
  opts.credentials = 'same-origin';
  return fetch(path, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    });
  });
}

var toastTimer;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2200);
}

// Accepts what a map app actually hands you when you copy a location:
// "47.3769, 8.5417", or the same pair separated by a space or a semicolon.
// Returns null rather than a half-parsed pair — a typo that silently became
// 0 would drop a fountain in the Gulf of Guinea.
function parseLatLng(str) {
  var m = String(str).trim().match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  var lat = parseFloat(m[1]), lng = parseFloat(m[2]);
  if (Math.abs(lat) > 90 || Math.abs(lng) > 180) return null;
  return { lat: lat, lng: lng };
}

function fmt(n) { return Number(n).toFixed(5); }

// Cloudinary URL builder — the same shape as cldUrl() in server.js and cld() in
// the public and admin SPAs. q_auto:good, never bare q_auto, which bands dark
// gradients once f_auto starts serving AVIF. Keep the widths to the two the
// upload pre-builds (see FOUNTAIN_WIDTHS), or a visitor waits while Cloudinary
// generates a fresh derivative on first view.
function cld(url, w) {
  if (!url || url.indexOf('/image/upload/') === -1) return url;
  return url.replace('/image/upload/', '/image/upload/w_' + w + ',f_auto,q_auto:good/');
}

// ── MAP ──────────────────────────────────────────────────────────────────────
function initMap() {
  // Zoom moves to the bottom with the Locate button: the top-left corner now
  // sits under the title, where the buttons would be both ugly and unreadable.
  map = L.map('map', { zoomControl: false, scrollWheelZoom: true, maxZoom: 20 }).setView(ZURICH, 13);
  L.control.zoom({ position: 'bottomleft' }).addTo(map);
  // Leaflet's own 'Leaflet' prefix is a courtesy, not a licence condition, and
  // it is what tips the attribution onto a second line on a phone. The tile
  // credits themselves (OpenFreeMap / OpenMapTiles / OpenStreetMap) are
  // required by ODbL and stay exactly as they are.
  if (map.attributionControl) map.attributionControl.setPrefix('');
  addBasemap();
  addKreis();
  layer = L.layerGroup().addTo(map);
  initLocate();
  leanOnUse();
  initTapZoom();
  initWheelZoom();

  // Placing by click is admin-only, and the handler is attached only for the
  // admin, so a visitor's stray tap on the map does nothing at all.
  if (isAdmin) {
    map.on('click', function (e) { queueAdd(e.latlng); });
    map.on('dblclick', blockAdd);     // the mouse route to the same zoom
  }
}

// The basemap is vector, not tiles-as-pictures: MapLibre draws it from
// geometry, so it is sharp at every zoom and every pixel density and never
// upscales. OpenFreeMap serves the Positron style — the muted, transit-free
// look this page wants — with no API key and no signup.
//
// The raster fallback is not decoration. MapLibre is two more scripts off a CDN
// and it needs WebGL; if either is unavailable the page still gets a map (the
// Esri canvas this page used before) rather than a blank grey rectangle.
function addBasemap() {
  var dark = themeIsDark();
  if (window.maplibregl && L.maplibreGL && hasWebGL()) {
    basemap = L.maplibreGL({
      style: styleUrl(dark),
      attribution: '&copy; <a href="https://openfreemap.org">OpenFreeMap</a> ' +
        '&copy; <a href="https://www.openmaptiles.org/">OpenMapTiles</a> ' +
        '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);
    // The GL map only exists once the layer has been added. styledata rather
    // than load: it fires for the first style AND for every swap after it.
    var glMap = basemap.getMaplibreMap ? basemap.getMaplibreMap() : null;
    if (glMap && glMap.on) {
      glMap.on('styledata', function () { tuneBasemap(glMap, styleUrl(themeIsDark())); });
    }
    return;
  }
  // Esri's Gray Canvas: keyless, and a deliberate data backdrop — no S-Bahn
  // lines, no ferry routes, barely any labels. Light and Dark are the same
  // service with one word swapped. Note {y} precedes {x} here, unlike OSM. It
  // stops rendering at zoom 16, so maxNativeZoom upscales the last steps, and
  // detectRetina fetches the next zoom's tiles to draw at half size, which is
  // what keeps it sharp on a 2x screen.
  basemap = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_' +
      (dark ? 'Dark' : 'Light') + '_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; <a href="https://www.esri.com/">Esri</a>',
    detectRetina: true,
    maxNativeZoom: 16,
    maxZoom: 19
  }).addTo(map);
}

// ── THEME ────────────────────────────────────────────────────────────────────
// The nav's toggle is the site's, not this page's: it writes data-theme and the
// same localStorage key every other page reads, so a choice made here is still
// made when the visitor lands on the shop. Chrome.isDark() is the one reader —
// asking matchMedia here as well would answer differently for someone whose
// stored choice contradicts their OS.
function themeIsDark() {
  if (window.Chrome && Chrome.isDark) return Chrome.isDark();
  var set = document.documentElement.getAttribute('data-theme');
  if (set) return set === 'dark';
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}

function cssVar(name) {
  try {
    return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  } catch (e) { return ''; }
}

function ringStyle() {
  var c = cssVar('--geo') || '#3F6EA8';
  return { color: c, fillColor: c };
}

// OpenFreeMap's dark style is drawn for a map you glance at, not one you walk
// with: measured against its own rgb(12,12,12) ground, a minor street is 1.10:1
// and water is 1.14:1 — invisible — while railways come out at 1.24:1, brighter
// than the roads. That is the S-Bahn-diagram failure this page rejected plain
// OSM tiles for, arriving from the other direction.
//
// So the style is kept and a handful of its layers are repainted, rather than
// forking 47 layers of somebody else's cartography. What the table below builds
// is a ladder: land, then water and the quiet context (parks, buildings,
// railways) just above it, then paths, minor streets, major roads, motorways,
// and the labels at the top. The fountains' terracotta lands at 6.4:1 on that
// land — above every road, below the labels, which is where the subject of the
// map belongs.
//
// Light needs none of this — Positron is already a walking map.
// The ratios in the comments are measured against the land (#22221F) and are
// the point of the table — a legibility ladder, deliberately spaced, not a set
// of colours someone liked.
//
// The first version of this ladder was too timid, and the lesson is worth
// keeping: land at #1A1A18 with minor streets at 1.79:1 measured far better
// than upstream's 1.10:1 and still could not be read on a phone outdoors, which
// is the only place this map is ever used. A dark map has to be dark GREY
// paper, not black paper. The land is what gives every line above it somewhere
// to go, so blackening it squeezes the whole ladder into a range no screen
// resolves in daylight — and the fix is to raise the land, not to keep
// brightening the lines against it. Minor streets now sit at 2.95:1, major at
// 4.28:1, motorways at 5.22:1. Retune from the land first; the rungs follow.
var DARK_TUNE = {
  background:              { 'background-color': '#22221F' },   // land, 1.00
  // Water is the exception to the ladder: it is a SHAPE, not a line, so it
  // reads on hue at low contrast. In Zurich the lake and the Limmat are how you
  // know where you are, so they are lifted clear of the land and made
  // unmistakably cool against a page of warm neutrals.
  water:                   { 'fill-color': '#2E4250' },         // 1.53
  waterway:                { 'line-color': '#37505F' },         // 1.88
  landuse_park:            { 'fill-color': '#26301F' },         // 1.16
  landcover_wood:          { 'fill-color': '#26301F' },         // 1.16
  building:                { 'fill-color': '#2C2C28', 'fill-outline-color': '#373732' },  // 1.14
  // Railways sit BELOW the smallest street on purpose. Upstream had them at
  // 1.24 against roads at 1.10, which is the S-Bahn-diagram failure this page
  // rejected plain OSM tiles for, arriving from the other direction.
  railway:                 { 'line-color': '#333229' },         // 1.24
  railway_minor:           { 'line-color': '#333229' },
  railway_transit:         { 'line-color': '#333229' },
  highway_path:            { 'line-color': '#4E4B42' },         // 1.83
  highway_minor:           { 'line-color': '#6E6A5D', 'line-opacity': 1 },  // 2.95
  highway_major_casing:    { 'line-color': 'rgba(140,135,124,.5)' },
  highway_major_inner:     { 'line-color': '#8A8474' },         // 4.28
  highway_major_subtle:    { 'line-color': '#5E5A50' },         // 2.32
  highway_motorway_casing: { 'line-color': 'rgba(160,154,140,.55)' },
  // Trimmed to sit under the fountains' terracotta, which is 6.36:1 in dark
  // (--pink is #E38F63 there, not the page's #C8907A): a motorway must
  // not be as loud as the thing the map is about.
  highway_motorway_inner:  { 'line-color': '#9A9382' },         // 5.22
  highway_motorway_subtle: { 'line-color': '#66614F' },         // 2.57
  boundary_state:          { 'line-color': '#57534A' },         // 2.08
  // Labels last. The halo width is what lets a street name cross its own
  // street: the glyphs need the ground under them, not beside them.
  highway_name_other:      { 'text-color': '#E0DACD', 'text-halo-color': 'rgba(34,34,31,.92)',
                             'text-halo-width': 1.3 },          // 11.45
  highway_name_motorway:   { 'text-color': '#EDE8DC', 'text-halo-color': 'rgba(34,34,31,.92)',
                             'text-halo-width': 1.3 },
  // Upstream labelled the lake in black text on a black ground.
  water_name:              { 'text-color': '#A9C4D4', 'text-halo-color': 'rgba(34,34,31,.85)',
                             'text-halo-width': 1.2 }           // 8.76
};
['place_other','place_suburb','place_village','place_town','place_city','place_city_large']
  .forEach(function (id) {
    DARK_TUNE[id] = { 'text-color': '#F4EFE4', 'text-halo-color': 'rgba(34,34,31,.92)',
                      'text-halo-width': 1.3 };                 // 13.91
  });

// Positron draws no one-way arrows; the dark style draws one every 200px along
// every one-way street, which over the old town is a field of chevrons for the
// fountains to compete with. This is a map of fountains, not a driving map, so
// they are turned off outright rather than dimmed — dark should show the same
// city the day map shows.
// ── THE TWO STYLES MUST SHOW THE SAME CITY ───────────────────────────────────
// Dark and light are two people's cartography, not one style wearing two
// palettes, and left alone they disagree about what a map of Zürich contains.
// Everything below is one rule: whatever a visitor can read in one theme they
// can read in the other. Where the two disagreed the quieter answer won — this
// is a map of fountains, and a label that is not a fountain or the street one
// stands on is competing with the subject.
//
// The differences were established from the TILES, not by reading the styles.
// The z14 tile over Zürich (the source stops at z14, so z15-20 overzoom this
// same data) holds: 27 place points — one city, twelve suburbs, fourteen
// quarters; 548 street names of which only 67 are major roads; 14 water names
// of which "Zürichsee" is the one LINE and every other is a pond or a fountain
// basin; two `park` features, both points, which positron's polygon-only filter
// draws nowhere; no `landuse` class=park at all, which is dark's park layer
// drawing nowhere; and 9,207 POIs and 303 house numbers neither style touches.
// Those counts are what the plans below are tuned against — measure a tile
// again rather than re-reading the style JSON if this ever looks wrong.
//
// A plan is applied in a fixed order — paint, filter, zoom, add, hide — and two
// steps depend on it: `add` clones a layer AFTER paint, so a clone inherits the
// tuned colours, and BEFORE hide, so cloning off a layer that is about to be
// hidden still yields a visible one.
var DARK_PLAN = {
  paint: DARK_TUNE,

  hide: [
    // Positron draws no one-way arrows; the dark style stamps one every 200px
    // along every one-way street, which over the old town is a field of
    // chevrons for the fountains to compete with. A map of fountains, not a
    // driving map.
    'road_oneway', 'road_oneway_opposite',
    // Motorway numbers. Dark writes the ref along the road as text, positron
    // stamps it into a shield — the same driver's furniture in two costumes,
    // so both go (the shields are in LIGHT_PLAN).
    'highway_name_motorway',
    // Hamlets, neighbourhoods and isolated dwellings. Positron's label_other is
    // filtered down to suburbs below, so these would be dark's alone.
    'place_other'
  ],

  zoom: {
    // Positron holds minor street names back to z15 and path names to z15.5,
    // showing only major roads before that. Dark's one layer took every
    // non-motorway name the moment the tile loaded: 548 labels against
    // positron's 67 at the zoom where the whole city is on screen. The majors
    // come back as a clone below.
    'highway_name_other': [15, 24]
  },

  // Wrapped onto upstream's own filter, never replacing it — its geometry and
  // class tests are still needed.
  filter: {
    // transportation_name carries ferry routes under class "ferry", and this
    // layer takes everything that is not a motorway, so lifting street labels
    // to 11.45:1 lifted the lake's ferry routes across the water with them.
    // Positron files ferries under none of its name layers.
    'highway_name_other': ['!=', ['get', 'class'], 'ferry']
  },

  add: [
    // Major roads keep their names from z12.2, the way positron does it, now
    // that the layer above starts at z15. Capped AT 15 so the two never label
    // the same road twice and fight each other for the space.
    { id: 'bp_highway_name_major', from: 'highway_name_other',
      before: 'highway_name_other', minzoom: 12.2, maxzoom: 15,
      filter: ['all',
        ['match', ['get', 'class'], ['primary', 'secondary', 'tertiary', 'trunk'], true, false],
        ['match', ['geometry-type'], ['LineString', 'MultiLineString'], true, false]] },
    // Positron names the rivers; dark has no waterway label layer at all, so
    // the Limmat, the Sihl and the Schanzengraben ran through it unnamed — and
    // in Zürich the water is how you know where you are. Cloned off water_name,
    // which is already exactly the right shape: a line-placed label, and by
    // this point in the plan already repainted the cool blue the lake gets.
    { id: 'bp_waterway_name', from: 'water_name', before: 'water_name',
      sourceLayer: 'waterway', minzoom: 10,
      filter: ['match', ['geometry-type'], ['LineString', 'MultiLineString'], true, false] },
    // The two styles take their parks from two different source layers —
    // positron from `park` (protected areas and nature reserves), dark from
    // `landuse` class=park (a city's own parks). Over Zürich both happen to be
    // empty today, so this changes nothing on screen; it exists so that the day
    // someone tags the Platzspitz either way, both themes draw it. Each style
    // keeps its own green: the clone inherits the layer it was cloned from.
    { id: 'bp_park', from: 'landuse_park', before: 'landuse_park', sourceLayer: 'park',
      filter: ['match', ['geometry-type'], ['MultiPolygon', 'Polygon'], true, false] }
  ]
};

var LIGHT_PLAN = {
  hide: [
    // The white lozenges stamping "3", "17", "A3W" along half the streets in
    // town. A road's number says nothing about where a fountain is, and dark
    // has no shield layers at all. Three of them, because upstream draws the US
    // networks separately.
    'highway-shield-non-us', 'highway-shield-us-interstate', 'road_shield_us',
    // Zürich maps a good many of its fountains as named water AREAS, so this
    // lake layer was captioning Geisterbrunnen, Münsterhofbrunnen and
    // Zentralhofbrunnen in blue and saying nothing about the other hundreds —
    // three named out of hundreds reads as those three mattering. Dark's
    // water_name matches LineString only and never had them. Nothing is lost
    // by hiding it: „Zürichsee" is a LINE feature, drawn by the line-label
    // layer in both themes.
    'water_name_point_label',
    // The ZRH label from z11. Dark carries no aerodrome layer whatsoever.
    'airport'
  ],

  zoom: {
    // Dark caps its place labels — suburbs at z15, cities at z14 — where
    // positron lets them ride to z20, so a neighbourhood name sat over the map
    // in light while you were walking a street, and not in dark.
    'label_other': [8, 15],
    'label_village': [9, 14],
    'label_town': [6, 15],
    'label_city': [3, 14],
    'label_city_capital': [3, 14],
    // Dark stops tinting residential landuse at z9; positron carried it to z16.
    'landuse_residential': [0, 9]
  },

  filter: {
    // label_other is "anything that is not a city, town, village, state or
    // country", which over Zürich means twelve suburbs AND fourteen quarters —
    // Lindenhof, Rathaus, Werd, City. Dark labels suburbs only, and at this
    // map's zoom the quarter names are a second layer of noise over the old
    // town. Wrapped, so upstream's own exclusions still apply on top.
    'label_other': ['==', ['get', 'class'], 'suburb'],
    // Positron draws admin levels 3 through 6, dark only 4 — so the district
    // boundary was a light-only line, and this page already draws a boundary of
    // its own. Cantons in both, Bezirke in neither.
    'boundary_3': ['==', ['get', 'admin_level'], 4]
  },

  add: [
    // The other half of the park story above: positron's park layer reads the
    // `park` source-layer, so it needs the `landuse` one dark uses.
    { id: 'bp_landuse_park', from: 'park', before: 'park', sourceLayer: 'landuse',
      filter: ['all', ['match', ['geometry-type'], ['MultiPolygon', 'Polygon'], true, false],
               ['==', ['get', 'class'], 'park']] }
  ]
};

// Which style the overrides above are currently painted onto. Cleared whenever
// a new style is requested, so the next styledata repaints them.
var tunedStyle = null;

// styledata fires repeatedly — once when a style loads, and again for each
// property this very function sets. tunedStyle is what stops that from being a
// loop: the first pass claims the style, every re-entrant pass returns at the
// top.
function tuneBasemap(glMap, styleUrl) {
  if (!glMap || tunedStyle === styleUrl) return;
  // Ready means THE LAYERS EXIST — never isStyleLoaded(). That one is loaded in
  // a much wider sense: it also waits for every source cache and the sprite,
  // i.e. for tiles, and tiles arriving fire sourcedata, not styledata. So the
  // one styledata a page load delivers was always rejected, nothing ever fired
  // again, and none of the ladder was painted: the map shipped as upstream's
  // own rgb(12,12,12) ground under 1.10:1 streets and rgba(80,78,78) labels —
  // precisely the grey-on-grey the tuning exists to fix, and it looked like a
  // tuning problem rather than a guard that never opened. background is in both
  // styles; if it is missing the style has not parsed and a later styledata
  // retries.
  if (!glMap.getLayer || !glMap.getLayer('background')) return;
  tunedStyle = styleUrl;
  applyPlan(glMap, styleUrl.indexOf('/dark') !== -1 ? DARK_PLAN : LIGHT_PLAN);
}

// Every step skips a layer upstream has renamed or dropped rather than throwing
// on it: a cartography change on their side must not take the map down.
function applyPlan(glMap, plan) {
  function each(table, fn) {
    Object.keys(table || {}).forEach(function (id) {
      if (glMap.getLayer(id)) fn(id, table[id]);
    });
  }
  each(plan.paint, function (id, props) {
    Object.keys(props).forEach(function (prop) {
      try { glMap.setPaintProperty(id, prop, props[prop]); } catch (e) {}
    });
  });
  each(plan.filter, function (id, extra) {
    if (!glMap.setFilter || !glMap.getFilter) return;
    var had = glMap.getFilter(id);
    try { glMap.setFilter(id, had ? ['all', had, extra] : extra); } catch (e) {}
  });
  each(plan.zoom, function (id, range) {
    if (!glMap.setLayerZoomRange) return;
    try { glMap.setLayerZoomRange(id, range[0], range[1]); } catch (e) {}
  });
  (plan.add || []).forEach(function (spec) { cloneLayer(glMap, spec); });
  (plan.hide || []).forEach(function (id) {
    if (!glMap.getLayer(id) || !glMap.setLayoutProperty) return;
    try { glMap.setLayoutProperty(id, 'visibility', 'none'); } catch (e) {}
  });
}

// Adding a layer, rather than repainting one, is how a style gets content the
// other style has and it does not. It is cloned off a layer already in the
// style, so the source, the fonts and the text-field expression all come from
// upstream and there is nothing here to keep in step with them — only what the
// clone is FOR is spelled out, as a source-layer, a filter and a zoom range.
function cloneLayer(glMap, spec) {
  if (!glMap.addLayer || !glMap.getStyle || glMap.getLayer(spec.id)) return;
  var src = null, out;
  try {
    (glMap.getStyle().layers || []).forEach(function (l) { if (l.id === spec.from) src = l; });
  } catch (e) { return; }
  if (!src) return;
  try { out = JSON.parse(JSON.stringify(src)); } catch (e) { return; }
  out.id = spec.id;
  if (spec.sourceLayer) out['source-layer'] = spec.sourceLayer;
  if (spec.filter) out.filter = spec.filter;
  if (spec.minzoom === undefined) delete out.minzoom; else out.minzoom = spec.minzoom;
  if (spec.maxzoom === undefined) delete out.maxzoom; else out.maxzoom = spec.maxzoom;
  if (out.layout) delete out.layout.visibility;
  // A `before` upstream has renamed would throw the whole layer away, so the
  // fallback appends it rather than losing it.
  try { glMap.addLayer(out, spec.before); }
  catch (e) { try { glMap.addLayer(out); } catch (e2) {} }
}

function styleUrl(dark) {
  return 'https://tiles.openfreemap.org/styles/' + (dark ? 'dark' : 'positron');
}

// A dark nav over a Positron basemap was the whole reason this page spent a
// while pinned to light. The basemap turns with everything else instead.
//
// MapLibre swaps its style in place — the GL context, the current centre and
// zoom and the Leaflet layer all survive, so nothing below the basemap has to
// be rebuilt and the map does not blink. The raster fallback has no equivalent,
// so that branch removes the layer and adds the other one; markers and the
// outline live in different panes and are untouched either way.
function applyTheme() {
  var dark = themeIsDark();
  if (kreis) kreis.setStyle(kreisStyle());
  if (geo.ring) geo.ring.setStyle(ringStyle());
  if (!map || !basemap) return;
  var glMap = basemap.getMaplibreMap ? basemap.getMaplibreMap() : null;
  if (glMap && glMap.setStyle) {
    tunedStyle = null;                  // the incoming style has not been painted yet
    glMap.setStyle(styleUrl(dark));
    return;
  }
  map.removeLayer(basemap);
  basemap = null;
  addBasemap();
}

// chrome.js fires this on every theme paint, including its first — which lands
// before initMap() has run, hence the map guard inside applyTheme().
document.addEventListener('ch:theme', applyTheme);

function hasWebGL() {
  try {
    var c = document.createElement('canvas');
    return !!(c.getContext('webgl') || c.getContext('experimental-webgl'));
  } catch (e) {
    return false;                     // some privacy modes throw rather than return null
  }
}

// The district outline is context, not content: ink rather than the fountains'
// terracotta, dashed and half-transparent, so it reads as a reference line and
// never competes with a pin.
//
// interactive:false is load-bearing. A Leaflet path swallows the clicks that
// land on it, and the admin places fountains BY clicking the map — an
// interactive polygon would make the whole of Kreis 1 the one place a pin
// could not be dropped.
function kreisStyle() {
  // Ink, whichever ink that currently is: an SVG path takes its colour as an
  // attribute, so unlike everything in the stylesheet it cannot follow a token
  // on its own and has to be restyled when the theme flips.
  var ink = cssVar('--ink') || '#111110';
  // Dark wants MORE alpha, not less, and the two earlier values here were both
  // too low for the wrong reason: they were picked to sit at a rung of the
  // DARK_TUNE road ladder, but a partly transparent white over #22221F land
  // composites to a literal grey, and a grey dashed line on grey land reads as
  // an artefact rather than a boundary. .26 came out rgb(88,87,84) (2.21:1) and
  // .42 rgb(121,120,117) (3.61:1) — both mid-grey.
  //
  // .8 composites to rgb(199,198,195) at 9.33:1: white, which is what a
  // district boundary should look like. That IS louder than the fountains
  // (6.36) and the motorways (5.22), which the ladder otherwise forbids — the
  // trade is deliberate. Contrast ratio measures legibility, not visual weight,
  // and this is a 1.5px line dashed '5 4', so it covers a sliver of the area a
  // 13px filled disc does; the discs still win the page on area and on hue.
  // Turn this down before touching the ladder if it ever does compete.
  var dark = themeIsDark();
  return { color: ink, weight: 1.5, opacity: dark ? .8 : .5, dashArray: '5 4',
           fillColor: ink, fillOpacity: dark ? .025 : .035 };
}

function addKreis() {
  fetch(KREIS1_URL, { credentials: 'same-origin' })
    .then(function (r) { return r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)); })
    .then(function (geo) {
      kreis = L.geoJSON(geo, { interactive: false, style: kreisStyle() }).addTo(map);
    })
    .catch(function (e) {
      // The boundary is a nicety; a map without it still works, so this stays
      // quiet for visitors and only tells the admin something is wrong.
      console.warn('Kreis 1 outline failed to load:', e.message);
      if (isAdmin) toast('Kreis 1 outline failed to load');
    });
}

// TAP GESTURES
// Double tap to zoom in, two-finger tap to zoom out — the two gestures every
// map app on a phone has, and neither arrives for free. Leaflet dropped its own
// double-tap emulation in 1.8 on the assumption that the browser fires dblclick
// itself, but the map container carries touch-action:none (which is what makes
// dragging and pinching work at all), and under it a phone browser never
// synthesises one. So the page reads the gesture off the raw touch events.
//
// Only one handler may ever act on a double gesture: Leaflet's own dblclick
// zoom is right for a mouse and would double up with this one for a finger, so
// it steps aside for the duration of a touch and comes back on the next mouse
// press.
// One frame's worth of scheduling, shared by the two continuous zooms — the
// held-tap drag on a phone and the wheel on a desktop. Both coalesce to one
// apply per frame: every setZoomAround resyncs the MapLibre basemap under the
// page, and both wheel and touchmove fire far more often than the screen paints.
var raf = (typeof window !== 'undefined' && window.requestAnimationFrame)
  ? function (f) { return window.requestAnimationFrame(f); }
  : function (f) { return setTimeout(f, 16); };
var unraf = (typeof window !== 'undefined' && window.cancelAnimationFrame)
  ? function (h) { window.cancelAnimationFrame(h); }
  : function (h) { clearTimeout(h); };

// Desktop zoom is continuous, not a staircase. Leaflet's own wheel handler
// debounces the events and then steps by whole levels, which on a vector
// basemap throws away the one thing vector tiles are for: every fractional zoom
// is drawn from geometry at full sharpness, so there is nothing to snap to.
//
// A wheel event moves a TARGET zoom and a rAF loop eases the map towards it.
// The easing is what makes a mouse feel smooth and not merely fractional — a
// trackpad already sends a stream of small deltas, but a notch on a mouse
// arrives as ONE event, so the distance has to be travelled rather than
// assigned. WHEEL_EASE covers that fraction of whatever is left each frame,
// which lands a notch in about a fifth of a second and lets a second notch
// mid-flight simply extend the target.
//
// The raster fallback keeps Leaflet's stepped handler: it upscales anything
// between whole levels, so a smooth zoom there is a smoothly blurring picture.
function initWheelZoom() {
  var el = map.getContainer && map.getContainer();
  if (!el || !el.addEventListener) return;
  if (!(basemap && basemap.getMaplibreMap && basemap.getMaplibreMap())) return;
  if (map.scrollWheelZoom) map.scrollWheelZoom.disable();

  var wz = { on: false, target: 0, pt: null, snap: 1, raf: 0 };

  // deltaMode 1 is lines and 2 is pages; only mode 0 already speaks px. The cap
  // is per event: a mouse configured to scroll half a page per notch must not
  // cross four zoom levels in one flick.
  function wheelPx(e) {
    var d = e.deltaY;
    if (!d) return 0;
    if (e.deltaMode === 1) d *= 16;
    else if (e.deltaMode === 2) d *= (el.clientHeight || 600);
    return Math.max(-WHEEL_MAX_PX, Math.min(WHEEL_MAX_PX, d));
  }

  function clampZoom(z) {
    return Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), z));
  }

  function start() {
    wz.on = true;
    wz.target = map.getZoom();
    // Fractional zoom for the duration only, exactly as the held-tap drag does
    // it. Everything else — the zoom buttons, fitBounds — keeps landing on whole
    // levels, and with the grid handed back the next press of + re-aligns a
    // fractional zoom to it on its own.
    if (map.options) { wz.snap = map.options.zoomSnap; map.options.zoomSnap = 0; }
  }

  function step() {
    wz.raf = 0;
    if (!wz.on) return;
    var z = map.getZoom();
    var d = wz.target - z;
    // Close enough to be one screen pixel of scale: stop, or the loop runs
    // forever chasing a difference nothing can see.
    if (Math.abs(d) < WHEEL_DONE) { stop(); return; }
    map.setZoomAround(wz.pt, z + d * WHEEL_EASE, { animate: false });
    wz.raf = raf(step);
  }

  function stop() {
    if (!wz.on) return;
    wz.on = false;
    if (wz.raf) { unraf(wz.raf); wz.raf = 0; }
    // Land ON the target rather than a hair short of it — an eased loop only
    // ever approaches — then hand the whole-level grid back.
    if (wz.pt && Math.abs(map.getZoom() - wz.target) > 1e-4) {
      map.setZoomAround(wz.pt, wz.target, { animate: false });
    }
    if (map.options) map.options.zoomSnap = wz.snap;
  }

  el.addEventListener('wheel', function (e) {
    var px = wheelPx(e);
    // preventDefault before the early return as well: the page itself cannot
    // scroll, but a ctrl-wheel over the map would otherwise zoom the whole
    // document, which is never what someone pinching over a map means.
    if (e.preventDefault) e.preventDefault();
    if (!px) return;
    var r = el.getBoundingClientRect();
    // The anchor follows the pointer, so whatever is under it stays under it.
    wz.pt = L.point(e.clientX - r.left, e.clientY - r.top);
    if (!wz.on) start();
    // A trackpad pinch arrives as a wheel with ctrlKey set and much smaller
    // numbers, so it needs its own rate or it barely moves the map.
    wz.target = clampZoom(wz.target - px / (e.ctrlKey ? WHEEL_PINCH_PX : WHEEL_PX_PER_ZOOM));
    if (!wz.raf) wz.raf = raf(step);
  }, { passive: false });

  // A press on +/-, or the start of a pan, takes the map over: the ease must
  // let go rather than keep pulling towards a target nobody is asking for.
  el.addEventListener('mousedown', stop, true);
}

function initTapZoom() {
  var el = map.getContainer && map.getContainer();
  if (!el || !el.addEventListener) return;

  // Every contact is tracked by its own identifier rather than the page holding
  // "the finger currently down". A fast double tap does NOT arrive as two clean,
  // fully separated single-touch sequences: the first contact's touchend can be
  // delivered after the second contact's touchstart, so the page briefly sees
  // two touch points and a touchend that still reports a finger on the glass.
  // Keying off touches.length threw the second tap away in both cases.
  var live = {};      // identifier -> { t, x, y, ok }
  var alive = 0;
  var prevUp = 0;     // when the last qualifying tap lifted; 0 = none pending
  var prevX = 0, prevY = 0;
  var pair = null;    // a genuine two-finger gesture

  // The second tap of a double tap, while it is still down. Holding it and
  // dragging is what this gesture is really for: the finger moving DOWN zooms
  // in, UP zooms out, continuously, with the point tapped held under the finger.
  // Lifting it without dragging is the plain double tap and steps in by one.
  var dz = { on: false, id: null, y0: 0, y1: 0, z0: 0, pt: null,
             snap: 1, applied: false, raf: 0 };

  function arm(rec, id) {
    prevUp = 0;
    blockAdd();                    // neither a double tap nor a drag places a pin
    dz.on = true;
    dz.id = id;
    dz.y0 = dz.y1 = rec.y;
    dz.z0 = map.getZoom();
    dz.applied = false;
    var r = el.getBoundingClientRect();
    dz.pt = L.point(rec.x - r.left, rec.y - r.top);
    // Fractional zoom, but only for the duration of the drag. Everything else on
    // the page — the zoom buttons, pinch, the tile ladder — stays on whole
    // levels, and the gesture puts it back on one when the finger lifts.
    if (map.options) { dz.snap = map.options.zoomSnap; map.options.zoomSnap = 0; }
    // Leaflet's drag handler already holds this contact and would pan the map
    // out from under the zoom. Re-enabled the instant the gesture ends.
    if (map.dragging) map.dragging.disable();
    tapLog('arm');
  }

  function dragTo(y) {
    dz.y1 = y;
    // The drag only takes over once the finger has travelled DRAG_MIN, and the
    // baseline then moves to that point rather than counting from the tap —
    // otherwise the zoom jumps by DRAG_MIN's worth the moment it engages.
    if (!dz.applied) {
      if (Math.abs(dz.y1 - dz.y0) < DRAG_MIN) return;
      dz.applied = true;
      dz.y0 = dz.y1;
      dz.z0 = map.getZoom();
      return;
    }
    if (!dz.raf) dz.raf = raf(applyDrag);
  }

  // Coalesced to one apply per frame: every setZoomAround resyncs the MapLibre
  // basemap underneath, and touchmove fires far more often than the screen
  // repaints.
  function applyDrag() {
    dz.raf = 0;
    if (!dz.on || !dz.applied) return;
    // Finger DOWN zooms in, finger UP zooms out.
    var want = dz.z0 + (dz.y1 - dz.y0) / PX_PER_ZOOM;
    var z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), want));
    map.setZoomAround(dz.pt, z, { animate: false });
  }

  function disarm(stepIn) {
    if (!dz.on) return;
    dz.on = false;
    if (dz.raf) { unraf(dz.raf); dz.raf = 0; }
    if (map.options) map.options.zoomSnap = dz.snap;
    if (map.dragging) map.dragging.enable();
    touchZoomAt = Date.now();      // the dblclick fallback must not add a step
    if (dz.applied) {
      applyDrag();                 // whatever the last frame did not get to
      // Land on a whole zoom level: the raster fallback upscales anything else,
      // and the rest of the page assumes integer zooms.
      map.setZoomAround(dz.pt, Math.round(map.getZoom()));
      tapLog('drag end z' + map.getZoom());
    } else if (stepIn) {
      zoomAt(dz.pt, 1, true, true);
    }
  }

  el.addEventListener('mousedown', function () {
    if (map.doubleClickZoom) map.doubleClickZoom.enable();
  }, true);

  // A contact landing close behind the last one to lift is the second tap of a
  // double tap. It is armed here rather than judged on its own touchend,
  // because holding it is a gesture in its own right.
  function maybeArm(rec, id) {
    if (dz.on || pair || !prevUp) return false;
    if (rec.t - prevUp >= DBL_MS) return false;
    if (Math.abs(rec.x - prevX) > DBL_SLOP || Math.abs(rec.y - prevY) > DBL_SLOP) return false;
    arm(rec, id);
    return true;
  }

  el.addEventListener('touchstart', function (e) {
    if (map.doubleClickZoom) map.doubleClickZoom.disable();
    tapLog('start x' + e.touches.length);
    var i, t, rec;
    for (i = 0; i < e.changedTouches.length; i++) {
      t = e.changedTouches[i];
      if (!live[t.identifier]) alive++;
      rec = { t: Date.now(), x: t.clientX, y: t.clientY, ok: true, id: t.identifier };
      live[t.identifier] = rec;
      if (e.touches.length === 1) {
        tapLog('gap ' + (prevUp ? Math.max(0, rec.t - prevUp) : '-'));
        maybeArm(rec, t.identifier);
      }
    }
    // A second finger ends a drag-zoom — from there it is a pinch, which Leaflet
    // owns. Two points are two FINGERS only if they are apart: the phantom pair
    // a fast double tap produces is one thumb in one place.
    if (e.touches.length === 2) {
      disarm(false);
      var m = tapMid(e.touches[0], e.touches[1]);
      if (m.d > PAIR_MIN) { pair = m; prevUp = 0; }
    } else if (e.touches.length > 2) {
      disarm(false); pair = null; prevUp = 0;
    }
  }, { passive: true });

  el.addEventListener('touchmove', function (e) {
    var i, t, rec;
    for (i = 0; i < e.changedTouches.length; i++) {
      t = e.changedTouches[i];
      if (dz.on && t.identifier === dz.id) { dragTo(t.clientY); continue; }
      rec = live[t.identifier];
      if (rec && (Math.abs(t.clientX - rec.x) > TAP_SLOP ||
                  Math.abs(t.clientY - rec.y) > TAP_SLOP)) rec.ok = false;
    }
    if (pair && e.touches.length === 2) {
      var m = tapMid(e.touches[0], e.touches[1]);
      if (Math.abs(m.d - pair.d) > TAP_SLOP) pair = null;
    }
  }, { passive: true });

  el.addEventListener('touchend', function (e) {
    var now = Date.now();
    var i, t, rec, id;
    for (i = 0; i < e.changedTouches.length; i++) {
      t = e.changedTouches[i];
      rec = live[t.identifier];
      if (!rec) continue;
      delete live[t.identifier];
      alive--;

      // The armed contact: a drag has already done its zooming, a still finger
      // is the plain double tap. Held past TAP_MAX it is neither.
      if (dz.on && t.identifier === dz.id) {
        disarm(now - rec.t <= TAP_MAX);
        continue;
      }
      // A two-finger tap resolves when the last of its contacts leaves, so it
      // fires once however the two fingers happen to be lifted.
      if (pair) {
        if (alive > 0) continue;
        var pr = pair;
        pair = null; prevUp = 0;
        if (now - pr.t < DBL_MS) zoomAt(pr, -1, true);
        continue;
      }
      if (!rec.ok) { prevUp = 0; continue; }                   // it was a pan
      if (now - rec.t > TAP_MAX) { prevUp = 0; continue; }     // a long press

      // A plain first tap. Remember where and when it lifted; the next contact
      // landing near it inside DBL_MS arms the gesture at its own touchstart.
      prevUp = now; prevX = rec.x; prevY = rec.y;

      // That lift can arrive AFTER the second tap has already landed, in which
      // case the contact to arm is sitting in live right now.
      for (id in live) {
        if (maybeArm(live[id], live[id].id)) break;
      }
    }
  }, { passive: true });

  el.addEventListener('touchcancel', function () {
    disarm(false);
    live = {}; alive = 0; pair = null; prevUp = 0;
  }, { passive: true });

  // A second, independent route to the same zoom. Whether a phone browser
  // synthesises dblclick from a double tap is exactly the thing that cannot be
  // checked from here, so the page takes it if it comes rather than betting on
  // the touch path alone. Leaflet owns this event whenever its own handler is
  // enabled — the case for a mouse and never during a touch — and the guard
  // drops it if the touch path has just zoomed, so the two can't stack.
  el.addEventListener('dblclick', function (e) {
    if (map.doubleClickZoom && map.doubleClickZoom.enabled()) return;
    if (Date.now() - touchZoomAt < 800) return;
    tapLog('dblclick');
    zoomAt({ x: e.clientX, y: e.clientY }, e.shiftKey ? -1 : 1);
  });
}

// The gesture can only be tested on a real phone, so ?taplog=1 puts what the
// browser actually fired on the screen. Silent and unbuilt otherwise.
var tapLogBox = null;
function tapLog(msg) {
  if (!TAPLOG) return;
  if (!tapLogBox) {
    tapLogBox = document.createElement('div');
    tapLogBox.style.cssText = 'position:fixed;left:8px;bottom:120px;z-index:9999;max-width:60vw;' +
      'font:11px/1.4 monospace;background:rgba(17,17,16,.82);color:#fff;padding:6px 8px;' +
      'border-radius:6px;pointer-events:none;white-space:pre-wrap';
    document.body.appendChild(tapLogBox);
  }
  var lines = tapLogBox.textContent ? tapLogBox.textContent.split(String.fromCharCode(10)) : [];
  lines.push(msg);
  tapLogBox.textContent = lines.slice(-8).join(String.fromCharCode(10));
}

function tapMid(a, b) {
  return {
    t: Date.now(),
    x: (a.clientX + b.clientX) / 2,
    y: (a.clientY + b.clientY) / 2,
    d: Math.sqrt(Math.pow(a.clientX - b.clientX, 2) + Math.pow(a.clientY - b.clientY, 2))
  };
}

function tapFar(a, b, slop) {
  return Math.abs(a.x - b.x) > slop || Math.abs(a.y - b.y) > slop;
}

// Zoom around the point that was tapped rather than the centre of the map, so
// whatever you aimed at is still under your thumb afterwards. The step is
// clamped here rather than left to setZoomAround, which offsets the centre by
// an unclamped scale and so slides the map sideways at either zoom limit.
var touchZoomAt = 0;

function zoomAt(p, delta, byTouch, isContainerPt) {
  if (byTouch) touchZoomAt = Date.now();   // the dblclick path defers to this
  blockAdd();                          // a zoom gesture is not a request to place a pin
  var z = Math.max(map.getMinZoom(), Math.min(map.getMaxZoom(), map.getZoom() + delta));
  tapLog('zoom ' + map.getZoom() + ' -> ' + z);
  if (z === map.getZoom()) return;
  // Touch and mouse events carry viewport coordinates; the armed gesture has
  // already converted its anchor to a container point, so it says so.
  if (isContainerPt) return map.setZoomAround(p, z);
  var r = map.getContainer().getBoundingClientRect();
  map.setZoomAround(L.point(p.x - r.left, p.y - r.top), z);
}

// Placing a fountain and zooming both start with the same tap, so for the admin
// the Add dialog has to wait long enough to see whether a second one is coming.
// A third of a second before a modal opens goes unnoticed; an Add dialog on top
// of every zoom would not. The block window covers the *second* tap's click,
// which the browser delivers after the gesture has already been recognised.
var addTimer = null;
var addBlockUntil = 0;

function queueAdd(latlng) {
  if (Date.now() < addBlockUntil) return;
  cancelQueuedAdd();
  addTimer = setTimeout(function () { addTimer = null; addFountain(latlng); }, DBL_MS + 80);
}

function cancelQueuedAdd() {
  if (addTimer) { clearTimeout(addTimer); addTimer = null; }
}

function blockAdd() {
  addBlockUntil = Date.now() + 600;
  cancelQueuedAdd();
}

// GEOLOCATION
// The point of the whole feature: you are standing at the fountain, so the
// phone already knows the coordinate better than you could read it off a map.
// A crosshair rather than a word, on every screen. The button had three
// different labels for its three states, so it changed width under the thumb
// pressing it, and on a phone it was the widest thing in the corner for the one
// idea every map app draws as a single glyph. Drawn in currentColor throughout,
// so the .on state's inversion carries the glyph with it for free.
var LOC_SVG =
  '<svg class="loc-ico" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' +
    '<circle cx="12" cy="12" r="6.9" fill="none" stroke="currentColor" stroke-width="1.7"></circle>' +
    '<circle cx="12" cy="12" r="2.5" fill="currentColor"></circle>' +
    '<path d="M12 1.3V4.5M12 19.5V22.7M1.3 12H4.5M19.5 12H22.7" fill="none" ' +
      'stroke="currentColor" stroke-width="1.7" stroke-linecap="round"></path>' +
  '</svg>';

// With the label gone this is the only text the button carries, so it has to
// say the whole state: a desktop hover shows it, a screen reader reads it, and
// on a phone it is what the browser announces on focus.
var LOC_LABEL = {
  off:  'Show my position',
  busy: 'Looking for your position...',
  on:   'Following your position - tap to stop'
};

// One place sets class, title and aria-label together. Splitting them is how a
// button ends up looking like it is following you while still announcing
// "Locate me".
function setLocState(s) {
  var b = document.getElementById('loc-btn');
  if (!b) return;
  b.classList[s === 'busy' ? 'add' : 'remove']('busy');
  b.classList[s === 'on' ? 'add' : 'remove']('on');
  var t = LOC_LABEL[s] || LOC_LABEL.off;
  b.title = t;
  if (b.setAttribute) b.setAttribute('aria-label', t);
}

function initLocate() {
  if (!navigator.geolocation) return;     // no API, no button - nothing to offer
  var Ctl = L.Control.extend({
    options: { position: 'bottomleft' },
    onAdd: function () {
      var b = L.DomUtil.create('button', 'loc-btn');
      b.id = 'loc-btn';
      b.type = 'button';
      b.innerHTML = LOC_SVG;
      b.title = LOC_LABEL.off;
      if (b.setAttribute) b.setAttribute('aria-label', LOC_LABEL.off);
      // Without this the press also lands on the map underneath, which for the
      // admin opens the Add dialog every time the button is touched.
      L.DomEvent.disableClickPropagation(b);
      L.DomEvent.on(b, 'click', toggleLocate);
      return b;
    }
  });
  map.addControl(new Ctl());
  // Panning by hand means "stop chasing me": the dot keeps updating, the map
  // just stops recentring. Tapping the button again re-follows.
  map.on('dragstart', function () { geo.follow = false; });
}

// On a phone the header covers a real fraction of the map, so it gets out of
// the way the moment the map is actually used: the title and the tally stay,
// the sentence collapses. Bound to a real pointer on the map container rather
// than to Leaflet's movestart/zoomstart, because those also fire for the
// programmatic fitBounds on load — which would collapse the intro before
// anyone had the chance to read it.
function leanOnUse() {
  if (!window.matchMedia || !window.matchMedia('(max-width: 640px)').matches) return;
  var stack = document.getElementById('topstack');
  var el = map.getContainer && map.getContainer();
  if (!stack || !el || !el.addEventListener) return;
  var lean = function () { setLean(true); };
  el.addEventListener('pointerdown', lean, { once: true });
  el.addEventListener('touchstart', lean, { once: true, passive: true });
}

// Collapsing is a toggle, never a one-way door: the sentence going away the
// first time you touch the map is only reasonable if there is an obvious way to
// bring it back. The chevron is that way, and it is the only part of the
// floating header besides the admin bar that takes a tap — everywhere else the
// map still pans straight through the text.
function setLean(on) {
  var stack = document.getElementById('topstack');
  var btn = document.getElementById('lean-toggle');
  if (!stack) return;
  stack.classList[on ? 'add' : 'remove']('lean');
  if (btn) {
