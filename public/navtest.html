<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nav pin test v6 (portrait reflow)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { overflow-x: hidden; scroll-behavior: smooth; }
  body { overflow-x: hidden; font-family: sans-serif; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    padding: 1.4rem 2rem; background: rgba(200,50,50,0.85); color: #fff;
    display: flex; justify-content: space-between;
    opacity: 0; transition: opacity .5s ease;
  }
  nav.visible { opacity: 1; }
  .intro {
    position: relative; height: auto; overflow: visible;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .intro-bg { position: relative; overflow: visible; }
  .intro-bg img { width: 100%; height: auto; display: block; }
  .feed { padding: 4vw; }
  .block { height: 60vh; background: #eee; margin-bottom: 2vw; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <nav><span>LOGO v6-portrait</span><span>MENU</span></nav>
  <div class="intro" id="intro">
    <div class="intro-bg"><img id="hero-img" alt=""></div>
  </div>
  <div class="feed">
    <div class="block">block 1</div>
    <div class="block">block 2</div>
    <div class="block">block 3</div>
    <div class="block">block 4</div>
  </div>
  <script>
    const nav = document.querySelector('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('visible', window.scrollY > 40);
    }, { passive: true });
    gsap.registerPlugin(ScrollTrigger);
    setTimeout(() => {
      const img = document.getElementById('hero-img');
      img.onload = () => { if (window.ScrollTrigger) ScrollTrigger.refresh(); };
      img.src = 'https://picsum.photos/800/1200?random=1';
    }, 900);
  </script>
</body>
</html>
