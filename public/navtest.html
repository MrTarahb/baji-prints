<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nav pin test v4 (GSAP)</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html { overflow-x: hidden; scroll-behavior: smooth; }
  body { overflow-x: hidden; font-family: sans-serif; }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 500;
    padding: 1.4rem 2rem; background: rgba(200,50,50,0.85); color: #fff;
    display: flex; justify-content: space-between;
    opacity: 0; transition: opacity .5s ease;
  }
  nav.visible { opacity: 1; }
  .intro {
    position: relative; height: 100dvh;
    background: linear-gradient(135deg, #333, #888);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 2rem; overflow: hidden;
  }
  .feed { padding: 4vw; }
  .block { height: 60vh; background: #eee; margin-bottom: 2vw; display:flex; align-items:center; justify-content:center; }
</style>
</head>
<body>
  <nav><span>LOGO v4-GSAP</span><span>MENU</span></nav>
  <div class="intro" id="intro">HERO (scroll down)</div>
  <div class="feed">
    <div class="block">block 1</div>
    <div class="block">block 2</div>
    <div class="block">block 3</div>
    <div class="block">block 4</div>
  </div>
  <script>
    const nav = document.querySelector('nav');
    window.addEventListener('scroll', () => {
      nav.classList.toggle('visible', window.scrollY > 40);
    }, { passive: true });

    // Replicate the site's hero scrub animation exactly
    gsap.registerPlugin(ScrollTrigger);
    gsap.to('#intro', {
      scale: 0.96, opacity: 0, ease: 'none',
      scrollTrigger: { trigger: '#intro', start: 'bottom bottom', end: 'bottom top', scrub: 1 }
    });
  </script>
</body>
</html>
