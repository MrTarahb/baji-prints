<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Bildauswahl · Bharat Bhatia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400;1,500&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --fi:'Playfair Display',Georgia,serif;
  --fm:'DM Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --ink:#111110;
  --bg:#FAFAF8;
  --bg2:#F0EFEC;
  --line:#E2E0DA;
  --mute:#8A857C;
  --pink:#C8907A;
  --pink-d:#A87060;
  --yes:#5E7F65;
  --no:#A8564A;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--fm);font-weight:300;-webkit-font-smoothing:antialiased}
body{font-size:14px;line-height:1.65;overflow-x:clip}
img{max-width:100%;display:block}
button{font-family:var(--fm);font-size:13px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:2px;transition:border-color .18s,background .18s,color .18s}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font-family:var(--fm);font-size:13px;font-weight:300;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:2px;padding:9px 11px;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink)}
textarea{resize:vertical;min-height:76px;line-height:1.6}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}

/* ── LOGIN ─────────────────────────────────────────────────────────── */
#gate{min-height:100vh;display:none;align-items:center;justify-content:center;padding:24px}
#gate.on{display:flex}
.gate-card{width:100%;max-width:360px;text-align:center}
.gate-card h1{font-family:var(--fi);font-style:italic;font-weight:400;font-size:30px;line-height:1.2;margin:14px 0 6px}
.gate-card p{color:var(--mute);font-size:12.5px;margin-bottom:26px}
.gate-card form{display:flex;flex-direction:column;gap:10px}
.gate-card button{background:var(--ink);color:var(--bg);border-color:var(--ink);padding:11px}
.gate-card button:hover{background:var(--pink-d);border-color:var(--pink-d)}
#gate-err{color:var(--no);font-size:12px;min-height:18px;margin-top:4px}

/* ── HEADER ────────────────────────────────────────────────────────── */
#board{display:none}
#board.on{display:block}
header{padding:64px 0 46px;margin-bottom:12px;background:var(--bg)}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;flex-wrap:wrap}
header h1{font-family:var(--fi);font-style:italic;font-weight:400;font-size:46px;line-height:1.08;margin:14px 0 0;letter-spacing:-.01em}
/* Full width, and newlines typed into the "Welcome text" field are kept as
   paragraph breaks (pre-wrap, same as .note). */
.intro{margin-top:22px;color:#4A453E;font-size:14px;line-height:1.75;white-space:pre-wrap}
.intro:empty{display:none}

/* ── SERIES ────────────────────────────────────────────────────────── */
/* Chips are derived from the series actually present on the board — nothing
   here is a fixed list, so renaming a series in the upload dialog is enough. */
.series-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:26px}
.series-row:empty{display:none}
.chip{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mute);
  border-radius:14px;padding:5px 13px}
.chip:hover{border-color:var(--ink);color:var(--ink)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip.untagged{border-style:dashed}
.chip-note{align-self:center;font-size:11px;font-style:italic;color:var(--mute)}
/* A series you are holding back — on the board for you, absent from his page. */
.chip.held{opacity:.5;border-style:dashed}
.m-checks{display:flex;flex-direction:column;gap:9px;margin-top:2px}
.m-check{display:flex;align-items:center;gap:9px;font-size:13px;cursor:pointer}
.m-check input{width:auto;flex:none;margin:0;accent-color:var(--ink)}
/* Per-card series picker. Admin only, and the options are whatever series exist
   on the board right now, so there is no list to maintain anywhere. */
.serie-pick{display:none;width:auto;max-width:140px;font-size:10.5px;padding:2px 4px;
  border-radius:10px;color:var(--mute);flex:none}
.is-admin .serie-pick{display:inline-block}
.serie-pick.set{color:var(--ink);border-color:#CFCBC2}
/* The series a candidate belongs to, on the card and in the lightbox. */
.serie{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--mute);
  border:1px solid var(--line);border-radius:10px;padding:1px 7px;white-space:nowrap;flex:none}
/* A room or spot the filtered series has nothing for. Kept on the page instead
   of hidden, so the gaps in a series are visible rather than silently absent. */
.gap{color:var(--mute);font-size:12.5px;font-style:italic;margin:2px 0 0;
  border-left:2px dashed var(--line);padding:2px 0 2px 12px}

.tally{display:flex;gap:22px;flex-wrap:wrap;margin-top:30px;padding-top:20px;border-top:1px solid var(--line);font-size:11.5px;letter-spacing:.04em;color:var(--mute)}
.tally b{font-weight:500;color:var(--ink)}
.tally .t-yes b{color:var(--yes)}
.tally .t-no b{color:var(--no)}

/* ── ADMIN BAR ─────────────────────────────────────────────────────── */
#adminbar{display:none;background:var(--ink);color:var(--bg);font-size:12px;padding:10px 0}
#adminbar.on{display:block}
#adminbar .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
#adminbar button{background:transparent;color:var(--bg);border-color:#3A3733;padding:5px 10px;font-size:11.5px}
#adminbar button:hover{border-color:var(--bg)}
.badge{background:var(--pink);color:var(--ink);border-radius:10px;padding:1px 8px;font-size:11px;font-weight:500}

/* ── ROOMS & SPOTS ─────────────────────────────────────────────────── */
.room{margin-bottom:96px}
.room-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:8px}
.room-head h2{font-family:var(--fi);font-style:italic;font-weight:400;font-size:30px}
.room-count{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.spot{margin-bottom:62px}
/* A room with several spots reads as columns side by side, so the choices for
   one wall sit next to the choices for the next instead of scrolling past each
   other. auto-fit collapses to fewer columns as the viewport narrows; the
   min() keeps the track from ever exceeding the container, which would push a
   horizontal scrollbar onto the page. min-width:0 on the column is load-bearing
   — a grid item defaults to min-width:auto, and the .card min-width inside would
   otherwise widen the track and overflow. */
.spots.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(330px,100%),1fr));
  gap:58px 44px;align-items:start}
.spots.multi .spot{margin-bottom:0;min-width:0}
.spot-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.spot-head h3{font-size:12px;font-weight:500;letter-spacing:.13em;text-transform:uppercase}
.adm{display:none;gap:6px;align-items:center}
.is-admin .adm{display:inline-flex}
/* The uploaded filename, for tracing a board photo back to the original. Admin
   only — and the server never sends it to the client, so there is nothing here
   to reveal by defeating the CSS. */
.fname{display:none;font-size:10.5px;color:var(--mute);margin-top:7px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.is-admin .fname{display:block}
.fname:hover{color:var(--ink)}
.fname.full{white-space:normal;overflow:visible;text-overflow:clip}
.adm button{padding:4px 9px;font-size:11px;color:var(--mute)}
.adm button:hover{color:var(--ink)}
.adm .move{padding:4px 7px;line-height:1}

/* Justified gallery: each photo keeps its true proportions, and flex-grow
   proportional to the aspect ratio makes every photo in a row land on the same
   height. Nothing is ever cropped. The ::after spacer stops a short final row
   from stretching its photos to absurd widths. */
.grid{display:flex;flex-wrap:wrap;gap:22px}
.grid::after{content:'';flex-grow:9999999}
/* --ar (set inline per photo) caps every card by VIEWPORT HEIGHT, not a fixed
   px width. Without it a justified row of two, or a portrait on a narrow
   screen, resolves far taller than the screen — a portrait at 600px wide is
   900px tall. Capping width at ar × 68vh bounds the height at 68vh instead,
   whatever the aspect ratio or viewport. */
.card{position:relative;cursor:pointer;min-width:170px;transition:opacity .2s;
  max-width:calc(var(--ar) * 68vh)}
.card.declined{opacity:.42}
.card.declined:hover{opacity:.75}
/* padding-bottom (not aspect-ratio) holds the ratio — an aspect-ratio box with
   auto width gets stretched by flex in this project's target browsers. */
.card-img{position:relative;height:0;background:var(--bg2);overflow:hidden}
.card-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  -webkit-user-drag:none;user-select:none;transition:transform .5s cubic-bezier(.2,.6,.2,1)}
.card:hover .card-img img{transform:scale(1.02)}
/* Approved: a quiet rule beneath the photo rather than a loud border. */
.card.approved .card-img{box-shadow:inset 0 -3px 0 var(--yes)}
.card-foot{padding:9px 1px 0;display:flex;align-items:baseline;gap:9px;min-height:22px}
.mark{font-size:11px;letter-spacing:.05em;color:var(--mute);white-space:nowrap;flex:none}
.mark.approved{color:var(--yes)}
.mark.declined{color:var(--no)}
.card-note{font-size:11.5px;color:var(--mute);font-style:italic;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.card-new{width:6px;height:6px;border-radius:50%;background:var(--pink);flex:none;align-self:center}
.empty{color:var(--mute);font-size:12.5px;font-style:italic;padding:12px 0}

/* ── LIGHTBOX ──────────────────────────────────────────────────────── */
#lb{position:fixed;inset:0;background:rgba(17,17,16,.96);z-index:80;display:none;flex-direction:column}
#lb.on{display:flex}
.lb-top{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:16px 22px;color:var(--bg);flex:none}
.lb-top .eyebrow{color:#9C968C}
.lb-x{background:transparent;border-color:#3A3733;color:var(--bg)}
.lb-x:hover{border-color:var(--bg)}
.lb-body{flex:1;display:flex;align-items:center;justify-content:center;padding:0 22px;min-height:0;position:relative}
.lb-body img{max-width:100%;max-height:100%;object-fit:contain;-webkit-user-drag:none;user-select:none}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);background:transparent;border-color:#3A3733;color:var(--bg);padding:12px 15px;font-size:16px}
.lb-nav:hover{border-color:var(--bg)}
.lb-nav.prev{left:22px}
.lb-nav.next{right:22px}
.lb-foot{flex:none;background:var(--bg);border-top:1px solid var(--line);padding:16px 22px}
.lb-foot .inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.lb-choice{display:flex;gap:10px;flex-wrap:wrap}
.lb-choice button{flex:1;min-width:130px;padding:11px}
.lb-choice button.sel-yes{background:var(--yes);border-color:var(--yes);color:#fff}
.lb-choice button.sel-no{background:var(--no);border-color:var(--no);color:#fff}
.lb-save-row{display:flex;gap:10px;align-items:center}
.lb-save-row button{background:var(--ink);color:var(--bg);border-color:var(--ink);white-space:nowrap}
.lb-save-row button:hover{background:var(--pink-d);border-color:var(--pink-d)}
#lb-status{font-size:11.5px;color:var(--mute);min-height:16px}
.lb-adminview{font-size:12px;color:var(--mute)}
.lb-adminview b{color:var(--ink);font-weight:500}

/* ── MODAL (admin prompts) ─────────────────────────────────────────── */
#modal{position:fixed;inset:0;background:rgba(17,17,16,.5);z-index:90;display:none;align-items:center;justify-content:center;padding:22px}
#modal.on{display:flex}
.modal-card{background:var(--bg);border-radius:3px;padding:24px;width:100%;max-width:400px}
.modal-card h4{font-family:var(--fi);font-style:italic;font-weight:400;font-size:19px;margin-bottom:6px}
.modal-card p{font-size:12px;color:var(--mute);margin-bottom:14px}
.modal-row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.m-label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);margin:12px 0 5px}
.m-label:first-child{margin-top:0}
.modal-card{max-height:86vh;overflow-y:auto}

/* A note from Bharat — deliberately distinct from the client's own comment:
   terracotta rule on the left, so on a busy board it reads as "he wrote this". */
.note{border-left:2px solid var(--pink);padding:2px 0 2px 12px;margin:0 0 14px;color:#4A453E;font-size:12.5px;max-width:66ch;white-space:pre-wrap}
.note.room-note{margin:0 0 34px;font-size:13px}
.note.spot-note-block{margin:0 0 18px}
.note.photo-note{margin:0;font-size:12px}
.note-empty{color:var(--mute);font-style:italic}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:2px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:640px){
  .wrap{padding:0 16px}
  header{padding:34px 0 30px}
  header h1{font-size:32px}
  .room-head h2{font-size:24px}
  .room{margin-bottom:64px}
  .spot{margin-bottom:44px}
  .spots.multi{gap:44px}
  /* One photo per row on a phone — a justified row of two is too small to
     judge a photograph by, which is the whole point of the page. min-width
     must go to 0: min-width beats max-width in CSS, so leaving it at 100%
     would defeat the viewport-height cap and stretch portraits off-screen. */
  .grid{gap:26px;justify-content:center}
  .grid::after{display:none}
  .card{min-width:0;flex-basis:100% !important}
  .lb-nav{padding:9px 11px}
  .lb-nav.prev{left:8px}
  .lb-nav.next{right:8px}
  .lb-body{padding:0 8px}
  .lb-choice button{min-width:0}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <div class="eyebrow">Bharat Bhatia · Fotografie</div>
    <h1 id="gate-name">Bildauswahl</h1>
    <p>Dieser Bereich ist passwortgeschützt.</p>
    <form id="gate-form">
      <input type="password" id="gate-pw" placeholder="Passwort" autocomplete="current-password" required>
      <button type="submit">Anmelden</button>
    </form>
    <div id="gate-err"></div>
  </div>
</div>

<div id="board">
  <div id="adminbar">
    <div class="wrap">
      <span class="eyebrow" style="color:#9C968C">Admin view</span>
      <span id="ab-unseen"></span>
      <button onclick="addRoom()">+ Room</button>
      <button onclick="editHeader()">Header text</button>
      <button onclick="setPassword()">Set password</button>
      <button onclick="markSeen()">Mark all read</button>
      <button onclick="copyLink()">Copy link</button>
      <button id="ab-recover" onclick="recoverNames()">Recover filenames</button>
      <button id="ab-series" onclick="editSeriesVisibility()">Series</button>
    </div>
  </div>

  <header>
    <div class="wrap">
      <div class="head-row">
        <div>
          <div class="eyebrow" id="b-eyebrow"></div>
          <h1 id="b-name"></h1>
        </div>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="adm"><button onclick="editHeader()">Edit text</button></span>
          <button id="logout-btn" onclick="logout()">Abmelden</button>
        </div>
      </div>
      <div class="intro" id="b-intro"></div>
      <div class="series-row" id="b-series"></div>
      <div class="tally" id="b-tally"></div>
    </div>
  </header>

  <div class="wrap" id="rooms"></div>
  <div style="height:80px"></div>
</div>

<div id="lb">
  <div class="lb-top">
    <div>
      <div class="eyebrow" id="lb-where"></div>
      <div id="lb-count" style="font-size:12px;color:#9C968C"></div>
    </div>
    <button class="lb-x" onclick="closeLb()">Schliessen ✕</button>
  </div>
  <div class="lb-body">
    <button class="lb-nav prev" onclick="lbGo(-1)">‹</button>
    <img id="lb-img" alt="" draggable="false" oncontextmenu="return false">
    <button class="lb-nav next" onclick="lbGo(1)">›</button>
  </div>
  <div class="lb-foot">
    <div class="inner">
      <div id="lb-note"></div>
      <div class="lb-choice" id="lb-choice">
        <button id="lb-yes" onclick="react('approved')">✓ Gefällt mir</button>
        <button id="lb-no" onclick="react('declined')">✕ Eher nicht</button>
      </div>
      <textarea id="lb-comment" placeholder="Kommentar (optional) — z.B. „zu dunkel“, „lieber querformat“"></textarea>
      <div class="lb-save-row">
        <button onclick="saveComment()">Kommentar speichern</button>
        <span id="lb-status"></span>
      </div>
      <div class="lb-adminview" id="lb-adminview"></div>
    </div>
  </div>
</div>

<div id="modal">
  <div class="modal-card">
    <h4 id="m-title"></h4>
    <p id="m-desc"></p>
    <div id="m-fields"></div>
    <div class="modal-row">
      <button onclick="closeModal()">Cancel</button>
      <button id="m-ok" style="background:#111110;color:#FAFAF8;border-color:#111110">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── STATE ────────────────────────────────────────────────────────────────────
var SLUG = location.pathname.split('/').filter(Boolean)[1] || '';
var board = null;      // {client, rooms:[{spots:[{photos:[]}]}]}
var isAdmin = false;
var lb = { list: [], i: 0 };   // photos currently open in the lightbox
var DEFAULT_EYEBROW = 'Bharat Bhatia · Fotografie';

// Cloudinary transform builder — same contract as the main site's cld():
// width + f_auto + q_auto:good, DPR-aware and capped. Clients only ever get a
// derivative, never the original upload URL.
function cld(url, w) {
  if (!url || url.indexOf('/image/upload/') === -1 || url.indexOf('/upload/w_') !== -1) return url;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  var width = Math.min(Math.round(w * dpr), 2600);
  return url.replace('/image/upload/', '/image/upload/w_' + width + ',f_auto,q_auto:good/');
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function api(path, opts) {
  opts = opts || {};
  if (opts.body && !(opts.body instanceof FormData)) {
    opts.headers = { 'Content-Type': 'application/json' };
    opts.body = JSON.stringify(opts.body);
  }
  opts.credentials = 'same-origin';
  return fetch(path, opts).then(function (r) {
    return r.json().catch(function () { return {}; }).then(function (j) {
      if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
      return j;
    });
  });
}

var toastTimer;
function toast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2200);
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
// The server withholds the client's name until authenticated, so the gate stays
// anonymous — a guessed URL reveals nothing about whose board this is.
api('/api/client/' + SLUG + '/session').then(function (s) {
  if (s.client || s.admin) { loadBoard(); }
  else { document.getElementById('gate').classList.add('on'); }
}).catch(function () {
  document.getElementById('gate').classList.add('on');
});

document.getElementById('gate-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var err = document.getElementById('gate-err');
  err.textContent = '';
  api('/api/client/' + SLUG + '/login', { method: 'POST', body: { password: document.getElementById('gate-pw').value } })
    .then(function () { document.getElementById('gate').classList.remove('on'); loadBoard(); })
    .catch(function (e) { err.textContent = e.message; });
});

function logout() {
  api('/api/client/' + SLUG + '/logout', { method: 'POST' }).then(function () { location.reload(); });
}

function loadBoard() {
  return api('/api/client/' + SLUG + '/board').then(function (b) {
    board = b;
    isAdmin = b.isAdmin;
    document.body.classList.toggle('is-admin', isAdmin);
    document.getElementById('adminbar').classList.toggle('on', isAdmin);
    document.getElementById('logout-btn').style.display = isAdmin ? 'none' : '';
    document.getElementById('board').classList.add('on');
    document.getElementById('b-name').textContent = b.client.name;
    document.title = b.client.name + ' · Bildauswahl';
    document.getElementById('b-eyebrow').textContent = b.client.eyebrow || DEFAULT_EYEBROW;
    document.getElementById('b-intro').textContent = b.client.intro || '';
    render();
  }).catch(function (e) {
    document.getElementById('gate').classList.add('on');
    document.getElementById('gate-err').textContent = e.message;
  });
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function allPhotos() {
  var out = [];
  board.rooms.forEach(function (r) {
    r.spots.forEach(function (s) { s.photos.forEach(function (p) { out.push(p); }); });
  });
  return out;
}

// ── SERIES ───────────────────────────────────────────────────────────────────
// A series is a whole-space concept ("Serie A"), not a per-wall choice, so the
// tag lives on the photo and the rooms stay a single structure. Filtering to one
// series re-reads the very same board as that series alone.
//   null = everything · 'Serie A' = that one · '' = untagged (admin only)
var seriesFilter = null;
var chipVals = [null];
var seriesList = [];    // recomputed once per render, read by cardHtml/paintLb

function boardSeries() {
  var seen = {}, out = [];
  allPhotos().forEach(function (p) {
    if (p.series && !seen[p.series]) { seen[p.series] = true; out.push(p.series); }
  });
  // Alphabetical, not order of appearance — the latter would shuffle whenever a
  // room moves. localeCompare so umlauts sort where a German reader expects.
  return out.sort(function (a, b) { return a.localeCompare(b, 'de'); });
}

// The photos of one spot under the current filter.
function visible(photos) {
  if (seriesFilter === null) return photos;
  if (seriesFilter === '') return photos.filter(function (p) { return !p.series; });
  return photos.filter(function (p) { return p.series === seriesFilter; });
}

// Whether the series reach the client at all. You always see them — tagging and
// filtering is your working tool long before the proposal is ready to be
// presented as a set of series. Until you release them the server withholds the
// tag from the client's payload entirely, so this is not a CSS curtain.
function seriesShown() {
  return isAdmin || !!(board && board.client && board.client.series_visible);
}

function seriesChipsHtml(list) {
  chipVals = [null];                    // never leave a stale mapping behind
  if (!seriesShown()) return '';
  // One series (or none) is not a choice, so there is no filter to offer. Say so
  // to the admin, though — otherwise "show me one series" just looks broken when
  // the real answer is that nothing has been tagged yet.
  if (list.length < 2) {
    var untagged = allPhotos().filter(function (p) { return !p.series; }).length;
    if (!isAdmin || (!list.length && !untagged)) return '';
    return '<span class="chip-note">' + (list.length
      ? 'Only one series so far — tag photos with a second one and a filter appears here.'
      : 'No series yet — pick one under any photo to start. ' + untagged + ' untagged.') +
      '</span>';
  }
  // Series names are never interpolated into an attribute: chips address the
  // value by index, so a name containing a quote can't break out of the markup.
  chipVals = [null].concat(list);
  var html = '<button class="chip' + (seriesFilter === null ? ' on' : '') +
    '" onclick="setSeries(0)">Alle</button>';
  list.forEach(function (name, i) {
    // A held-back series is dashed and dimmed for you — it is on the board but
    // its photos are not in the client's payload at all.
    var held = isAdmin && !isReleased(name);
    html += '<button class="chip' + (seriesFilter === name ? ' on' : '') + (held ? ' held' : '') +
      '"' + (held ? ' title="Held back — the client cannot see these photos"' : '') +
      ' onclick="setSeries(' + (i + 1) + ')">' + esc(name) + '</button>';
  });
  // Admin-only, and English like the rest of the admin surface: a way to find
  // candidates that never got a tag. The client just sees them under "Alle".
  if (isAdmin && allPhotos().some(function (p) { return !p.series; })) {
    chipVals.push('');
    var heldU = !isReleased('');
    html += '<button class="chip untagged' + (seriesFilter === '' ? ' on' : '') +
      (heldU ? ' held' : '') + '"' +
      (heldU ? ' title="Held back — the client cannot see these photos"' : '') +
      ' onclick="setSeries(' + (chipVals.length - 1) + ')">Untagged</button>';
  }
  // Said right where the chips are, not only up in the admin bar: this row is
  // the thing that looks like it is on the client's page but isn't.
  if (isAdmin && !board.client.series_visible) {
    html += '<span class="chip-note">Names hidden — he sees the photos, not the series</span>';
  }
  return html;
}

function setSeries(i) {
  // Never let an index that no longer maps to a chip through: `undefined` would
  // match no photo at all and blank the whole board rather than showing "Alle".
  seriesFilter = (i >= 0 && i < chipVals.length) ? chipVals[i] : null;
  render();
  document.getElementById('rooms').scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function render() {
  var series = seriesList = boardSeries();
  // A filter can outlive its series — the last photo tagged with it gets deleted
  // or retagged. Falling back to "Alle" beats showing a board that is all gaps.
  if (seriesFilter && series.indexOf(seriesFilter) < 0) seriesFilter = null;
  if (seriesFilter === '' && !isAdmin) seriesFilter = null;
  document.getElementById('b-series').innerHTML = seriesChipsHtml(series);

  // The tally counts what is on screen: filtered to a series, it reads as that
  // series' own score.
  var photos = visible(allPhotos());
  var yes = photos.filter(function (p) { return p.status === 'approved'; }).length;
  var no = photos.filter(function (p) { return p.status === 'declined'; }).length;
  var open = photos.length - yes - no;
  document.getElementById('b-tally').innerHTML = photos.length
    ? '<span><b>' + photos.length + '</b> Fotos</span>' +
      '<span class="t-yes"><b>' + yes + '</b> zugesagt</span>' +
      '<span class="t-no"><b>' + no + '</b> abgelehnt</span>' +
      '<span><b>' + open + '</b> offen</span>'
    : '';

  syncRecoverBtn();
  syncSeriesBtn();

  // Deliberately unfiltered: this is "anything new anywhere", not "new in the
  // series you happen to be looking at".
  var unseen = allPhotos().filter(function (p) { return p.reacted_at && !p.seen_by_admin; }).length;
  document.getElementById('ab-unseen').innerHTML = unseen
    ? '<span class="badge">' + unseen + ' new response' + (unseen === 1 ? '' : 's') + '</span>' : '';

  // Empty states differ by audience: the admin gets an instruction in English,
  // the client gets a reassurance in German.
  var html = board.rooms.map(roomHtml).join('');
  if (!board.rooms.length) {
    html = '<div class="empty">' + (isAdmin
      ? 'No rooms yet — click “+ Room” above.'
      : 'Die Auswahl wird gerade vorbereitet.') + '</div>';
  }
  document.getElementById('rooms').innerHTML = html;
}

// A room needs spots only when it has more than one place for a picture. Where
// there is just one obvious place, photos hang straight off the room: they live
// in a single spot with a blank name, which renders with no header at all.
function soloSpot(r) {
  return (r.spots.length === 1 && !r.spots[0].name) ? r.spots[0] : null;
}

// The German line shown where the filtered series has nothing to offer. The
// room stays on the page — a series that skips a wall is information, and
// hiding the room would quietly hide the hole in the proposal.
function gapHtml(scope) {
  return '<div class="gap">' + (scope === 'room'
    ? 'In dieser Serie ist für diesen Raum kein Bild vorgesehen.'
    : 'In dieser Serie kein Vorschlag für diesen Platz.') + '</div>';
}

function roomHtml(r, i) {
  var n = r.spots.reduce(function (t, s) { return t + visible(s.photos).length; }, 0);
  var solo = soloSpot(r);
  // A room the current series skips entirely: one line, not the same line
  // repeated under every spot.
  var roomGap = seriesFilter !== null && n === 0 &&
    r.spots.some(function (s) { return s.photos.length; });
  // "+ Photos" on the room itself is offered while the room still has no spots
  // of its own — once it is split into named spots, photos belong to a spot.
  var direct = !r.spots.length || !!solo;
  return '<section class="room" data-room="' + r.id + '">' +
    '<div class="room-head">' +
      '<h2>' + esc(r.name) + '</h2>' +
      (n ? '<span class="room-count">' + n + (n === 1 ? ' Foto' : ' Fotos') + '</span>' : '') +
      '<span class="adm">' +
        // Arrows rather than drag-and-drop: this gets used on a phone, where a
        // long-press drag fights the page scroll.
        '<button class="move" title="Move up"' + (i === 0 ? ' disabled' : '') +
          ' onclick="moveRoom(' + r.id + ',-1)">↑</button>' +
        '<button class="move" title="Move down"' + (i === board.rooms.length - 1 ? ' disabled' : '') +
          ' onclick="moveRoom(' + r.id + ',1)">↓</button>' +
        '<button onclick="renameRoom(' + r.id + ')">edit</button>' +
        (direct ? '<button onclick="uploadToRoom(' + r.id + ')">+ Photos</button>' : '') +
        '<button onclick="addSpot(' + r.id + ')">+ Spot</button>' +
        '<button onclick="delRoom(' + r.id + ')">delete</button>' +
      '</span>' +
    '</div>' +
    noteHtml(r.note, 'room-note') +
    (roomGap ? gapHtml('room') : r.spots.length
      ? '<div class="spots' + (r.spots.length > 1 ? ' multi' : '') + '">' +
          r.spots.map(spotHtml).join('') + '</div>'
      : '<div class="empty">' + (isAdmin
          ? '“+ Photos” to use this room as one place, or “+ Spot” to split it into several.'
          : '') + '</div>') +
    '</section>';
}

// Reorder is optimistic: the array is rearranged and repainted immediately, and
// only reverts (by reloading) if the save fails — otherwise every click would
// wait on a round trip before the room visibly moved.
function moveRoom(id, d) {
  var i = board.rooms.map(function (r) { return r.id; }).indexOf(id);
  var j = i + d;
  if (i < 0 || j < 0 || j >= board.rooms.length) return;
  board.rooms.splice(j, 0, board.rooms.splice(i, 1)[0]);
  render();
  var moved = document.querySelector('[data-room="' + id + '"]');
  if (moved) moved.scrollIntoView({ block: 'nearest' });
  api('/api/admin/client-rooms/reorder', {
    method: 'PUT',
    body: { ids: board.rooms.map(function (r) { return r.id; }) },
  }).catch(function (e) { toast('Order not saved: ' + e.message); loadBoard(); });
}

function spotHtml(s) {
  // An unnamed spot shows the client no header — its photos read as the room's
  // own. You still get the controls strip, so it can be named later or removed.
  var head = (s.name || isAdmin)
    ? '<div class="spot-head">' +
        (s.name ? '<h3>' + esc(s.name) + '</h3>' : '') +
        '<span class="adm">' +
          '<button onclick="uploadTo(' + s.id + ')">+ Photos</button>' +
          '<button onclick="renameSpot(' + s.id + ')">' + (s.name ? 'edit' : 'name this spot') + '</button>' +
          '<button onclick="delSpot(' + s.id + ')">delete</button>' +
        '</span>' +
      '</div>'
    : '';
  // Under a series filter an otherwise-stocked spot that this series skips gets
  // the gap line rather than "Fotos folgen", which would read as a promise.
  var shown = visible(s.photos);
  var empty = (seriesFilter !== null && s.photos.length)
    ? gapHtml('spot')
    : '<div class="empty">' + (isAdmin ? 'No photos yet.' : 'Fotos folgen.') + '</div>';
  return '<div class="spot">' +
    head +
    noteHtml(s.note, 'spot-note-block') +
    (shown.length
      ? '<div class="grid">' + shown.map(function (p) { return cardHtml(p, s); }).join('') + '</div>'
      : empty) +
    '</div>';
}

// Your comment, at any level. Rendered only when there is one — an empty note
// leaves no trace on the client's view.
function noteHtml(text, cls) {
  if (!text) return '';
  return '<div class="note ' + cls + '">' + esc(text) + '</div>';
}

// What this photo is called on disk, so a card on the board can be traced back
// to the original file. Only ever the real filename — a Cloudinary id is a hash
// and tells you nothing, so a photo with no recorded name shows nothing at all.
// Admin-only: the client's payload carries no such field.
function fileName(p) {
  return p.original_name || '';
}

function fnameHtml(p, cls) {
  var n = isAdmin ? fileName(p) : '';
  if (!n) return '';
  return '<div class="fname' + (cls ? ' ' + cls : '') + '" data-name="' + esc(n) + '"' +
    ' title="' + esc(n) + ' — click to copy" onclick="copyName(event,this)">' + esc(n) + '</div>';
}

// Tagging a photo is one tap from the grid — no lightbox, no typing. The options
// are whatever series exist on the board, so the list maintains itself.
function seriePickHtml(p) {
  if (!isAdmin) return '';
  var opts = seriesOptions(p.series).map(function (o) {
    return '<option value="' + esc(o.value) + '"' +
      (o.value === (p.series || '') ? ' selected' : '') + '>' + esc(o.label) + '</option>';
  }).join('');
  return '<select class="serie-pick' + (p.series ? ' set' : '') + '"' +
    ' onclick="event.stopPropagation()" onchange="pickPhotoSeries(event,' + p.id + ')"' +
    ' title="Series — only you can see this control">' + opts + '</select>';
}

function pickPhotoSeries(e, id) {
  e.stopPropagation();
  var v = e.target.value;
  if (v !== NEW_OPT) return savePhotoSeries(id, v);
  ask('New series', 'The client sees this label once the series are released — write it in German.', [
    { key: 'series', label: 'Series name', value: '' },
  ], function (out) {
    // Cancelling leaves the <select> showing the option that was never saved,
    // so repaint either way to put it back where it was.
    if (out.series) savePhotoSeries(id, out.series); else render();
  });
}

function savePhotoSeries(id, name) {
  var p = allPhotos().filter(function (x) { return x.id === id; })[0];
  if (!p) return;
  var prev = p.series;
  p.series = name || null;     // optimistic, so the grid re-tags without a round trip
  render();
  api('/api/admin/client-photos/' + id, { method: 'PUT', body: { series: name } })
    .then(function (saved) { p.series = saved.series; toast(name ? 'Tagged “' + name + '”' : 'Series cleared'); })
    .catch(function (e) { p.series = prev; render(); toast(e.message); });
}

// The whole card opens the lightbox, so a click on the filename must not bubble.
function copyName(e, el) {
  e.stopPropagation();
  var n = el.getAttribute('data-name') || '';
  if (navigator.clipboard) navigator.clipboard.writeText(n).then(function () { toast('Copied ' + n); });
  else toast(n);
}

// Target row height in px. flex-basis is aspect * this, so a row of photos
// resolves to roughly this height whatever mix of portrait and landscape it holds.
var ROW_H = 300;

function cardHtml(p, s) {
  // Dimensions are stored at upload; anything older falls back to 3:2 and gets
  // corrected by adjustRatio() the moment the image loads.
  var known = p.width > 0 && p.height > 0;
  var ar = known ? (p.width / p.height) : 1.5;
  var mark = p.status === 'approved' ? '✓ zugesagt'
           : p.status === 'declined' ? '✕ abgelehnt' : '';

  return '<figure class="card ' + esc(p.status) + '"' +
      ' style="--ar:' + ar.toFixed(4) + ';flex-grow:' + ar.toFixed(4) +
        ';flex-basis:' + Math.round(ar * ROW_H) + 'px"' +
      ' onclick="openLb(' + s.id + ',' + p.id + ')">' +
    '<div class="card-img" style="padding-bottom:' + (100 / ar).toFixed(3) + '%">' +
      '<img src="' + esc(cld(p.image_url, 720)) + '" alt="" loading="lazy" draggable="false"' +
        ' oncontextmenu="return false"' + (known ? '' : ' onload="adjustRatio(this)"') + '>' +
    '</div>' +
    (p.note ? '<div class="note photo-note" style="margin:11px 0 0">' + esc(p.note) + '</div>' : '') +
    '<figcaption class="card-foot">' +
      // Admin gets the live picker in place of the label — same information,
      // one tap to change. The client gets the label, and only when there is
      // something to tell it apart from.
      (isAdmin ? seriePickHtml(p)
        : (p.series && seriesFilter === null && seriesList.length > 1 && seriesShown()
          ? '<span class="serie">' + esc(p.series) + '</span>' : '')) +
      (mark ? '<span class="mark ' + esc(p.status) + '">' + mark + '</span>' : '') +
      (p.client_comment ? '<span class="card-note" title="' + esc(p.client_comment) + '">„' + esc(p.client_comment) + '“</span>' : '') +
      (isAdmin && p.reacted_at && !p.seen_by_admin ? '<span class="card-new" title="new response"></span>' : '') +
    '</figcaption>' +
    fnameHtml(p) +
  '</figure>';
}

// Legacy photos uploaded before dimensions were recorded: read the real ratio
// off the loaded image and correct that card in place.
function adjustRatio(img) {
  if (!img.naturalWidth || !img.naturalHeight) return;
  var ar = img.naturalWidth / img.naturalHeight;
  var card = img.closest('.card');
  if (!card) return;
  card.style.setProperty('--ar', ar.toFixed(4));
  card.style.flexGrow = ar.toFixed(4);
  card.style.flexBasis = Math.round(ar * ROW_H) + 'px';
  img.parentNode.style.paddingBottom = (100 / ar).toFixed(3) + '%';
}

// ── LIGHTBOX ─────────────────────────────────────────────────────────────────
function findSpot(spotId) {
  for (var i = 0; i < board.rooms.length; i++) {
    for (var j = 0; j < board.rooms[i].spots.length; j++) {
      if (board.rooms[i].spots[j].id === spotId) {
        return { room: board.rooms[i], spot: board.rooms[i].spots[j] };
      }
    }
  }
  return null;
}

// Navigation stays within one spot — the client is comparing candidates for a
// single wall, so wrapping into the next room's photos would be disorienting.
function openLb(spotId, photoId) {
  var f = findSpot(spotId);
  if (!f) return;
  // Only what the grid is showing: with a series filtered on, arrowing into a
  // candidate from another series would quietly leave that series.
  lb.list = visible(f.spot.photos);
  lb.i = Math.max(0, lb.list.map(function (p) { return p.id; }).indexOf(photoId));
  lb.where = f.spot.name ? f.room.name + ' · ' + f.spot.name : f.room.name;
  document.getElementById('lb').classList.add('on');
  document.body.style.overflow = 'hidden';
  paintLb();
}

function closeLb() {
  document.getElementById('lb').classList.remove('on');
  document.body.style.overflow = '';
}

function lbGo(d) {
  lb.i = (lb.i + d + lb.list.length) % lb.list.length;
  paintLb();
}

function paintLb() {
  var p = lb.list[lb.i];
  if (!p) return;
  document.getElementById('lb-img').src = cld(p.image_url, 1400);
  document.getElementById('lb-where').textContent = lb.where;
  document.getElementById('lb-count').textContent =
    (p.series && seriesList.length > 1 && seriesShown() ? p.series + ' · ' : '') +
    'Foto ' + (lb.i + 1) + ' von ' + lb.list.length;
  document.getElementById('lb-comment').value = p.client_comment || '';
  document.getElementById('lb-status').textContent = '';
  document.getElementById('lb-yes').className = p.status === 'approved' ? 'sel-yes' : '';
  document.getElementById('lb-no').className = p.status === 'declined' ? 'sel-no' : '';
  var nav = lb.list.length > 1 ? '' : 'none';
  document.querySelector('.lb-nav.prev').style.display = nav;
  document.querySelector('.lb-nav.next').style.display = nav;

  document.getElementById('lb-note').innerHTML = p.note
    ? '<div class="note photo-note" style="margin-bottom:2px">' + esc(p.note) + '</div>'
    : '';

  // Admin sees the reaction as read-only context; the buttons stay live so a
  // reaction can be cleared or corrected on the phone with the client present.
  var av = document.getElementById('lb-adminview');
  if (isAdmin) {
    var btns = ' · <button onclick="editPhoto(' + p.id + ')" style="padding:2px 8px;font-size:11px">Edit</button>' +
               ' <button onclick="delPhoto(' + p.id + ')" style="padding:2px 8px;font-size:11px">Delete photo</button>';
    av.innerHTML = fnameHtml(p, 'full') + (p.reacted_at
      ? 'Responded ' + new Date(p.reacted_at).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) +
        ': <b>' + (p.status === 'approved' ? 'approved' : p.status === 'declined' ? 'declined' : 'cleared') + '</b>' +
        (p.client_comment ? ' — “' + esc(p.client_comment) + '”' : '')
      : 'No response yet.') + btns;
  } else {
    av.innerHTML = '';
  }
}

document.addEventListener('keydown', function (e) {
  if (!document.getElementById('lb').classList.contains('on')) return;
  if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') lbGo(-1);
  if (e.key === 'ArrowRight') lbGo(1);
});

// ── REACTIONS ────────────────────────────────────────────────────────────────
function sendReaction(p, status, comment) {
  document.getElementById('lb-status').textContent = 'Speichern…';
  return api('/api/client/photo/' + p.id + '/react', { method: 'PUT', body: { status: status, comment: comment } })
    .then(function (saved) {
      // Mutate the in-memory photo so the grid behind the lightbox updates
      // without refetching the whole board on every click.
      p.status = saved.status;
      p.client_comment = saved.client_comment;
      p.reacted_at = saved.reacted_at;
      p.seen_by_admin = saved.seen_by_admin;
      document.getElementById('lb-status').textContent = 'Gespeichert';
      paintLb(); render();
    })
    .catch(function (e) { document.getElementById('lb-status').textContent = 'Fehler: ' + e.message; });
}

// Clicking the active choice again clears it back to "offen".
function react(status) {
  var p = lb.list[lb.i];
  if (!p) return;
  var next = p.status === status ? 'pending' : status;
  sendReaction(p, next, document.getElementById('lb-comment').value);
}

function saveComment() {
  var p = lb.list[lb.i];
  if (!p) return;
  sendReaction(p, p.status, document.getElementById('lb-comment').value);
}

// ── ADMIN ────────────────────────────────────────────────────────────────────
// One reusable prompt — window.prompt is blocked in some mobile browsers and
// looks nothing like the rest of the page. Fields are
// [{key, label, value, multiline, rows, options}]; the callback gets an object
// keyed by `key`. A field with `options` renders a <select> instead of a text
// box, plus a "new value" input that appears only when NEW_OPT is chosen — the
// pattern for anything picked from a list the board itself defines.
var NEW_OPT = '__new__';   // can't collide with a real series name

function ask(title, desc, fields, cb) {
  document.getElementById('m-title').textContent = title;
  document.getElementById('m-desc').textContent = desc || '';
  var box = document.getElementById('m-fields');
  box.innerHTML = fields.map(function (f, i) {
    var label = '<label class="m-label" for="mf-' + i + '">' + esc(f.label) + '</label>';
    if (f.checks) {
      return (f.label ? label : '') + '<div class="m-checks">' + f.checks.map(function (c, j) {
        return '<label class="m-check"><input type="checkbox" id="mf-' + i + '-c' + j + '"' +
          (c.checked ? ' checked' : '') + '><span>' + esc(c.label) + '</span></label>';
      }).join('') + '</div>';
    }
    if (f.options) {
      return label +
        '<select id="mf-' + i + '" onchange="askChoiceChanged(' + i + ')">' +
          f.options.map(function (o) {
            return '<option value="' + esc(o.value) + '">' + esc(o.label) + '</option>';
          }).join('') +
        '</select>' +
        '<input type="text" id="mf-' + i + '-new" style="display:none;margin-top:7px"' +
          ' placeholder="' + esc(f.newLabel || 'New name') + '">';
    }
    return label + (f.multiline
      ? '<textarea id="mf-' + i + '"' + (f.rows ? ' rows="' + (f.rows | 0) + '"' : '') + '></textarea>'
      : '<input type="text" id="mf-' + i + '">');
  }).join('');
  // Values are assigned as properties, never interpolated into the markup, so
  // quotes and angle brackets in existing text can't break out of the field.
  fields.forEach(function (f, i) {
    if (f.checks) return;              // checkboxes carry their own state
    var el = document.getElementById('mf-' + i);
    el.value = f.value || '';
    // A stored value that is no longer one of the options (its series was
    // renamed away) would silently select the first entry — offer it explicitly.
    if (f.options && el.value !== (f.value || '')) el.value = '';
  });

  document.getElementById('modal').classList.add('on');
  var first = document.getElementById('mf-0');
  if (first) first.focus();

  var ok = document.getElementById('m-ok');
  var fresh = ok.cloneNode(true);      // drop any previous handler
  ok.parentNode.replaceChild(fresh, ok);
  fresh.onclick = function () {
    var out = {};
    fields.forEach(function (f, i) {
      // A checks field answers with the array of ticked values, not a string.
      if (f.checks) {
        out[f.key] = f.checks.filter(function (c, j) {
          return document.getElementById('mf-' + i + '-c' + j).checked;
        }).map(function (c) { return c.value; });
        return;
      }
      var el = document.getElementById('mf-' + i);
      var v = el.value;
      if (f.options && v === NEW_OPT) v = document.getElementById('mf-' + i + '-new').value;
      out[f.key] = v.trim();
    });
    closeModal();
    cb(out);
  };
  // Enter submits from single-line inputs only — textareas need real newlines.
  box.querySelectorAll('input').forEach(function (el) {
    el.onkeydown = function (e) { if (e.key === 'Enter') { e.preventDefault(); fresh.click(); } };
  });
}
// The "new name" box only exists while the new-value option is selected.
function askChoiceChanged(i) {
  var sel = document.getElementById('mf-' + i);
  var box = document.getElementById('mf-' + i + '-new');
  if (!box) return;
  box.style.display = sel.value === NEW_OPT ? '' : 'none';
  if (sel.value === NEW_OPT) box.focus();
}

function closeModal() { document.getElementById('modal').classList.remove('on'); }

// The options for any "which series?" picker: whatever exists on the board right
// now, plus none and a way to add one. Built in one place so the upload dialog,
// the photo dialog and the per-card picker can never drift apart.
function seriesOptions(current) {
  var opts = [{ value: '', label: '— no series —' }];
  seriesList.forEach(function (name) { opts.push({ value: name, label: name }); });
  if (current && seriesList.indexOf(current) < 0) opts.push({ value: current, label: current });
  opts.push({ value: NEW_OPT, label: '+ New series…' });
  return opts;
}

// NOTE: dialog labels are English (you), but the VALUES you type are shown to
// the client — write those in German.
function editHeader() {
  ask('Edit header', 'The text at the very top of the page — shown to the client.', [
    { key: 'eyebrow', label: 'Small line on top', value: board.client.eyebrow || DEFAULT_EYEBROW },
    { key: 'name', label: 'Heading', value: board.client.name },
    { key: 'intro', label: 'Welcome text — line breaks become paragraphs', value: board.client.intro || '', multiline: true, rows: 8 },
  ], function (v) {
    if (!v.name) return toast('Heading cannot be empty');
    api('/api/admin/clients/' + SLUG, { method: 'PUT', body: v })
      .then(loadBoard).then(function () { toast('Saved'); }).catch(function (e) { toast(e.message); });
  });
}

function addRoom() {
  ask('Add room', 'e.g. Empfang, Behandlungsraum 1, Korridor', [
    { key: 'name', label: 'Room name', value: '' },
    { key: 'note', label: 'Your comment (optional, shown to the client)', value: '', multiline: true },
  ], function (v) {
    if (!v.name) return;
    api('/api/admin/clients/' + SLUG + '/rooms', { method: 'POST', body: v })
      .then(loadBoard).then(function () { toast('Room added'); }).catch(function (e) { toast(e.message); });
  });
}

function renameRoom(id) {
  var r = board.rooms.filter(function (x) { return x.id === id; })[0];
  if (!r) return;
  ask('Edit room', '', [
    { key: 'name', label: 'Room name', value: r.name },
    { key: 'note', label: 'Your comment (shown to the client)', value: r.note || '', multiline: true },
  ], function (v) {
    if (!v.name) return;
    api('/api/admin/client-rooms/' + id, { method: 'PUT', body: v })
      .then(loadBoard).catch(function (e) { toast(e.message); });
  });
}

function delRoom(id) {
  if (!confirm('Delete this room with all its spots and photos?')) return;
  api('/api/admin/client-rooms/' + id, { method: 'DELETE' })
    .then(loadBoard).then(function () { toast('Room deleted'); }).catch(function (e) { toast(e.message); });
}

function addSpot(roomId) {
  ask('Add spot', 'Only for a room with more than one place — e.g. Wand hinter Tresen, Fensterseite.', [
    { key: 'name', label: 'Spot name', value: '' },
    { key: 'note', label: 'Your comment (optional, shown to the client)', value: '', multiline: true },
  ], function (v) {
    if (!v.name) return;
    api('/api/admin/client-rooms/' + roomId + '/spots', { method: 'POST', body: v })
      .then(loadBoard).then(function () { toast('Spot added'); }).catch(function (e) { toast(e.message); });
  });
}

// Blanking the name is allowed and meaningful — the spot then has no heading
// and its photos read as the room's own.
function renameSpot(id) {
  var cur = findSpot(id);
  if (!cur) return;
  ask('Edit spot', 'Leave the name empty to drop the heading — the photos then sit directly under the room.', [
    { key: 'name', label: 'Spot name (optional)', value: cur.spot.name },
    { key: 'note', label: 'Your comment (shown to the client)', value: cur.spot.note || '', multiline: true },
  ], function (v) {
    api('/api/admin/client-spots/' + id, { method: 'PUT', body: v })
      .then(loadBoard).catch(function (e) { toast(e.message); });
  });
}

function editPhoto(id) {
  var p = lb.list.filter(function (x) { return x.id === id; })[0];
  if (!p) return;
  ask('Edit photo', 'Comment and series are shown to the client; the filename is yours alone.', [
      { key: 'note', label: 'Your comment', value: p.note || '', multiline: true },
      {
        key: 'series', label: 'Series', value: p.series || '',
        options: seriesOptions(p.series), newLabel: 'Name of the new series',
      },
      { key: 'original_name', label: 'Filename (never shown to the client)', value: p.original_name || '' },
    ], function (v) {
      api('/api/admin/client-photos/' + id, { method: 'PUT', body: v })
        .then(function (saved) {
          p.note = saved.note;      // keep the open lightbox in sync
          p.series = saved.series;
          p.original_name = saved.original_name;
          paintLb(); render(); toast('Saved');
        }).catch(function (e) { toast(e.message); });
    });
}

function delSpot(id) {
  if (!confirm('Delete this spot with all its photos?')) return;
  api('/api/admin/client-spots/' + id, { method: 'DELETE' })
    .then(loadBoard).then(function () { toast('Spot deleted'); }).catch(function (e) { toast(e.message); });
}

function delPhoto(id) {
  if (!confirm('Delete this photo?')) return;
  api('/api/admin/client-photos/' + id, { method: 'DELETE' })
    .then(function () { closeLb(); return loadBoard(); })
    .then(function () { toast('Photo deleted'); }).catch(function (e) { toast(e.message); });
}

// Hidden file input, reused for every spot.
var picker = document.createElement('input');
picker.type = 'file';
picker.accept = 'image/jpeg,image/png,image/webp';
picker.multiple = true;
picker.style.display = 'none';
document.body.appendChild(picker);

// Carried between uploads: loading one series into several spots in a row is the
// normal rhythm, so the field comes back prefilled with the last one used.
var lastSeries = '';

// Files first, series second. Asking before the picker would put the modal's OK
// click between the button press and picker.click(), and a file dialog opened
// that far from a real tap gets blocked on mobile.
function pickPhotos(url) {
  picker.value = '';
  picker.onchange = function () {
    if (!picker.files.length) return;
    var files = Array.prototype.slice.call(picker.files);
    askSeries(files.length, function (series) { sendPhotos(url, files, series); });
  };
  picker.click();
}

// One series for the whole batch. Blank is allowed and means untagged — the
// board simply shows those photos without a label.
function askSeries(count, cb) {
  ask('Upload ' + count + ' photo' + (count === 1 ? '' : 's'),
    'Which series do these belong to? You can also tag them one by one on the board afterwards.', [
      {
        key: 'series', label: 'Series', value: lastSeries,
        options: seriesOptions(lastSeries), newLabel: 'Name of the new series',
      },
    ], function (v) { lastSeries = v.series || ''; cb(lastSeries); });
}

function sendPhotos(url, files, series) {
  var fd = new FormData();
  if (series) fd.append('series', series);
  files.forEach(function (f) { fd.append('photos', f); });
  toast('Uploading ' + files.length + ' photo' + (files.length === 1 ? '' : 's') + '…');
  api(url, { method: 'POST', body: fd })
    .then(loadBoard).then(function () { toast('Uploaded'); })
    .catch(function (e) { toast('Error: ' + e.message); });
}

function uploadTo(spotId) { pickPhotos('/api/admin/client-spots/' + spotId + '/photos'); }

// Straight onto a room that needs no spots — the server files them under the
// room's unnamed spot, creating it on the first upload.
function uploadToRoom(roomId) { pickPhotos('/api/admin/client-rooms/' + roomId + '/photos'); }

function setPassword() {
  ask('Set password', 'At least 6 characters. This is the password you give the client.', [
    { key: 'password', label: 'New password', value: '' },
  ], function (v) {
    if (!v.password) return;
    api('/api/admin/clients/' + SLUG + '/password', { method: 'PUT', body: v })
      .then(function () { toast('Password set'); }).catch(function (e) { toast(e.message); });
  });
}

// Photos uploaded before the filename was recorded: ask Cloudinary what the
// file arrived as. It reports honestly rather than claiming success, because the
// name is not guaranteed to still be on every asset — whatever it misses can be
// typed in from the photo's Edit dialog instead.
function recoverNames() {
  var btn = document.getElementById('ab-recover');
  btn.disabled = true;
  toast('Asking Cloudinary…');
  api('/api/admin/clients/' + SLUG + '/recover-filenames', { method: 'POST' })
    .then(function (r) {
      return loadBoard().then(function () {
        toast(!r.checked ? 'Every photo already has its filename'
          : 'Recovered ' + r.recovered + ' of ' + r.checked +
            (r.recovered < r.checked ? ' — add the rest by hand under Edit' : ''));
      });
    })
    .catch(function (e) { toast(e.message); })
    .then(function () { btn.disabled = false; });
}

// Which series the client may see. An unticked series is not merely unlabelled
// on his page — its photos never reach him. The list is built from the series
// that exist right now, so it needs no maintaining.
//   board.client.visible_series: null = no restriction · [] = nothing released
function releasedSeries() {
  var v = board.client.visible_series;
  return Array.isArray(v) ? v : null;
}

function isReleased(name) {
  var rel = releasedSeries();
  return !rel || rel.indexOf(name || '') >= 0;
}

function editSeriesVisibility() {
  var list = boardSeries();
  var checks = list.map(function (name) {
    return { value: name, label: name, checked: isReleased(name) };
  });
  if (allPhotos().some(function (p) { return !p.series; })) {
    checks.push({ value: '', label: 'Photos with no series', checked: isReleased('') });
  }
  if (!checks.length) return toast('Tag some photos with a series first');

  ask('What the client sees',
    'Untick a series to hold it back — its photos are then left out of his page entirely, ' +
    'while staying on the board for you. Ticking everything means no restriction at all, so ' +
    'series you add later stay visible too.', [
      { key: 'visible', label: 'Visible to the client', checks: checks },
      {
        key: 'names', label: '',
        checks: [{
          value: 'yes', label: 'Also show him the series names',
          checked: !!board.client.series_visible,
        }],
      },
    ], function (v) {
      if (!v.visible.length &&
          !confirm('Nothing is ticked — the client will see an empty board. Continue?')) return;
      // All ticked collapses to "no restriction" rather than a frozen list.
      var all = v.visible.length === checks.length;
      api('/api/admin/clients/' + SLUG + '/series-visibility', {
        method: 'PUT',
        body: { visible: all ? null : v.visible, show_names: v.names.indexOf('yes') >= 0 },
      }).then(loadBoard).then(function () { toast('Saved'); }).catch(function (e) { toast(e.message); });
    });
}

function syncSeriesBtn() {
  var btn = document.getElementById('ab-series');
  var rel = releasedSeries();
  var hasAny = seriesList.length > 0 || !!rel;
  btn.style.display = (isAdmin && hasAny) ? '' : 'none';
  btn.textContent = 'Client sees: ' + (!rel ? 'everything'
    : rel.length ? rel.map(function (s) { return s || 'untagged'; }).join(', ')
    : 'nothing');
}

// The button is only worth offering while something is actually missing a name.
function syncRecoverBtn() {
  var btn = document.getElementById('ab-recover');
  var missing = allPhotos().filter(function (p) { return !p.original_name; }).length;
  btn.style.display = (isAdmin && missing) ? '' : 'none';
  btn.textContent = 'Recover ' + missing + ' filename' + (missing === 1 ? '' : 's');
}

function markSeen() {
  api('/api/admin/clients/' + SLUG + '/mark-seen', { method: 'POST' })
    .then(loadBoard).then(function () { toast('Marked as read'); }).catch(function (e) { toast(e.message); });
}

function copyLink() {
  var url = location.origin + '/client/' + SLUG;
  if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { toast('Link copied'); });
  else toast(url);
}
</script>
